    url: https://oregonnews.uoregon.edu/lccn/sn00063698/1911-04-14/ed-1/seq-7/ocr/
    notes: "Exact steward-supplied page PDFs preserved for 31 March, 7 April, 14 April and 28 April 1911 at 505 Main; also 8 January 1913 Morning Enterprise. Related evidence E-026. Repository PDFs: newspapers/oregon-city-courier/1911-03-31-page-6-chicago-store-505-main.pdf; newspapers/oregon-city-courier/1911-04-07-page-6-chicago-store-505-main.pdf; newspapers/oregon-city-courier/1911-04-14-page-7-chicago-store-505-main.pdf; newspapers/oregon-city-courier/1911-04-28-page-7-chicago-store-505-main.pdf."

  - id: S-033
    name: City of Oregon City historic-resource record, 505 Main
    url: https://legacyorcity.teammunicode.com/planning/505-main-street
    notes: Official secondary construction interpretation and directory synthesis. The page says the 1983 survey indicated c.1908 but concludes from Sanborn-map comparison that the surviving building was constructed sometime between 1911 and 1925, perhaps about 1920. Treat c.1908 as superseded for the surviving building and c.1920 as tentative secondary interpretation, not primary construction proof. Related evidence E-032.

  - id: S-034
    name: Oregon City Courier, 10 October 1918, Wolf and Miller
    url: https://oregonnews.uoregon.edu/lccn/sn00063698/1918-10-10/ed-1/seq-4/
    notes: >-
      Visually verified page directly prints Wolf & Miller at 505 Main and also A. A. Mundin at 514 Main. Exact PDF preserved at newspapers/oregon-city-courier/1918-10-10-page-4-wolf-miller-505-main.pdf, SHA-256 bbed6092aa4743f7e86286c4c25f03544648bc1e523bf5d5da557d487af302c0. Related evidence E-027 and E-170; Wolf & Miller's 31 October 503 reading and A. A. Munden's separate 24 October 614 reading remain unresolved conflicts.

