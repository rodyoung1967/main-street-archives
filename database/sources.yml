  - id: S-001
    name: White Rabbit Black Ink article
    url: https://milwaukiereview.com/2017/09/13/white-rabbit-black-ink-opens-doors-on-main-street/
    notes: Secondary article reporting a 1919 construction date and Kwality connection. Treat 1919 as a reported c.1919 surviving-building estimate pending primary permit/assessor evidence. Its phrase “The Wheel Tavern” is retained only as source wording, not an accepted official name.

  - id: S-002
    name: New Kwality Cafe matchbook
    url: https://americandiners.blogspot.com/2015/
    notes: Web presentation/discovery page for primary artifact A-001 / IMG-0001. The artifact directly prints New Kwality Cafe, 503 Main, and J. Jager; its date remains unresolved.

  - id: S-003
    name: Larry's Kwality Cafe matchcover
    url: https://www.matchcovercollector.com/matchcover-category/food/food-rest/food-rest-cafe/page/138/
    notes: Web presentation/discovery page for primary artifact A-002 / IMG-0002. The artifact directly prints Larry's Kwality Cafe and 503 Main; Larry's identity and the artifact date remain unresolved.

  - id: S-004
    name: 505 Tavern / Thirsty Duck article
    url: https://milwaukiereview.com/2017/08/18/newest-old-bar-in-clackamas-county-reopens-in-oregon-city/
    notes: Secondary local-news source for Mike Berman's reported 2009 purchase, Scott Forvilly's 2017 purchase, and the Thirsty Duck reopening. It does not establish real-estate title or an uninterrupted business chain.

  - id: S-005
    name: Mitch Young direct oral history
    url: Internal oral-history note, oral-history/mitch-young.md
    notes: Trusted internal source for the testimony it records. Includes Mitch's statement, relayed by Rodney Young on 24 August 2026, that Dick and Sheila Wiitanen renamed the business 505 Tavern before selling it to their son Mitch. Still separate from formal documentary records.

  - id: S-006
    name: Young family ownership / stewardship context
    url: Internal family/project provenance note; formal source file pending.
    notes: Trusted internal project source for family/provenance context; formal ownership dates still require deeds, tax records, or assessor records.

  - id: S-007
    name: Tax statement / tax record materials
    url: Pending archive import/transcription.
    notes: Use for tax statements, assessor records, parcel descriptions, assessed improvements, and possible construction/addition clues.

  - id: S-008
    name: 503 / 505 building footprint field observation
    url: Internal owner observation; measurements, assessor sketches, Sanborn maps, deeds, and permits needed for confirmation.
    notes: Trusted internal field observation; physical/legal conclusions still require measurement and records.

  - id: S-009
    name: Thebeerchaser 505 Tavern comment screenshot
    url: Screenshot of public comment thread on thebeerchaser.com
    notes: Use as web-comment / local-memory evidence only; corroborate with formal records before using for business chronology.

  - id: S-010
    name: Time Capsule Maps photo metadata export
    url: Internal/project metadata export from Time Capsule Maps / Supabase photo records.
    notes: Trusted internal project source. Contains photo metadata for Main Street / 5th Street records, including 503/505/507 location notes.

  - id: S-011
    name: 505 Commercial Lease, 2025
    url: File Library upload - 505 Commerical Lease (2025) - Final.pdf
    notes: Current administrative/legal record for 505 Main Street, 505 LLC, Alin Guria, lease term July 1, 2025-June 30, 2030. Project-steward clarification on 24 August 2026 confirms Alin is the correct first name and earlier Alan wording was a typo.

  - id: S-012
    name: Harding Building fire research notes
    url: Internal project/oral-history notes and prior research discussion.
    notes: Preserves the earlier working claim that the 507 Harding Building fire occurred in late 1968 or 1969 and involved Tony's Restaurant and a bakery. The fire date/origin are superseded by E-045; the present replacement-building year is supported as 1968 at the historic-inventory level by S-063.

  - id: S-013
    name: Family relationship and death-date correction note
    url: Internal user correction / project note.
    notes: Grandmother's first marriage was Lafarlette and second marriage was Grisham. Richard / Dick died November 2024; Sheila died 2014.

