    name: 503 / 505 building footprint field observation
    url: Internal owner observation; measurements, assessor sketches, Sanborn maps, deeds, and permits needed for confirmation.
    notes: Trusted internal field observation; physical/legal conclusions still require measurement and records.

  - id: S-009
    name: Thebeerchaser 505 Tavern comment screenshot
