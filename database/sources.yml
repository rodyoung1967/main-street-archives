  - id: S-028
    name: Rodney Young family-history testimony, August 2026
    url: Internal / project oral history, including 16 August 2026 corrections
    notes: Raye bought The Wheel at 503; Ray Hansen sold 505 Tavern to Dick and Sheila; joint Rodney/Mitchell ownership. On 24 August 2026 Rodney also relayed Mitch's direct statement that the Wiitanens renamed the business 505 Tavern before Mitch acquired it.

