  - id: S-020
    name: 1911 Sanborn Sheet 22, Canemah
    url: maps/sanborn/originals/1911-22 (5th).pdf; original upload filename 1911-22 (5th)(1).pdf
    notes: November 1911 Sanborn sheet 22. Direct visual review shows the Canemah Water/Main/Center/Hill/Washington area, not the downtown 501/503/505/507 Main frontage. The 31 August 2026 upload 1911-22 (5th)(2).pdf is an exact byte duplicate of the canonical PDF (SHA-256 2b897a9bcbd69c9a1bb300130b59de987fc7fdad34f6fd129cb22fe080931e45), so no duplicate binary was committed. Related map SM-007.

  - id: S-021
    name: 1925 Sanborn, 5th Area
    url: https://www.orcity.org/DocumentCenter/View/4866/1925-6-PDF
    notes: May 1925 Sanborn sheet 6; repository binary at maps/sanborn/originals/1925-6 (5th).pdf. High-priority source for the separate 501 store, 503 restaurant, and 505 billiards/cigars uses. Task 6 corrected E-094's cadastral orientation to original Block 4; the former Block 26 Lot 5/Lot 6 scale alignment is withdrawn. Related map SM-008. E-182 adds the visually verified May 1925 427 corner/laundry spatial and use context; no backdating to Newton in 1922.

  - id: S-022
    name: 1950 Sanborn, 5th Area
    url: https://www.orcity.org/DocumentCenter/View/4899/1950-6-PDF
    notes: May 1925 base sheet revised through 1950; repository binary at maps/sanborn/originals/1950-6 (5th).pdf. Original upload filename 1950-6 (5th)(1).pdf. Canonical city URL corrected August 2026 during E-102 footprint pass. Related map SM-009.

