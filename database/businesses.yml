  - id: BUS-005
    name: 505 Tavern
    address: 505 Main
    notes: 505 Main business, separate from The Wheel at 503. Documented in 1965 and 1972 liquor renewals and a 1976 classified. Family history places Ray Hansen in the earlier chain, followed by a Dick/Sheila Wiitanen Brass Rail period. Dick and Sheila operated Brass Rail before they owned the 505 building, then later purchased the 505 real estate from Mrs. Nesmeth/Nemeth. After becoming landlords, later Wiitanen business-control periods may have involved sale/repo/default/transfer rather than continuous operation. Mitch / Mitchell (C.) Young ran 505 Tavern March 1991-March 2004; do not claim he restored the name or building.
