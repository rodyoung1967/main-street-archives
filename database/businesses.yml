  - id: BUS-024
    name: Palace Saloon
    address: 501 Main exact in March 1912; Fifth/Main in 1909-1912 notices; one 17 Jun 1910 Palace notice prints conflicting 510 Main
    notes: 6 April 1900 report has Albert Knapp purchasing Palace Saloon opposite the post office/on a corner; 24 February 1905 reports A. Knapp selling Palace to A. J. Surber. May 1907 lists the trade name citywide and July 1907 places Palace on Fifth Street. On 25 June 1909 Ralph O. Smith is reported buying former partner F. E. Hall's Palace interest and applies the same day at Palace Saloon, Fifth/Main; Smith applies again there in September 1909 and on 31 December 1909 requests a six-month license. On 17 June 1910 E. R. Case directly applies at the Palace Saloon with the printed address 510 Main; this is preserved as an unresolved conflict/transition question, not normalized to 501. Joseph Wilson applies at Palace, Fifth/Main in March and June 1911; Joe Wilson is exact 501 in March 1912 and Joseph Wilson is again Fifth/Main in June 1912. Early exact number, license grants, property title and uninterrupted succession remain unproved. The Ralph O. Smith three-month Fifth/Main application
      appears on both 25 June and 2 July 1909. E. R. Case's Palace notice prints 510 Main in both 17 and 24 June 1910 issues; the repeat strengthens the printed-address evidence but does not resolve 510 versus later Palace 501 or later Pacific Telephone 510.
