  - id: BUS-010
    name: Brass Rail Tavern
    address: 505 Main
    notes: Family history says Dick and Sheila Wiitanen operated Brass Rail at 505 Main before they owned the building, after the earlier Ray Hansen / 505 Tavern period. They later purchased the 505 real estate from Mrs. Nesmeth/Nemeth. April 1988 Commission minutes call The Dug Inn formerly The Brass Rail at 505 Main and document a Wiitanen-to-Cotterell change-of-ownership application. Later Wiitanen transfer appearances should be interpreted within the post-property-purchase sale/repo/default cycle, not as proof of continuous operation. 1981 Sandy Post ad is Troutdale and withdrawn.
