  - id: P-017
    name: Wiitanen family
    role: Family history context
    notes: User's mother Sheila and stepfather Richard / Dick were Wiitanens. At 505, their Brass Rail operation preceded their later purchase of the building. After a later business-control/repo interval, they renamed the business 505 Tavern before selling it to their son Mitch in March 1991. Wiitanen property ownership then continued through Dick's November 2024 death.
