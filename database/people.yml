  - id: P-011
    name: Mitch / Mitchell (C.) Young
    role: Owner/operator / later 505 co-owner
    notes: Same person as P-018; son of the Wiitanens. Name variants Mitch Young, Mitchell Young, Mitch C. Young, and Mitchell C. Young are one person. Acquired the already-named 505 Tavern in March 1991 and ran it at 505 Main Street through March 2004. Do not claim he introduced or restored the name. Do not label this period The Wheel. Inherited 505 Main with Rodney from Dick's estate after November 2024.
    related_buildings:
