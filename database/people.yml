  - id: P-007
    name: Richard / Dick Wiitanen
    role: 503 Wheel business owner; Brass Rail operator; later 505 property owner
    notes: Oregonian August 1985 names Richard M. Wiitanen as owner of The Wheel Cafe business at 503 Main. Family history says Dick and Sheila ran Brass Rail at 505 before owning that building, then later purchased the 505 real estate from Mrs. Nesmeth/Nemeth. Before selling the business to their son Mitch in March 1991, they renamed it 505 Tavern. A 2017 permit confirms continuing 505 property interest. Died November 2024; the 505 building then passed through his estate to Rodney and Mitch.
    related_buildings:
      - B-001
      - B-002
    related_businesses:
      - BUS-004
      - BUS-005
      - BUS-010
      - BUS-016

  - id: P-008
    name: Sheila Wiitanen
    role: Brass Rail operator; later 505 property owner; 503 Wheel context
    notes: Daughter of Floyd and Raye LaFarlette. Operated Brass Rail at 505 with Dick before they owned the building; later co-purchased the 505 real estate from Mrs. Nesmeth/Nemeth. Before selling the business to their son Mitch in March 1991, she and Dick renamed it 505 Tavern. Also associated with the later Wiitanen Wheel period at 503. Died 2014; Wiitanen ownership of 505 continued through Dick's death in 2024.
    related_buildings:
      - B-001
      - B-002
    related_businesses:
