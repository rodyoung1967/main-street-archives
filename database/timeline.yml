timeline:
  - id: T-001
    date: Pre-1840s
    summary: The site was part of the area that became Oregon City's earliest commercial district near the falls and riverfront.
    confidence: Needs supporting evidence

  - id: T-002
    date: Late 1880s-Early 1900s
    summary: Sanborn maps document developed commercial frontage, but the archive has not established that the surviving 503 or 505 structures date from this period.
    confidence: High for early commercial frontage; unresolved for surviving-building identity
    related_buildings:
      - B-001
      - B-002

  - id: T-003
    date: c.1909 (legacy claim)
    summary: A legacy archive statement placed Dr. Bailey's dental practice upstairs in the Harding Building, but its supporting source has not been located. A museum catalog photo identifies a Dr. Bailey in a group with G. H. Young; it does not establish the office location or date.
    confidence: Unverified; do not cite as established occupancy
    related_people:
      - P-002
    related_buildings:
      - B-003

  - id: T-004
    date: c.1919 (secondary-source estimate)
    summary: A 2017 article and the visually checked 2000 City inventory report a c.1919 date for the surviving 503 building. This is not primary construction proof and does not date first use of the 503 address.
    confidence: Moderate for the reported estimate; primary construction date unresolved
    related_evidence:
      - E-001
    related_buildings:
      - B-001

  - id: T-005
    date: 1940s-1950s
    summary: 503 Main housed the Kwality Cafe / New Kwality Cafe / Larry's Kwality Cafe.
    confidence: Strong for Kwality Cafe associations; exact dates unresolved
    related_evidence:
      - E-002
      - E-003
    related_buildings:
      - B-001
    related_businesses:
      - BUS-001
      - BUS-002
      - BUS-003

  - id: T-006
    date: 1 September 1967
    summary: Oregonian of 2 September 1967 reports a Friday-night fire on Main between 5th and 6th. Harding Drug Store and Dixon's Bakery were gutted; Wheel Restaurant and 505 Tavern were spared with smoke and water damage; reported origin was the Howard Cohn furniture warehouse. An official 2021 inventory dates the present 507-511 replacement building to 1968; primary construction records remain pending.
    confidence: Very High for newspaper fire facts; High for the 1968 historic-inventory date; primary replacement-project details unresolved
    related_evidence:
      - E-045
      - E-016
      - E-017
    related_buildings:
      - B-001
      - B-002
      - B-003
    related_businesses:
      - BUS-004
      - BUS-005
      - BUS-007
      - BUS-023

  - id: T-007
    date: March 1991-March 2004
    summary: Before the March 1991 sale, Dick and Sheila Wiitanen renamed the business 505 Tavern. Their son Mitch / Mitchell (C.) Young acquired it under that existing public/trade name and ran it at 505 Main Street through March 2004. This period is not The Wheel.
    confidence: Very High for dates, role, 505 Main, and public/trade name at acquisition; High for the pre-sale Wiitanen rename
