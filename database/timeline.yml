  - id: T-008
    date: 2017
    summary: 505 Tavern was sold and reopened as Thirsty Duck. White Rabbit Black Ink opened at 503 Main.
    confidence: Strong for 505 Tavern / Thirsty Duck transition; separate support needed for White Rabbit Black Ink details
