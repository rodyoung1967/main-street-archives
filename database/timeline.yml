  - id: T-007
    date: March 1991-March 2004
    summary: Before the March 1991 sale, Dick and Sheila Wiitanen renamed the business 505 Tavern. Their son Mitch / Mitchell (C.) Young acquired it under that existing public/trade name and ran it at 505 Main Street through March 2004. This period is not The Wheel.
    confidence: Very High for dates, role, 505 Main, and public/trade name at acquisition; High for the pre-sale Wiitanen rename
