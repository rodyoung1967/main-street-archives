  - id: T-006
    date: 1 September 1967
    summary: Oregonian of 2 September 1967 reports a Friday-night fire on Main between 5th and 6th. Harding Drug Store and Dixon's Bakery were gutted; Wheel Restaurant and 505 Tavern were spared with smoke and water damage; reported origin was the Howard Cohn furniture warehouse. An official 2021 inventory dates the present 507-511 replacement building to 1968; primary construction records remain pending.
    confidence: Very High for newspaper fire facts; High for the 1968 historic-inventory date; primary replacement-project details unresolved
