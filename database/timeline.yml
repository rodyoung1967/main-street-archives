    date: 2017
    summary: 505 Tavern was sold and reopened as Thirsty Duck. An April 2017 permit for a UL-300 hood fire system at 505 Tavern still lists Richard Martin Wiitanen as owner/co-trustee of the 505 real estate. White Rabbit Black Ink opened at 503 Main.
    confidence: Strong for 505 Tavern / Thirsty Duck transition; very high for 2017 permit-era 505 real-estate facts; separate support needed for White Rabbit Black Ink article details
