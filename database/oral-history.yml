oral-history:
  - id: OH-001
    title: Mitch Young Direct Testimony
    person: P-011
    related_businesses:
      - BUS-009
      - BUS-005
    related_evidence:
      - E-004
      - E-022
    summary: Mitch / Mitchell (C.) Young (same person; P-011 / P-018) ran 505 Tavern at 505 Main Street from March 1991 to March 2004. His further direct statement, relayed by Rodney Young on 24 August 2026, establishes that Dick and Sheila Wiitanen renamed the business 505 Tavern before selling it to their son Mitch. He acquired it under that existing public/trade name; this period is not The Wheel. Exact rename date and formal license/entity wording remain open.
    evidence_type: Primary participant testimony, with the naming clarification relayed by the family/project steward
    confidence: Very High for dates, role, 505 Main, and public/trade name at acquisition; High for the pre-sale Wiitanen rename
    follow_up_questions:
      - When exactly did Dick and Sheila rename the business 505 Tavern, and did the rename immediately follow repossession?
      - What exact name and entity appeared on the OLCC license, business registration, and March 1991 sale documents?
      - Who owned or operated the business immediately after March 2004?
      - What was the relationship between the bar operation and restaurant operation?
      - Does Mitch remember Ray Hansen, Raye Grisham, Richard / Dick, Sheila, Willie, Victor, or Mike Berman?
      - Are there surviving photographs, menus, business cards, licenses, matchbooks, advertisements, or employee records from this period?
