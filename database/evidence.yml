  - id: E-022
    name: August 2026 Family Identity, Address, Business-Separation, and 505 Property Corrections
    type: Direct user / family confirmation
    claims:
      - Raye LaFarlette and Raye Grisham are the same woman; the surname change followed divorce/remarriage and is not evidence of a Wheel business transfer.
      - Raye bought The Wheel at 503 Main.
      - The Wheel was only at 503 Main and was never a 505 Main business.
      - '"The Wheel Tavern" was never an official name; that phrase survives only as wording in the 2017 secondary article E-001.'
      - Ray Hansen is a different person associated with the separate 505 Tavern history.
      - The 503 Wheel business and 505 tavern business had separate ownership/operator chains.
      - Dick and Sheila Wiitanen ran Brass Rail at 505 Main for a period before they owned the building.
      - Dick and Sheila later purchased the 505 Main real estate from a woman remembered as Mrs. Nesmeth / Nemeth; exact spelling is uncertain.
      - The earlier archive statement placing the Mrs. Nemeth purchase at 503 Main is superseded.
      - After the 505 purchase, Wiitanen property ownership continued through Richard / Dick Wiitanen's death in November 2024; Sheila died in 2014.
      - The 505 building then passed to Rodney Young and Mitchell Young as part of Dick's estate.
      - After Dick and Sheila became 505 landlords, later Wiitanen business-transfer appearances may represent sale, repossession, non-payment/default, or transfer intervals rather than continuous tavern operation.
      - Working family interpretation is that the later Raye Grisham to Wiitanen transition at The Wheel was a sale of the 503 business, not proof of 503 real-estate ownership.
      - Before selling the business to their son Mitch in March 1991, Dick and Sheila Wiitanen had renamed it 505 Tavern.
      - Mitch / Mitchell (C.) Young acquired it under that existing name and ran it 1991-2004; do not say he introduced or restored the name.
      - Mitch Young and Mitchell C. Young are the same person.
    confidence: High as current family confirmation for identity, address, naming, Brass Rail/business-property sequence, and estate succession; documentary deeds/licenses/probate still desirable for exact dates and legal mechanics.
