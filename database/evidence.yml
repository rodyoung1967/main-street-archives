    name: August 2026 Family Identity, Address, Business-Separation, and 505 Property Corrections
    type: Direct user / family confirmation
    claims:
      - Raye LaFarlette and Raye Grisham are the same woman; the surname change followed divorce/remarriage and is not evidence of a Wheel business transfer.
      - Raye bought The Wheel at 503 Main.
      - The Wheel was only at 503 Main and was never a 505 Main business.
      - '"The Wheel Tavern" was never an official name; that phrase survives only as wording in the 2017 secondary article E-001.'
