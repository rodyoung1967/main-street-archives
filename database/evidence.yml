  - id: E-021
    name: "Aerial Photocompare Series: 5th & Main / McLoughlin Context"
    type: Aerial photograph evidence
    claims:
      - Oregon City photocompare aerial series 1929-2025 centered on 5th and Main shows McLoughlin Blvd / US99E labeling by 1929.
      - A wider graded highway corridor west of Main appears by 1936.
      - The 1936 frame shows three distinct roofs at 501, 503, and 505 Main.
      - By 1944 the 501 Main footprint is absent; the east-side building across from 500 Main is also no longer present.
      - 501 Main was removed between 1936 and 1944.
      - Remaining Main-frontage structures north of the former 501 corner persist through mid-century.
      - 1996 flood frame shows high water near riverfront / McLoughlin corridor.
    confidence: Moderate to high for 501 existence in 1936 and removal by 1944; moderate for highway/corridor labeling; not sufficient alone for business names, ownership, or legal cause of demolition.
    related_sources:
      - S-023
    related_buildings:
      - B-001
      - B-002
      - B-003

