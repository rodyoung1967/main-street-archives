  - id: E-021
    name: "Aerial Photocompare Series: 5th & Main / McLoughlin Context"
    type: Aerial photograph evidence
    claims:
      - Oregon City photocompare aerial series 1929-2025 centered on 5th and Main shows McLoughlin Blvd / US99E labeling by 1929.
      - A wider graded highway corridor west of Main appears by 1936.
      - The 1936 frame shows three distinct roofs at 501, 503, and 505 Main.
      - By 1944 the 501 Main footprint is absent; the east-side building across from 500 Main is also no longer present.
      - 501 Main was removed between 1936 and 1944.
      - Remaining Main-frontage structures north of the former 501 corner persist through mid-century.
      - 1996 flood frame shows high water near riverfront / McLoughlin corridor.
    confidence: Moderate to high for 501 existence in 1936 and removal by 1944; moderate for highway/corridor labeling; not sufficient alone for business names, ownership, or legal cause of demolition.
    related_sources:
      - S-023
    related_buildings:
      - B-001
      - B-002
      - B-003

  - id: E-022
    name: August 2026 Family Identity, Address, and Business-Separation Corrections
    type: Direct user / family confirmation
    claims:
      - Raye LaFarlette and Raye Grisham are the same woman; the surname change followed divorce/remarriage and is not evidence of a Wheel business transfer.
      - Raye bought The Wheel at 503 Main.
      - The Wheel was only at 503 Main and was never a 505 Main business.
      - '"The Wheel Tavern" was never an official name; that phrase survives only as wording in the 2017 secondary article E-001.'
      - Ray Hansen is a different person associated with the separate 505 Tavern history.
      - The 503 Wheel business and 505 tavern business had separate ownership/operator chains.
      - While Dick and Sheila ran The Wheel, they also owned the 505 building, but that real-estate ownership did not mean they ordinarily ran the 505 business.
      - Any Dick/Sheila 505 business control may have been brief during repossession, non-payment/default, or a transfer interval.
      - Working family interpretation is that the later Raye Grisham to Wiitanen transition at The Wheel was a sale of the 503 business; exact date, terms, and license documents remain pending.
      - Mitch / Mitchell (C.) Young ran 505 Tavern 1991-2004; do not claim he restored it.
      - Mitch Young and Mitchell C. Young are the same person.
      - After Richard Wiitanen's death, 505 real estate passed to Rodney Young and Mitchell Young jointly.
    confidence: High as current family confirmation for identity, address, naming, and separation rules; moderate as to exact repossession chronology and Grisham-to-Wiitanen sale mechanics pending primary records.
