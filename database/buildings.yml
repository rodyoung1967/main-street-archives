  - id: B-003
    name: 507 Main Street / Harding Building
    address: 507-511 Main Street, Oregon City, Oregon
    notes: Original Harding Building / Harding Drug Store context. E-107 gives separate 1915 listings at 507 (W. W. Bradley), 509 (H. P. Brightbill) and 511 (Geo. A. Harding); not proof of a shared historic footprint or continuous occupancy. Gutted in the 1 September 1967 Main Street fire (E-045). ODOT's 2021 cultural-resources table dates the present replacement Harding Building at 507-511 Main to 1968 (S-063), resolving the prior 1968/1969 replacement-date question at the inventory level.
