  - id: B-004
    name: 527 Main Street / Swartz Building
    address: 527 Main Street, Oregon City, Oregon
    notes: Present Swartz Building is dated 1935 by the City of Oregon City 2000 downtown historic-resource survey and ODOT's 2021 cultural-resources table. Bailey & Price is documented at 527 Main on 5 January 1912, so the 1912 business occupied a predecessor building/storefront at the same address unless later address-renumbering evidence changes that interpretation. The present 1935 building predates the 1 September 1967 fire and therefore was not a wholesale post-fire replacement. City report notes later entrance alteration.
    related_sources:
      - S-061
      - S-062
      - S-063

  - id: B-005
    name: 501 Main Street (historic / removed)
    address: 501 Main Street, Oregon City, Oregon
    notes: 1925 Sanborn directly labels 501 as a separate store at/near the 5th/Main corner. A 1936 aerial shows a distinct 501 structure; it is gone by 1944. Primary newspaper ads place R. L. Holman / Holman & Randall undertaking business at Fifth and Main in 1915-1917, but no recovered source yet proves that Fifth-and-Main premises carried the number 501. The 1925 store tenant remains unknown.
