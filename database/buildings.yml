  - id: B-003
    name: 507 Main Street / Harding Building
    address: 507-511 Main Street, Oregon City, Oregon
    repository_file: buildings/507-harding-building.md
    notes: Original Harding Building / Harding Drug Store context. E-128 directly places Geo. A. Harding at 511 in January 1911, and E-107 gives separate 1915 listings at 507 (W. W. Bradley), 509 (H. P. Brightbill) and 511 (Harding); these do not prove a shared historic footprint or continuous occupancy. E-129 directly places Dixon's Pastry Shop at 509 in June 1964; E-130 is an unnamed 509 baking-and-coffee-shop sale offer in December 1965 and is not automatically assigned to Dixon's. Dixon's Bakery and Harding Drug were gutted in the 1 September 1967 Main Street fire (E-045), but the exact 1967 room arrangement remains open. ODOT's 2021 cultural-resources table dates the present replacement Harding Building at 507-511 Main to 1968 (S-063), resolving the prior 1968/1969 replacement-date question at the inventory level.
