  - id: B-002
    name: 505 Main Street
    address: 505 Main Street, Oregon City, Oregon
    notes: Associated with 505 Tavern, Brass Rail, Dug Inn, Thirsty Duck, rear-addition questions, and 505 LLC. The Wheel was only at 503 and is not a 505 business. Dick and Sheila ran Brass Rail at 505 before they owned the building, then later purchased the 505 real estate from Mrs. Nesmeth/Nemeth. Wiitanen property ownership continued through Dick's Nov. 2024 death, after which the building passed through his estate to Rodney and Mitchell Young.
