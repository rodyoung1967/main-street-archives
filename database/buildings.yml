  - id: B-002
    name: 505 Main Street
    address: 505 Main Street, Oregon City, Oregon
    notes: Associated with 505 Tavern, Brass Rail, Dug Inn, Thirsty Duck, rear-addition questions, and 505 LLC. The Wheel was only at 503 and is not a 505 business. Dick and Sheila ran Brass Rail at 505 before they owned the building, then later purchased the 505 real estate from Mrs. Nesmeth/Nemeth. Wiitanen property ownership continued through Dick's Nov. 2024 death, after which the building passed through his estate to Rodney and Mitchell Young. The July 1922 Gates/Wolf division does not decide whether 505 adjoined Wolf's remainder or lay within it. The 28 August 2026 model test (E-108) selects neither simple Gates/Wolf model; 501 remains live. Post-fire footprint, pre-fire division and actual ignition room require separate proof; see the Task 8 handoff.
