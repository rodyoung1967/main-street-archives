  - id: B-002
    name: 505 Main Street
    address: 505 Main Street, Oregon City, Oregon
    repository_file: buildings/505-main.md
    context_only: E-139/S-157 corrects the April 30, 1925 Main-between-Fifth-and-Sixth fire to approximately $15 damage. No side or numbered premises is stated; not an identified 505 fire or reconstruction.
    notes: CCHS catalogs an 1880/1880s Harding Drug Store photo at 505 (address may be retrospective) and a 1910 Young's Secondhand Store image visibly shows 505; neither proves continuity with the surviving building. Later associated with 505 Tavern, Brass Rail, Dug Inn, Thirsty Duck, rear-addition questions, and 505 LLC. The Wheel was only at 503. Dick and Sheila ran Brass Rail before owning the building, then bought the real estate from Mrs. Nesmeth/Nemeth. Wiitanen property ownership continued through Dick's Nov. 2024 death, after which the building passed through his estate to Rodney and Mitchell Young. The legacy City page says the 1983 survey indicated c.1908 but explicitly supersedes that date for the surviving building, placing construction from Sanborn comparison sometime between 1911 and 1925 and only tentatively around 1920. The July 1922 Gates/Wolf division and 28 August model test do not decide the exact 505 role; post-fire footprint, pre-fire division and ignition room require separate proof. Newton's saved Quality restaurant is reported across the way from the laundry (E-180); the June Quality Restaurant ad directly prints 427 Main, phone 517 (E-179), without proprietor. Newton → 427 remains PROBABLE / WORKING HYPOTHESIS. No recovered source places his saved restaurant at 503 or selects Gates Model A/B. The exact fire-origin room and adjoining pool hall remain unassigned.

