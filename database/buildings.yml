  - id: B-001
    name: 503 Main Street
    address: 503 Main Street, Oregon City, Oregon
    notes: Associated with Kwality Cafe lineage and The Wheel, which was only at 503. Raye LaFarlette / Raye Grisham is the same person; working family interpretation is that the later Grisham-to-Wiitanen Wheel transition was a business sale. The former archive claim that Dick and Sheila bought the 503 building from Mrs. Nemeth/Nesmeth is superseded; that purchase belongs to 505. The July 1922 Gates/Wolf division leaves 503 unresolved between two models; it may begin Wolf's remainder or belong to Gates's two-store corner replacement. Also includes c.1919 surviving-building estimate and 503/505 boundary questions. The 28 August 2026 model test (E-108) selects neither simple Gates/Wolf model; 501 remains live. Post-fire footprint, pre-fire division and actual ignition room require separate proof; see the Task 8 handoff.
