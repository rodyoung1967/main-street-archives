    name: 503 Main Street
    address: 503 Main Street, Oregon City, Oregon
    notes: Associated with Kwality Cafe lineage and The Wheel, which was only at 503. Raye LaFarlette / Raye Grisham is the same person; working family interpretation is that the later Grisham-to-Wiitanen Wheel transition was a business sale. The former archive claim that Dick and Sheila bought the 503 building from Mrs. Nemeth/Nesmeth is superseded; that purchase belongs to 505. Also includes c.1919 surviving-building estimate and 503/505 boundary questions.
