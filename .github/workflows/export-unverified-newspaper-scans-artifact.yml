name: Export unverified newspaper scans artifact

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-unverified-newspaper-scans-artifact.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload recovered scans
        uses: actions/upload-artifact@v4
        with:
          name: unverified-newspaper-scans-2026-09-11
          path: newspapers/unverified-recovery-2026-09-11/
          retention-days: 14
