name: Integrate CCHS P-370 Young Curio Store

on:
  push:
    branches:
      - temp/ingest-cchs-p370-young-curio
    paths:
      - scripts/integrate_cchs_p370_young_curio.py
      - .github/workflows/integrate-cchs-p370-young-curio.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Validate baseline
        run: |
          git worktree add /tmp/main-baseline origin/main
          (cd /tmp/main-baseline && python3 scripts/validate_archive.py)
          git worktree remove /tmp/main-baseline

      - name: Integrate CCHS P-370
        run: python3 scripts/integrate_cchs_p370_young_curio.py

      - name: Normalize generated text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('registers/research-log.md')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'(?<!MOT:)\bP-370\b', 'MOT:P-370', s)
          p.write_text(s, encoding='utf-8')

          p = Path('media/photos/inventory.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Audit date: **4 September 2026**  \n', 'Audit date: **4 September 2026**\n')
          p.write_text(s, encoding='utf-8')

          p = Path('media/photos/early-main-street/README.md')
          s = p.read_text(encoding='utf-8')
          p.write_text(s.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate integrated archive
        run: python3 scripts/validate_archive.py

      - name: Commit integration tree
        run: |
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "Add CCHS P-370 Young Curio storefront photo"
          git push --force-with-lease origin HEAD:temp/ingest-cchs-p370-young-curio
