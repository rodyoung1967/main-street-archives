name: Fetch unverified newspaper scans 2026-09-11

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-unverified-newspaper-scans-2026-09-11.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Validate archive before fetch
        run: python3 scripts/validate_archive.py
      - name: Fetch unresolved original scans
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, requests, time
          issues = [
            ('oregon-city-enterprise','sn00063700','1916-01-14',8),
            ('oregon-city-enterprise','sn00063700','1916-02-04',8),
            ('oregon-city-enterprise','sn00063700','1916-02-11',10),
            ('oregon-city-enterprise','sn00063700','1916-02-18',10),
            ('morning-enterprise','sn00063701','1912-03-24',8),
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'main-street-archives visual verification recovery'})
          root=pathlib.Path('newspapers/unverified-recovery-2026-09-11')
          for title,lccn,date,pages in issues:
            out=root/title/date; out.mkdir(parents=True,exist_ok=True)
            attempts=[]
            for seq in range(1,pages+1):
              url=f'https://oregonnews.uoregon.edu/lccn/{lccn}/{date}/ed-1/seq-{seq}.pdf'
              row={'sequence':seq,'url':url}
              try:
                r=s.get(url,timeout=90,allow_redirects=True)
                row.update(status=r.status_code,content_type=r.headers.get('content-type',''),bytes=len(r.content),sha256=hashlib.sha256(r.content).hexdigest(),final_url=r.url)
                if r.status_code==200 and r.content.startswith(b'%PDF'):
                  name=f'{date}-page-{seq}.pdf'; (out/name).write_bytes(r.content); row['saved_as']=name
              except Exception as e: row['error']=repr(e)
              attempts.append(row); time.sleep(.1)
            (out/'fetch-manifest.json').write_text(json.dumps({'title':title,'lccn':lccn,'date':date,'expected_pages':pages,'attempts':attempts},indent=2)+'\n')
          PY
      - name: Validate archive after fetch
        run: python3 scripts/validate_archive.py
      - name: Commit fetched scans
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add newspapers/unverified-recovery-2026-09-11/
          if git diff --cached --quiet; then echo 'No fetch changes'; exit 0; fi
          git commit -m 'Preserve unverified newspaper scans for visual review'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
