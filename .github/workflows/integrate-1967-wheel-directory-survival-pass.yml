name: Integrate 1967 Wheel directory and record-survival pass

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_1967_wheel_directory_survival_pass.py'
      - '.github/workflows/integrate-1967-wheel-directory-survival-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Integrate directory and record-survival pass
        run: python3 scripts/integrate_1967_wheel_directory_survival_pass.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit integrated records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence businesses registers MANUAL-FOLLOWUP.md
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Record 1967 Wheel directory and records-survival controls'
          git pull --rebase origin main
          git push origin HEAD:main
