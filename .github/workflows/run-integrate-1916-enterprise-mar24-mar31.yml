name: Integrate 1916 Enterprise Mar 24 and Mar 31 review

on:
  push:
    paths:
      - 'scripts/maintenance/integrate_1916_enterprise_mar24_mar31.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Integrate records
        run: python3 scripts/maintenance/integrate_1916_enterprise_mar24_mar31.py
      - name: Validate archive before commit
        run: python3 scripts/validate_archive.py
      - name: Commit integration
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add evidence/source-captures/1916-enterprise-march24-visual-review-2026-09-11.md evidence/source-captures/1916-enterprise-march31-visual-review-2026-09-11.md evidence/source-register.md evidence/evidence-register.md database/sources.yml database/evidence.yml registers/year-status.md evidence/source-captures/1916-online-audit-checkpoint.md evidence/1912-main-street-postoffice-cluster.md
          if git diff --cached --quiet; then echo 'No integration changes'; exit 0; fi
          git commit -m 'Certify Mar 24 and Mar 31 1916 Enterprise reviews'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
