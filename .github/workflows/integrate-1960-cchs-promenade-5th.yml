name: Integrate 1960 CCHS Promenade at 5th Street photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-1960-cchs-promenade-5th.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration dependencies
        run: python3 -m pip install --quiet pyyaml pillow
      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py
      - name: Retrieve exact CCHS object and integrate photo
        run: python3 scripts/integrate_1960_cchs_promenade_5th_view.py
      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py
      - name: Commit, rebase onto newest main, validate, and push
        run: |
          git config user.name 'main-street-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'Add CCHS 1960 Promenade Fifth Street downtown view'
          git fetch origin main
          git rebase origin/main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
