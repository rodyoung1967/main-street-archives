name: Finalize CCHS P-1469 photo

on:
  push:
    branches:
      - 'temp/ingest-p1469-1890-flood'
    paths:
      - '.github/workflows/finalize-p1469-photo.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    env:
      BASE_MAIN: 8e74aafe62615e435de829cdda915dec04e850f3
      TARGET: media/photos/early-main-street/IMG-0732_1890-main-street-flood-cchs-p1469.jpg
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve staged inputs
        run: |
          mkdir -p /tmp/p1469
          cp .ingest/p1469/chunk*.b64 /tmp/p1469/
          cp .ingest/p1469/finalize.py /tmp/p1469/finalize.py
          test -s /tmp/p1469/chunk00.b64
          test -s /tmp/p1469/chunk01.b64
          test -s /tmp/p1469/finalize.py

      - name: Confirm authoritative main and reset integration base
        run: |
          git fetch origin main
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          echo "origin/main=$ACTUAL_MAIN"
          test "$ACTUAL_MAIN" = "$BASE_MAIN"
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --quiet pyyaml

      - name: Validate authoritative base
        run: python3 scripts/validate_archive.py

      - name: Reassemble and verify P-1469 JPEG
        run: |
          mkdir -p "$(dirname "$TARGET")"
          cat /tmp/p1469/chunk*.b64 | base64 --decode > "$TARGET"
          test -s "$TARGET"
          head -c 3 "$TARGET" | od -An -tx1
          test "$(head -c 3 "$TARGET" | xxd -p)" = "ffd8ff"

      - name: Integrate photograph metadata
        run: python /tmp/p1469/finalize.py

      - name: Validate completed archive
        run: python3 scripts/validate_archive.py

      - name: Commit clean integration on staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/photos/early-main-street/IMG-0732_1890-main-street-flood-cchs-p1469.jpg
          git add media/photo-metadata-register.md media/photos/inventory.md media/photos/early-main-street/README.md
          git add evidence/source-captures/1890-main-street-flood-p1469-photo-preservation-2026-09-02.md
          git add indexes/id-crosswalk.md registers/research-log.md
          git status --short
          git commit -m 'Preserve CCHS P-1469 1890 Main Street flood photograph'
          git push --force-with-lease origin HEAD:temp/ingest-p1469-1890-flood
