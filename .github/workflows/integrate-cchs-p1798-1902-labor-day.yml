name: Integrate CCHS P-1798 1902 Labor Day Fifth-Main

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_cchs_p1798_1902_labor_day_fifth_main.py'
      - '.github/workflows/integrate-cchs-p1798-1902-labor-day.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pillow pyyaml
      - name: Integrate P-1798 photograph
        run: python3 scripts/integrate_cchs_p1798_1902_labor_day_fifth_main.py
      - name: Normalize generated record names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('database/sources.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('name: "CCHS P-1798 — Labor Day parade at Fifth and Main, 1 September 1902"', 'name: "CCHS P-1798, Labor Day parade at Fifth & Main, 1 September 1902"')
          p.write_text(s, encoding='utf-8')
          p = Path('database/evidence.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('name: "1902 Fifth/Main photograph shows low-profile predecessor-era commercial form and readable advertising"', 'name: "1902 Fifth/Main photograph shows a low-profile predecessor-era commercial form and readable advertising, but no secure occupant name"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit integration
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CCHS P-1798 1902 Fifth-Main parade photo'
          git pull --rebase origin main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
