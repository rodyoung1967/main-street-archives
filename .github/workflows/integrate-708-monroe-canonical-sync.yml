name: Integrate 708 Monroe canonical synchronization

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_708_monroe_canonical_sync.py'
      - '.github/workflows/integrate-708-monroe-canonical-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-708-monroe-canonical-sync
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize latest main
        run: git pull --rebase origin main
      - name: Install validator dependency
        run: pip install PyYAML
      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py
      - name: Integrate 708 Monroe canonical records
        run: python3 scripts/integrate_708_monroe_canonical_sync.py
      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Canonicalize 708 Monroe recreation-rent separation'
          git pull --rebase origin main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
