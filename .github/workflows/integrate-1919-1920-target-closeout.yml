name: Integrate 1919-1920 construction occupancy closeout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-1919-1920-target-closeout.yml"
      - "scripts/integrate_1919_1920_target_closeout.py"
      - "scripts/clarify_503_survey_provenance.py"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate archive before historical integration
        run: python3 scripts/validate_archive.py

      - name: Correct integration serializer and integrate closeout
        shell: bash
        run: |
          sed -i 's/block\.strip()/block.strip("\\n")/g' scripts/integrate_1919_1920_target_closeout.py
          python3 scripts/integrate_1919_1920_target_closeout.py

      - name: Clarify 503 historic-survey provenance
        run: python3 scripts/clarify_503_survey_provenance.py

      - name: Validate archive after historical integration
        run: python3 scripts/validate_archive.py

      - name: Commit and push directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify 503 c.1919 survey provenance"
          git pull --rebase origin main
          git push origin HEAD:main
