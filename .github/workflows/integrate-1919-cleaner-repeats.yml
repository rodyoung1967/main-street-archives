name: Integrate 1919 cleaner repeats

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-1919-cleaner-repeats.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main
        run: git pull --rebase origin main

      - name: Integrate cleaner repeat set
        run: python3 scripts/integrate_1919_cleaner_repeats.py

      - name: Normalize S-152 mirror name
        shell: bash
        run: |
          sed -i 's/name: Oregon City Enterprise 1919 cleaner\/dyer repeat advertisement set/name: Oregon City Enterprise, 1919 cleaner\/dyer repeat advertisement set/' database/sources.yml

      - name: Validate archive
        run: python3 scripts/validate_archive.py

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/integrate-1919-cleaner-repeats.yml
          git add -A
          git commit -m "Integrate visually verified 1919 cleaner repeat set"
          git pull --rebase origin main
          git push origin HEAD:main
