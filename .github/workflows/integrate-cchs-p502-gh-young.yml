name: Integrate CCHS P-502 G. H. Young

on:
  push:
    branches:
      - temp/ingest-cchs-p502-gh-young
    paths:
      - scripts/.p502-part1
      - scripts/.p502-part2
      - scripts/.p502-part3
      - scripts/.p502-part4
      - scripts/.p502-part5
      - .github/workflows/integrate-cchs-p502-gh-young.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Assemble and syntax-check integration script
        run: |
          cat scripts/.p502-part1 scripts/.p502-part2 scripts/.p502-part3 scripts/.p502-part4 scripts/.p502-part5 > scripts/integrate_cchs_p502_gh_young.py
          python3 -m py_compile scripts/integrate_cchs_p502_gh_young.py

      - name: Validate baseline
        run: |
          git worktree add /tmp/main-baseline origin/main
          (cd /tmp/main-baseline && python3 scripts/validate_archive.py)
          git worktree remove /tmp/main-baseline

      - name: Integrate CCHS P-502
        run: python3 scripts/integrate_cchs_p502_gh_young.py

      - name: Remove temporary helper parts
        run: rm -f scripts/.p502-part1 scripts/.p502-part2 scripts/.p502-part3 scripts/.p502-part4 scripts/.p502-part5

      - name: Validate integrated archive
        run: python3 scripts/validate_archive.py

      - name: Commit integration tree
        run: |
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "Add CCHS P-502 G. H. Young 507 Main photo"
          git push --force-with-lease origin HEAD:temp/ingest-cchs-p502-gh-young
