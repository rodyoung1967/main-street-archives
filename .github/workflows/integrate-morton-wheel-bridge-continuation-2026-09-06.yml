name: Integrate Morton Wheel ownership bridge continuation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/integrate-morton-wheel-bridge-continuation-2026-09-06.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync to latest main
        run: git pull --rebase origin main
      - name: Validate archive before edit
        run: python3 scripts/validate_archive.py
      - name: Integrate Morton Wheel bridge continuation
        run: python3 scripts/integrate_morton_wheel_bridge_continuation.py
      - name: Validate archive after edit
        run: python3 scripts/validate_archive.py
      - name: Commit Morton Wheel bridge continuation
        shell: bash
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add MANUAL-FOLLOWUP.md
          git add evidence/source-captures/morton-wheel-1945-1947-online-access-and-lafarlette-control-pass-2026-09-06.md
          git add evidence/source-captures/morton-wheel-to-oregon-city-wheel-ownership-bridge-pass-2026-09-05.md
          git add evidence/source-captures/lafarlette-morton-chronology-controls-2026-09-06.md
          git add registers/research-requests/morton-wheel-and-oregon-city-wheel-pre-raye-ownership-bridge-request-2026-09-05.md
          if git diff --cached --quiet; then
            echo 'No Morton Wheel bridge changes.'
            exit 0
          fi
          git commit -m 'Close Morton Wheel online bridge pass'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
