name: Integrate Morton Wheel ownership bridge continuation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/integrate-morton-wheel-bridge-continuation-2026-09-06.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync to latest main
        run: git pull --rebase origin main
      - name: Validate archive before edit
        run: python3 scripts/validate_archive.py
      - name: Integrate Morton Wheel bridge continuation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          marker = "Morton Wheel ownership bridge continuation — 2026-09-06"
          capture_path = Path("evidence/source-captures/morton-wheel-1945-1947-online-access-and-lafarlette-control-pass-2026-09-06.md")
          manual_path = Path("MANUAL-FOLLOWUP.md")
          bridge_path = Path("evidence/source-captures/morton-wheel-to-oregon-city-wheel-ownership-bridge-pass-2026-09-05.md")
          chronology_path = Path("evidence/source-captures/lafarlette-morton-chronology-controls-2026-09-06.md")
          request_path = Path("registers/research-requests/morton-wheel-and-oregon-city-wheel-pre-raye-ownership-bridge-request-2026-09-05.md")

          manual = manual_path.read_text(encoding="utf-8")
          if marker in manual:
              print("Morton Wheel continuation already integrated; no duplicate write.")
              raise SystemExit(0)
          if capture_path.exists():
              raise SystemExit(f"{capture_path} already exists without dashboard marker; inspect before retrying")

          existing_mf = [int(x) for x in re.findall(r"\bMF-(\d{3})\b", manual)]
          if not existing_mf:
              raise SystemExit("No MF IDs found in MANUAL-FOLLOWUP.md")
          mf = f"MF-{max(existing_mf) + 1:03d}"

          order_matches = [int(x) for x in re.findall(r"^\|\s*(\d+)\s*\|\s*\*\*MF-\d{3}\*\*", manual, flags=re.M)]
          order = max(order_matches) + 1 if order_matches else 1

          row = (
              f"| {order} | **{mf}** | Inspect/search **The Morton Journal, 1945–7 Aug. 1947** and first establish whether the **1946 Lewis County / Centralia-Chehalis directory actually includes Morton**; if covered, check LaFarlette variants and Wheel Cafe entries. In parallel, use the prepared Washington LCB and Oregon OLCC historical-license requests to identify the Morton Wheel proprietor and the pre-Raye 503 Main Wheel licensee | Public-online searching did not expose the target Morton Journal run, did not establish Morton coverage in the 1946 directory, and did not recover a reliable 1940s/1950s Morton Wheel proprietor or a 1958–67 Oregon City pre-Raye proprietor. The shared Wheel name remains only a clue | **ACTIVE MANUAL — THREE DRAFTS READY / NOT SENT**. [Combined Washington State Library + OLCC + Washington LCB drafts](registers/research-requests/morton-wheel-and-oregon-city-wheel-pre-raye-ownership-bridge-request-2026-09-05.md) |"
          )
          anchor = "### Recommended batching"
          if anchor not in manual:
              raise SystemExit("Recommended batching anchor not found in MANUAL-FOLLOWUP.md")
          manual = manual.replace(anchor, row + "\n\n" + anchor, 1)
          manual = re.sub(
              r"(current practical list is the \*\*)\d+(-item active queue)",
              lambda m: m.group(1) + str(order) + m.group(2),
              manual,
              count=1,
          )
          manual += f"""

---

## 6 September 2026 — Morton Wheel / Oregon City Wheel pre-Raye proprietor bridge
<!-- {marker} -->

| ID | Audited disposition | Still needed? | Audit decision |
| --- | --- | --- | --- |
| **{mf}** | **ACTIVE MANUAL — THREE DRAFTS READY / NOT SENT** | **Yes** | The public-online continuation exhausted the practical indexed routes for the target **1945–7 Aug. 1947 Morton Journal** interval without exposing readable issue pages, while official/catalog sources confirm the paper existed beginning in 1945. Washington State Library lists a **1946 Lewis County directory**, but commercial catalog/index descriptions label the 1946 volume as **Centralia** or **Centralia/Chehalis**, so Morton coverage must be established before interpreting any no-hit. No reliable public-online source identified the Morton Wheel proprietor, Raye/Floyd in Morton, Raye as a Morton Wheel employee, a Morton proprietor who later appears at the Oregon City Wheel, or the pre-Raye proprietor/licensee of **Wheel Cafe & Lounge, 503 Main, Oregon City**. Use the three ready-to-send requests in `registers/research-requests/morton-wheel-and-oregon-city-wheel-pre-raye-ownership-bridge-request-2026-09-05.md`. Treat all no-hits as coverage/retrieval results, not negative evidence. |
"""
          manual_path.write_text(manual, encoding="utf-8")

          capture = f"""# Morton Wheel 1945–1947 online-access and LaFarlette control pass

Date of research pass: **6 September 2026**

Status: **ONLINE PASS EXHAUSTED FOR THE HIGHEST-VALUE INDEXED ROUTES — MANUAL/RESTRICTED-SOURCE FOLLOW-UP {mf}; NO MORTON RESIDENCE, EMPLOYMENT, PROPRIETOR OR MORTON→OREGON CITY OWNER BRIDGE ESTABLISHED**

Purpose: continue the family/oral-history lead that Raye LaFarlette / Raye Grisham (`P-006`) and Floyd LaFarlette (`P-022`) spent time in Morton, Washington after Chicago and before Coquille; that Raye may have worked at Morton's Wheel Cafe; and that a Morton Wheel proprietor may later have owned The Wheel at 503 Main Street, Oregon City before selling it to Raye. This capture deliberately tests the people and transactions rather than treating the shared `Wheel` name as a bridge.

Related captures:

- `evidence/source-captures/lafarlette-morton-chronology-controls-2026-09-06.md`
- `evidence/source-captures/morton-wheel-to-oregon-city-wheel-ownership-bridge-pass-2026-09-05.md`
- `evidence/source-captures/morton-wheel-145-main-property-control-2026-09-06.md`
- `evidence/source-captures/raye-floyd-lafarlette-pre-wheel-hospitality-businesses-2026-09-05.md`

Ready-to-send requests:

- `registers/research-requests/morton-wheel-and-oregon-city-wheel-pre-raye-ownership-bridge-request-2026-09-05.md`

Manual dashboard: **{mf}**.

## 1. Morton Journal — existence is documented; target pages did not surface online

The Library of Congress catalog identifies **The Morton Journal (Morton, Wash.)** as a weekly newspaper published **1945–1973**, LCCN `sn88085057`, OCLC `17315663`:

https://www.loc.gov/item/sn88085057/

A separate genealogy newspaper inventory also lists **Morton Journal (1945–1973)** under **Offline Newspapers for Morton**:

https://ldsgenealogy.com/WA/Morton.htm

Repeated public-web searches in this pass used combinations of `Morton Journal`, `1945`, `1946`, `1947`, `LaFarlette`, `La Farlette`, `Raye`, `Rae`, `Floyd`, `Wheel Cafe`, `The Wheel`, proprietor/owner/manager, sale/purchase/new ownership, and later 1948–1956 continuity terms. No readable public digitized run for the target **1945 through 7 August 1947** interval surfaced.

Classification: **OFFICIAL CATALOG CONTROL** for the newspaper title/date span; **RETRIEVAL GAP / MANUAL SOURCE REQUIRED** for the target pages. This is not evidence that the LaFarlettes or Wheel Cafe were absent from Morton.

## 2. 1946 directory — holding exists, but Morton coverage is not established

Washington State Library's official County Directories page lists **Lewis County: 1946** among its holdings:

https://www.sos.wa.gov/library/research-collections/county-directories

However, searchable genealogy/directory indexes describe the accessible 1946 item as **Centralia City Directory 1946** and also list a **Centralia/Chehalis (Lewis County, Wash.) city directory** series. Those catalog descriptions do not demonstrate that Morton appears in the 1946 volume:

https://ldsgenealogy.com/WA/Lewis-County-City-Directories.htm

The State Library's separate city-directory/telephone-book holdings list does not begin a specifically named **Morton** telephone-book series until **1962**:

https://www.sos.wa.gov/library/research-collections/city-directories-telephone-books

Classification: **OFFICIAL HOLDINGS CONTROL + COVERAGE UNRESOLVED**. The next lookup must inspect the 1946 volume's title page, scope statement, locality index, or actual Morton section before a LaFarlette/Wheel no-hit has evidentiary meaning.

## 3. First post-window Powers controls strengthen Coos-area presence, not Morton absence

Searchable text from the **15 January 1948 Coquille Valley Sentinel**, p. 5, names **Ray LaFarlette** among incoming Royal Neighbors officers/managers in a Powers-centered item. Searchable text from **22 April 1948**, p. 17, explicitly gives **“Ray LaFarlette, Powers”** as toastmistress at a Royal Neighbors convention.

Routes:

- https://oregonnews.uoregon.edu/lccn/sn96088222/1948-01-15/ed-1/seq-5/
- https://oregonnews.uoregon.edu/lccn/sn96088222/1948-04-22/ed-1/seq-17/

The name, place and organizational continuity make Raye LaFarlette the strong working identity, but these pages were recovered as searchable text in this pass rather than scan-certified original images.

Classification: **OCR/TEXT ONLY / STRONG IDENTITY CONTEXT**. These records place Raye in the Powers social/community environment soon after the working Morton window. They do **not** prove she was not in Morton during 1944–7 August 1947.

## 4. 23 June 1949 — Floyd leaves Anderson-LaFarlette Freight; scan rerender failed

Searchable text from the **23 June 1949 Coquille Valley Sentinel**, p. 8, under “Freight Company Has Sole Owner,” states that **Carl A. Anderson** of the Anderson-LaFarlette Freight line purchased the interest of his partner **Floyd LaFarlette**. The firm planned to maintain its daily Coos Bay–Powers schedule.

Route:
https://oregonnews.uoregon.edu/lccn/sn96088222/1949-06-23/ed-1/seq-8/

The PDF endpoint was opened and its text extracted, but the required screenshot/page-image rerender returned a cache-miss error in this research environment. Therefore this pass does not promote the item to scan-certified status.

Classification: **OCR/TEXT ONLY / VISUAL RENDER RETRIEVAL GAP**. It brackets the end of Floyd's documented freight partnership but does not address Morton ownership.

## 5. 28 July 1949 — direct-text Raye hotel-employment anchor and a Washington network lead

Searchable text from the **28 July 1949 Coquille Valley Sentinel**, p. 10, says a women's softball group consisted of **“the girls who work at the Coquille Hotel”** and lists **Rae LaFarlette** among the participants.

The same page reports that **Carl Anderson**, operator of the Anderson-LaFarlette truck line serving Powers, said he had **operated buses in Washington for 21 years**.

Route:
https://oregonnews.uoregon.edu/lccn/sn96088222/1949-07-28/ed-1/seq-10/

As with the 23 June page, the PDF text was recoverable but the screenshot/page-image rerender returned a cache-miss error.

Classification for Raye: **OCR/TEXT ONLY / DIRECT-TEXT EMPLOYMENT ANCHOR** for Coquille Hotel employment by July 1949, pending visual certification. This is more precise than merely inferring an approximate start from the 1954 phrase “several years,” but it lies after the target Morton interval.

Classification for Anderson: **PERSON-NETWORK LEAD ONLY**. The article says Washington, not Morton, and supplies no restaurant, Wheel, residence or LaFarlette pre-1947 relationship. Anderson must **not** be treated as a Morton Wheel proprietor or as the remembered ownership bridge unless an independent contemporary source explicitly connects him to Morton/The Wheel.

## 6. Proprietor-focused Morton Wheel sweep — no reliable owner recovered

The online continuation searched combinations of:

- `Wheel Cafe`, `The Wheel Cafe`, `Wheel Cafe & Jubilee Room`, `Jubilee Room`;
- `Morton`, `145 Main`, owner, proprietor, manager, operator;
- new owner / new ownership / sale / sold / purchased / transfer;
- years **1945–1956**, with emphasis on 1945–1952;
- LaFarlette name variants and the later Carl Anderson network lead;
- modern/corporate-name variants only to identify historical leads, not to back-project recent entities.

Results continued to recover only later address/business references such as **Wheel Cafe & Jubilee Room, 145 Main**, later employee obituaries, modern photographs/listings, and catalog references. No reliable contemporary source recovered in this pass names the proprietor during 1944–1952 or proves the business existed in 1944–1947.

Classification: **RETRIEVAL GAP / UNRESOLVED**, not negative evidence.

## 7. Oregon City pre-Raye proprietor remains unresolved

The repository already directly anchors **Wheel Cafe & Lounge, 503 Main Street, Oregon City, phone 9106** in August and November 1958, with a 1959 continuation lead, and the 7 June 1967 Oregon City Commission minutes record a liquor application for the Wheel at 503 Main. The public minute text does not name the applicant.

A fresh owner/proprietor/licensee sweep did not recover a reliable named 1958–1967 proprietor or the seller from whom Raye acquired the business.

Classification: **RETRIEVAL GAP / UNRESOLVED**. Do not use the `9106` → later `656-9717` telephone-number change as an ownership-transfer date.

## 8. Answer to the five bridge questions after this continuation

1. **Did Floyd/Raye actually reside in Morton?** — **Not established.** Family recollection remains the lead; no contemporary Morton residence was recovered online.
2. **Did Raye work at the Morton Wheel?** — **Not established.** No employee reference was recovered.
3. **Who owned/operated the Morton Wheel during the relevant years?** — **Unresolved.** No reliable proprietor surfaced, and existence in 1944–1947 remains unproved.
4. **Did any Morton proprietor later appear at The Wheel, 503 Main, Oregon City?** — **Not established.** No person-level bridge exists yet.
5. **Who owned the Oregon City Wheel immediately before Raye?** — **Unresolved.** Existing 1958–1967 sources establish the business/address but not the predecessor proprietor/licensee.

## 9. Manual/restricted-source threshold reached

This pass has now exhausted the practical public-indexed routes enough to justify a formal manual callout under the archive standard. **{mf}** is added to `MANUAL-FOLLOWUP.md` and points to the already prepared three-source request set:

1. Washington State Library — determine 1946 directory Morton coverage and access/search the 1945–7 Aug. 1947 *Morton Journal* run;
2. Washington LCB — historical Morton Wheel license/application chain, approximately 1944–1952;
3. Oregon OLCC — Wheel / Wheel Cafe / Wheel Cafe & Lounge, 503 Main, Oregon City, 1958–1967, extending later as needed to identify Raye's acquisition and predecessor.

No request was sent automatically.

## 10. Cross-record propagation audit

No new proprietor, ownership-transfer, Morton residence, or Morton employment fact was established, so this pass intentionally does **not** alter:

- `businesses/the-wheel.md`;
- `registers/ownership-timeline.md`;
- Raye or Floyd's person profile as if Morton were proved;
- any 503/505 business ownership chain.

The meaningful new archive state is the **bounded online-search closure**, the **post-window Coos/Powers controls**, the **Carl Anderson Washington network lead with an explicit non-bridge warning**, and the formal **{mf} manual/restricted-source route**.

Do **not** merge the Morton Wheel with The Wheel at 503 Main unless a contemporary person/license/transaction source establishes the connection.
"""
          capture_path.write_text(capture, encoding="utf-8")

          def append_section(path: Path, text: str):
              current = path.read_text(encoding="utf-8")
              if marker in current:
                  print(f"{path}: marker already present")
                  return
              path.write_text(current.rstrip() + "\n\n" + text.strip() + "\n", encoding="utf-8")

          append_section(
              chronology_path,
              f"""
## 11. Online-access continuation — 6 September 2026
<!-- {marker} -->

A further proprietor/access pass is preserved in `evidence/source-captures/morton-wheel-1945-1947-online-access-and-lafarlette-control-pass-2026-09-06.md`.

It adds **OCR/TEXT-ONLY** post-window controls placing `Ray LaFarlette` in a Powers Royal Neighbors context on **15 January 1948** and explicitly as `Ray LaFarlette, Powers` on **22 April 1948**. It also adds an **OCR/TEXT-ONLY** 28 July 1949 item identifying `Rae LaFarlette` among “the girls who work at the Coquille Hotel,” plus the 23 June 1949 report that Carl A. Anderson purchased Floyd LaFarlette's interest in Anderson-LaFarlette Freight. Required screenshot rerendering of the 1949 PDFs failed with a cache-miss error, so those items are not scan-certified in this pass.

The same 28 July page says Carl Anderson had operated buses in **Washington for 21 years**. This is retained only as a **PERSON-NETWORK LEAD**; the source does not say Morton and does not connect Anderson to any Wheel Cafe.

The online proprietor sweep still recovered no contemporary Morton residence/employment record, no 1944–47 Morton Wheel existence proof, no Morton Wheel proprietor, no Morton→Oregon City person bridge, and no named pre-Raye Oregon City Wheel proprietor. Public indexing confirms *The Morton Journal* began in 1945 but did not expose the target run; the 1946 directory's Morton coverage also remains unproved. The issue now has formal manual/restricted-source callout **{mf}**. No institutional request has been sent.
""",
          )

          append_section(
              bridge_path,
              f"""
## 6 September continuation — public-online threshold reached
<!-- {marker} -->

The continuation capture `evidence/source-captures/morton-wheel-1945-1947-online-access-and-lafarlette-control-pass-2026-09-06.md` records the completed proprietor/access sweep. It did **not** identify a Morton Wheel proprietor, a Morton LaFarlette residence/employment record, a Morton→Oregon City owner, or the pre-Raye Oregon City Wheel proprietor.

Two access findings now control the next step: (1) *The Morton Journal* is officially cataloged beginning in **1945**, but no readable public digitized run for the target 1945–7 Aug. 1947 interval surfaced; and (2) Washington State Library lists **Lewis County 1946**, while other directory catalogs describe the 1946 volume as Centralia/Centralia-Chehalis, so **Morton coverage must be proved before interpreting any no-hit**.

A later Coos-side person-network clue is preserved but not promoted: a 28 July 1949 article says Floyd's freight partner Carl A. Anderson had operated buses in Washington for 21 years. It does **not** say Morton and does **not** connect Anderson to either Wheel business.

The remaining source problem is now formally registered as **{mf}** in `MANUAL-FOLLOWUP.md`, using the existing Washington State Library, Washington LCB, and Oregon OLCC ready-to-send drafts. No request has been sent.
""",
          )

          request = request_path.read_text(encoding="utf-8")
          if marker not in request:
              request += f"""

---

## 6 September 2026 online-exhaustion update
<!-- {marker} -->

The further public-online pass did not recover the Morton Wheel proprietor, a LaFarlette Morton residence/employment record, a Morton→Oregon City owner bridge, or the pre-Raye Oregon City Wheel proprietor. Public indexing confirms *The Morton Journal* began in 1945 but did not expose readable target issues; the 1946 directory's Morton coverage remains unproved. These three drafts are therefore now the active restricted/manual route under **{mf}** in `MANUAL-FOLLOWUP.md`.

One later contextual lead should be handled cautiously if it appears in requested records: a 28 July 1949 *Coquille Valley Sentinel* item says Floyd's later freight partner **Carl A. Anderson** had operated buses in **Washington for 21 years**. This does **not** identify Morton or connect Anderson to a Wheel Cafe. Preserve any direct Morton association if found, but do not merge same-name Andersons or treat him as the remembered proprietor without contemporary bridging evidence.
"""
              request_path.write_text(request, encoding="utf-8")

          print(f"Integrated {mf} as active Morton Wheel ownership-bridge manual follow-up.")
          PY
      - name: Validate archive after edit
        run: python3 scripts/validate_archive.py
      - name: Commit Morton Wheel bridge continuation
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add \
            MANUAL-FOLLOWUP.md \
            evidence/source-captures/morton-wheel-1945-1947-online-access-and-lafarlette-control-pass-2026-09-06.md \
            evidence/source-captures/morton-wheel-to-oregon-city-wheel-ownership-bridge-pass-2026-09-05.md \
            evidence/source-captures/lafarlette-morton-chronology-controls-2026-09-06.md \
            registers/research-requests/morton-wheel-and-oregon-city-wheel-pre-raye-ownership-bridge-request-2026-09-05.md
          if git diff --cached --quiet; then
            echo 'No Morton Wheel bridge changes.'
            exit 0
          fi
          git commit -m 'Close Morton Wheel online bridge pass'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
