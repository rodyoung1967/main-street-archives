name: Filter 1920-1922 poolhall strong candidates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/filter-1920-1922-poolhall-strong-candidates.yml"

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - name: Filter broad OCR inventory
        run: python3 scripts/filter_1920_1922_poolhall_strong_candidates.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit strong candidate index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/filter-1920-1922-poolhall-strong-candidates.yml
          git add -A
          git commit -m "Filter 1920-1922 pool hall OCR leads to strong candidates"
          git pull --rebase origin main
          git push origin HEAD:main
