name: Package aligned aerial direct exports

on:
  push:
    branches: [main]
    paths:
      - 'scripts/download_aerial_analysis_exports.py'
      - '.github/workflows/aerial-analysis-direct-export-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download aligned exports
        run: python3 scripts/download_aerial_analysis_exports.py
      - uses: actions/upload-artifact@v4
        with:
          name: aerial-direct-exports
          path: /tmp/aerial-direct/
          retention-days: 1
