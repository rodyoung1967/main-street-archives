name: Query ORMS 1945 license window

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/query-orms-1945-license.yml'
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query legacy HPRM Oregon City code 023
        run: |
          python3 - <<'PY'
          import html, json, re, urllib.parse, urllib.request
          BASE='https://ormswd.synergydcs.com/HPRMWebDrawer/Record'
          HEAD={'User-Agent':'Mozilla/5.0 Main-Street-Archive/1.0','Accept':'text/html,application/json;q=0.9,*/*;q=0.8'}

          def clean(s):
              s=re.sub(r'<script.*?</script>',' ',s,flags=re.I|re.S)
              s=re.sub(r'<style.*?</style>',' ',s,flags=re.I|re.S)
              s=re.sub(r'<[^>]+>',' ',s)
              return ' '.join(html.unescape(s).split())

          for year in ('1945','1946','1947','1948'):
              q=f'webdrawercode:"*023*" And recTitle:"*{year} city commission*" And recContainer:3AAgenda Packets and Minutes'
              url=BASE+'?'+urllib.parse.urlencode({'q':q,'sortBy':'recTypedTitle-'})
              print('\n=== YEAR',year,'===')
              print('URL',url)
              try:
                  req=urllib.request.Request(url,headers=HEAD)
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read().decode('utf-8','replace')
                      print('STATUS',r.status,'FINAL',r.geturl(),'TYPE',r.headers.get('Content-Type'),'BYTES',len(raw))
              except Exception as e:
                  print('ERROR',repr(e)); continue
              # Record IDs from URLs, JSON fields, or visible text.
              ids=[]
              for pat in (r'/Record/(\d+)', r'"(?:uri|url|id|recordNumber|recordId)"\s*:\s*"?([^",}]+)', r'\b47\d{5,}\b'):
                  for m in re.finditer(pat,raw,re.I):
                      v=m.group(1) if m.lastindex else m.group(0)
                      if v not in ids: ids.append(v)
              print('ID_CANDIDATES',ids[:150])
              # Print links likely to be records.
              links=[]
              for href,inner in re.findall(r'<a[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',raw,re.I|re.S):
                  t=clean(inner)
                  if 'Record' in href or year in t:
                      links.append((href,t))
              print('LINKS',len(links))
              for h,t in links[:120]: print('LINK',h,'|',t)
              vis=clean(raw)
              print('VISIBLE_HEAD',vis[:12000])
          PY