name: Query ORMS 1945 license window

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/query-orms-1945-license.yml'
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe ORMS search form
        run: |
          python3 - <<'PY'
          import re, urllib.request
          url='https://ormswd.synergydcs.com/ORMSCMSearch/search/SearchMain.aspx'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req,timeout=15) as r:
                  body=r.read().decode('utf-8','replace')
                  print('STATUS',r.status,'URL',r.geturl(),'BYTES',len(body))
                  for m in re.finditer(r'<select[^>]*>.*?</select>',body,re.I|re.S):
                      block=m.group(0)
                      head=block[:block.find('>')+1]
                      print('\nSELECT',re.sub(r'\s+',' ',head))
                      for value,text in re.findall(r'<option[^>]*value=["\']?([^"\' >]*)[^>]*>(.*?)</option>',block,re.I|re.S):
                          text=re.sub(r'<[^>]+>',' ',text)
                          text=' '.join(text.split())
                          print('OPTION',repr(value),'|',text)
                  print('\nFORM TAGS')
                  for f in re.findall(r'<form[^>]*>',body,re.I): print(re.sub(r'\s+',' ',f))
                  print('\nINPUT NAMES')
                  for tag in re.findall(r'<input[^>]*>',body,re.I):
                      nm=re.search(r'name=["\']([^"\']+)',tag,re.I)
                      if nm: print(nm.group(1), re.sub(r'\s+',' ',tag)[:240])
          except Exception as e:
              print('FORM_ERROR',repr(e))
          PY