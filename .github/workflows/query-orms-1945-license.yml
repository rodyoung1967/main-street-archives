name: Query ORMS 1945 license window

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/query-orms-1945-license.yml'
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST archived all-jurisdiction ORMS searches
        run: |
          python3 - <<'PY'
          import html, http.cookiejar, re, urllib.parse, urllib.request

          URL='https://ormswd.synergydcs.com/ORMSCMSearch/search/SearchMain.aspx'
          cj=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          headers={'User-Agent':'Mozilla/5.0 Main-Street-Archive/1.0'}

          def fetch(req):
              with opener.open(req,timeout=20) as r:
                  return r.geturl(), r.read().decode('utf-8','replace')

          def hidden(body):
              out={}
              for tag in re.findall(r'<input[^>]*type=["\']hidden["\'][^>]*>',body,re.I):
                  n=re.search(r'name=["\']([^"\']+)',tag,re.I)
                  v=re.search(r'value=["\']([^"\']*)',tag,re.I|re.S)
                  if n: out[n.group(1)]=html.unescape(v.group(1) if v else '')
              return out

          def textify(s):
              s=re.sub(r'<script.*?</script>',' ',s,flags=re.I|re.S)
              s=re.sub(r'<style.*?</style>',' ',s,flags=re.I|re.S)
              s=re.sub(r'<[^>]+>',' ',s)
              return ' '.join(html.unescape(s).split())

          def get_form():
              req=urllib.request.Request(URL,headers=headers)
              return fetch(req)[1]

          def search(label, terms):
              body=get_form()
              data=hidden(body)
              data.update({
                  'ctl00$ContentPlaceHolder1$ddlJurisdictions':'-1',
                  'ctl00$ContentPlaceHolder1$ddlSearchType1':'content',
                  'ctl00$ContentPlaceHolder1$txtSearch1':terms[0],
                  'ctl00$ContentPlaceHolder1$rdoAndGroup_1':'rdoAnd1',
                  'ctl00$ContentPlaceHolder1$ddlSearchType2':'content' if len(terms)>1 else '-1',
                  'ctl00$ContentPlaceHolder1$txtSearch2':terms[1] if len(terms)>1 else '',
                  'ctl00$ContentPlaceHolder1$rdoAndGroup_2':'rdoAnd2',
                  'ctl00$ContentPlaceHolder1$ddlSearchType3':'content' if len(terms)>2 else '-1',
                  'ctl00$ContentPlaceHolder1$txtSearch3':terms[2] if len(terms)>2 else '',
                  'ctl00$ContentPlaceHolder1$ddlSortBy1':'RecordNumber',
                  'ctl00$ContentPlaceHolder1$ddlSortBy2':'',
                  'ctl00$ContentPlaceHolder1$btnSubmit':'Search',
                  'ctl00$ContentPlaceHolder1$chkarchived':'on',
                  'ctl00$ContentPlaceHolder1$hdnIsPaging':'3',
              })
              payload=urllib.parse.urlencode(data).encode()
              req=urllib.request.Request(URL,data=payload,headers={**headers,'Content-Type':'application/x-www-form-urlencoded'})
              print('\n===',label,terms,'===')
              try:
                  final,res=fetch(req)
              except Exception as e:
                  print('ERROR',repr(e)); return
              print('FINAL',final,'BYTES',len(res))
              # Capture every record-like link and visible row text.
              seen=set(); hits=[]
              for href,inner in re.findall(r'<a[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',res,re.I|re.S):
                  t=textify(inner)
                  if ('Record/' in href or 'record' in href.lower() or re.search(r'\b47\d{5,}\b',href+t)):
                      key=(href,t)
                      if key not in seen:
                          seen.add(key); hits.append(key)
              print('LINK_HITS',len(hits))
              for href,t in hits[:150]: print('HIT',href,'|',t)
              # Also extract context around Oregon City / liquor / Harr / license / 1945 / 1946 tokens.
              visible=textify(res)
              low=visible.lower()
              for needle in ('oregon city','liquor','license','harr','farr','1945','1946'):
                  start=0; count=0
                  while count<8:
                      pos=low.find(needle,start)
                      if pos<0: break
                      print('CTX',needle,'|',visible[max(0,pos-220):pos+650])
                      start=pos+len(needle); count+=1

          queries=[
              ('Oregon City + liquor + 1945',['Oregon City','liquor','1945']),
              ('Oregon City + license + 1945',['Oregon City','license','1945']),
              ('Oregon City + Harr + 1945',['Oregon City','Harr','1945']),
              ('Oregon City + Canemah + 1945',['Oregon City','Canemah','1945']),
              ('Oregon City + liquor + 1946',['Oregon City','liquor','1946']),
          ]
          for q in queries: search(*q)
          PY