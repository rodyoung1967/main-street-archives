name: Integrate 1921 Freeze transition

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-1921-freeze-transition.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - name: Run synchronized integration
        run: python3 scripts/integrate_1921_freeze_507half_505half_transition.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit integration and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/integrate-1921-freeze-transition.yml
          git add -A
          git commit -m "Integrate verified 1921 Freeze 507½-to-505½ transition"
          git pull --rebase origin main
          git push origin HEAD:main
