name: Integrate CCHS P-1043 1930s Main business roster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-cchs-p1043-1930s-main-roster.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow PyYAML
      - name: Integrate P-1043 and validate with race-safe retry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/integrate_cchs_p1043_1930s_main_6th_business_roster.py
            python3 scripts/validate_archive.py
            git add -A
            if git diff --cached --quiet; then
              echo 'P-1043 already integrated.'
              exit 0
            fi
            git commit -m 'Integrate CCHS P-1043 1930s Main business roster'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
