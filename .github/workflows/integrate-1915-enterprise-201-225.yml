name: Integrate 1915 Enterprise pages 201-225

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-1915-enterprise-201-225.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main
        run: git pull --rebase origin main

      - name: Integrate reviewed pages
        run: python3 scripts/integrate_1915_enterprise_201_225.py

      - name: Validate archive
        run: python3 scripts/validate_archive.py

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate 1915 Enterprise visual review through July 16 p1"
          git pull --rebase origin main
          git push origin HEAD:main
