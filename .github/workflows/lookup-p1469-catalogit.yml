name: Lookup CCHS P-1469 in CatalogIt

on:
  push:
    branches:
      - 'temp/ingest-p1469-1890-flood'
    paths:
      - '.github/workflows/lookup-p1469-catalogit.yml'

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query CatalogIt public API
        run: |
          mkdir -p .ingest/p1469/catalogit
          curl -fL --retry 3 --get 'https://api.catalogit.app/api/public/search' \
            --data-urlencode 'query=P-1469' \
            --data-urlencode 'size=50' \
            -o .ingest/p1469/catalogit/p1469.json
          curl -fL --retry 3 --get 'https://api.catalogit.app/api/public/search' \
            --data-urlencode 'query=1890 Flood Oregon City Main Street' \
            --data-urlencode 'size=100' \
            -o .ingest/p1469/catalogit/flood-main.json
          python -m json.tool .ingest/p1469/catalogit/p1469.json >/dev/null
          python -m json.tool .ingest/p1469/catalogit/flood-main.json >/dev/null
      - name: Commit lookup results to staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ingest/p1469/catalogit/*.json
          git commit -m 'Stage CatalogIt lookup for P-1469'
          git push origin HEAD:temp/ingest-p1469-1890-flood
