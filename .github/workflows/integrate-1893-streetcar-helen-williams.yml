name: Integrate 1893 Streetcar Helen Williams evidence

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_1893_streetcar_helen_williams.py'
      - '.github/workflows/integrate-1893-streetcar-helen-williams.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Integrate Helen photograph and signage evidence
        run: python3 scripts/integrate_1893_streetcar_helen_williams.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate 1893 Streetcar Helen E. E. Williams evidence'
          git pull --rebase origin main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
