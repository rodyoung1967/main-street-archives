name: Integrate CCHS P-1317 Fifth Street bluff photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-cchs-p1317-bluff-5th.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration dependencies
        run: python3 -m pip install --quiet pyyaml pillow
      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py
      - name: Correct P-1317 evidence title synchronization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate_cchs_p1317_bluff_5th.py')
          text = p.read_text(encoding='utf-8')
          old = 'name: "CCHS P-1317 Fifth Street bluff view / probable 501-503-505 predecessor frontage"'
          new = 'name: "CCHS P-1317 Fifth Street bluff view shows probable 501/503/505 predecessor frontage through branches"'
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected P-1317 evidence-name line not found')
          PY
      - name: Retrieve exact CCHS P-1317 object and integrate photo
        run: python3 scripts/integrate_cchs_p1317_bluff_5th.py
      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py
      - name: Commit, rebase onto newest main, validate, and push
        run: |
          git config user.name 'main-street-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'Add CCHS P-1317 Fifth Street bluff view'
          git fetch origin main
          git rebase origin/main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
