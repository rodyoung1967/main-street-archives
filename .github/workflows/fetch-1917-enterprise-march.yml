name: Fetch March 1917 Oregon City Enterprise

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-1917-enterprise-march.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync to latest main
        run: git pull --rebase origin main
      - name: Validate archive before retrieval
        run: python3 scripts/validate_archive.py
      - name: Download March Enterprise page PDFs
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, requests, time
          dates = ['1917-03-02','1917-03-09','1917-03-16','1917-03-23','1917-03-30']
          base = 'https://oregonnews.uoregon.edu/lccn/sn00063700'
          out = pathlib.Path('newspapers/oregon-city-enterprise/1917-march')
          out.mkdir(parents=True, exist_ok=True)
          s = requests.Session()
          s.headers.update({'User-Agent':'main-street-archives archival retrieval'})
          issues=[]
          for ds in dates:
              pages=[]
              for seq in range(1,33):
                  url=f'{base}/{ds}/ed-1/seq-{seq}.pdf'
                  r=s.get(url,timeout=60)
                  ctype=r.headers.get('content-type','').lower()
                  if r.status_code != 200 or 'pdf' not in ctype or not r.content.startswith(b'%PDF'):
                      break
                  fn=f'{ds}-seq-{seq:02d}.pdf'
                  (out/fn).write_bytes(r.content)
                  pages.append({'sequence':seq,'file':fn,'url':url,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest()})
                  time.sleep(0.05)
              if not pages:
                  raise SystemExit(f'No pages retrieved for {ds}')
              issues.append({'date':ds,'page_count':len(pages),'pages':pages})
          expected={d:8 for d in dates}
          got={i['date']:i['page_count'] for i in issues}
          if got != expected:
              raise SystemExit(f'Inventory mismatch expected={expected} got={got}')
          manifest={'title':'Oregon City Enterprise','lccn':'sn00063700','year':1917,'month':'March','issues':issues,'total_pages':sum(i['page_count'] for i in issues)}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print([(i['date'],i['page_count']) for i in issues], 'total', manifest['total_pages'])
          PY
      - name: Upload March originals
        uses: actions/upload-artifact@v4
        with:
          name: 1917-enterprise-march
          path: newspapers/oregon-city-enterprise/1917-march/
          retention-days: 7
      - name: Commit preserved originals
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add newspapers/oregon-city-enterprise/1917-march/
          if git diff --cached --quiet; then
            echo 'No retrieval changes.'
            exit 0
          fi
          git commit -m 'Archive March 1917 Oregon City Enterprise scans'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then exit 0; fi
            sleep 2
          done
          exit 1
