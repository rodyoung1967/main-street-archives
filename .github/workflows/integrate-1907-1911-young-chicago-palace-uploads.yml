name: Integrate 1907-1911 Young Chicago Palace uploads

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-1907-1911-young-chicago-palace-uploads.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --quiet pyyaml
      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py
      - name: Fix integration serializer and quoted YAML note
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate_1907_1911_young_chicago_palace_uploads.py')
          s = p.read_text(encoding='utf-8')
          old1 = "text.rstrip() + '\\n\\n' + block.strip() + '\\n'"
          new1 = "text.rstrip() + '\\n\\n' + block.rstrip() + '\\n'"
          old2 = "pattern.sub(block.strip() + '\\n\\n', text, count=1)"
          new2 = "pattern.sub(block.rstrip() + '\\n\\n', text, count=1)"
          if old1 not in s or old2 not in s:
              raise SystemExit('serializer patterns not found')
          s = s.replace(old1, new1).replace(old2, new2)
          lines = s.splitlines()
          found = False
          for i, line in enumerate(lines):
              if line.startswith('    notes: Exact supplied page PDFs preserved for 31 March'):
                  found = True
                  line = line.replace('    notes: ', '    notes: "', 1)
                  pos = line.rfind("'''")
                  if pos < 0:
                      raise SystemExit('YAML notes template terminator not found')
                  lines[i] = line[:pos] + '"' + line[pos:]
          if not found:
              raise SystemExit('Chicago Store YAML notes template not found')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Preserve exact PDFs and integrate records
        run: python3 scripts/integrate_1907_1911_young_chicago_palace_uploads.py
      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py
      - name: Commit and push directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
          else
            git commit -m 'Integrate 1907-1911 Young Chicago Palace pages'
            git push origin main
          fi
