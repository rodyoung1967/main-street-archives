name: Temporary Jan 19 1912 Courier pages 5-8 ingest

on:
  push:
    paths:
      - .github/workflows/temp-1912-jan19-p5-p8-ingest.yml

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependency
        run: python -m pip install pyyaml

      - name: Synchronize current main
        run: |
          git fetch origin main
          git pull --ff-only origin main

      - name: Baseline archive validation
        run: python3 scripts/validate_archive.py

      - name: Download and hash-verify steward-supplied pages
        run: |
          set -euo pipefail
          mkdir -p newspapers/oregon-city-courier
          curl -L --fail --retry 3 'https://oregonnews.uoregon.edu/lccn/sn00063698/1912-01-19/ed-1/seq-5.pdf' -o newspapers/oregon-city-courier/1912-01-19-page-5.pdf
          curl -L --fail --retry 3 'https://oregonnews.uoregon.edu/lccn/sn00063698/1912-01-19/ed-1/seq-6.pdf' -o newspapers/oregon-city-courier/1912-01-19-page-6.pdf
          curl -L --fail --retry 3 'https://oregonnews.uoregon.edu/lccn/sn00063698/1912-01-19/ed-1/seq-7.pdf' -o newspapers/oregon-city-courier/1912-01-19-page-7.pdf
          curl -L --fail --retry 3 'https://oregonnews.uoregon.edu/lccn/sn00063698/1912-01-19/ed-1/seq-8.pdf' -o newspapers/oregon-city-courier/1912-01-19-page-8.pdf
          printf '%s  %s\n' \
            'd7419216d8a39ecfdd726302590ab365f2d7074beac327083c3b84a1c48ddce6' 'newspapers/oregon-city-courier/1912-01-19-page-5.pdf' \
            '53b2c8b4c8b03036fed8a8cc04f18a895dc6fc980ecbc8c052ab7913b2a61300' 'newspapers/oregon-city-courier/1912-01-19-page-6.pdf' \
            'fd88d8623b8203ba49ece2f2c31faf0a8f826569543b18b69d1ce02d1054f444' 'newspapers/oregon-city-courier/1912-01-19-page-7.pdf' \
            'bc4bdb274d1d0530e087da7a01b3f0dfc832ef1174ccd6cfba53e4ec89795a62' 'newspapers/oregon-city-courier/1912-01-19-page-8.pdf' \
            | sha256sum -c -

      - name: Post-download archive validation
        run: python3 scripts/validate_archive.py

      - name: Commit exact page binaries
        run: |
          set -euo pipefail
          git config user.name 'main-street-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add newspapers/oregon-city-courier/1912-01-19-page-{5,6,7,8}.pdf
          if git diff --cached --quiet; then
            echo 'No binary changes to commit.'
            exit 0
          fi
          git commit -m 'Archive Jan 19 1912 Courier pages 5-8'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            python3 scripts/validate_archive.py
          done
          echo 'Push failed after retries.' >&2
          exit 1
