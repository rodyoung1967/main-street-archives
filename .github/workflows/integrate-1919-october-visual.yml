name: Integrate October 1919 visual review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-1919-october-visual.yml'
      - 'scripts/integrate_1919_october_visual.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py
      - name: Remove deprecated evidence relationship from integration script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/integrate_1919_october_visual.py')
          t=p.read_text(encoding='utf-8')
          old='    sources: [{S}]\\n'
          if old not in t:
              raise SystemExit('expected deprecated sources line not found')
          p.write_text(t.replace(old,'',1),encoding='utf-8')
          PY
      - name: Integrate October 1919 visual review
        run: python3 scripts/integrate_1919_october_visual.py
      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py
      - name: Commit and push integration
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/integrate_1919_october_visual.py evidence database businesses people registers indexes timeline.md ARCHIVE_INDEX.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integrate October 1919 Enterprise visual review'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
