name: Integrate Fifth Street Restaurant primary pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-fifth-street-restaurant-uploads-1916-1922.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --quiet pyyaml

      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py

      - name: Correct integration serializer and metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate_fifth_street_restaurant_uploads_1916_1922.py')
          text = p.read_text(encoding='utf-8')

          old_serializer = 'write(path, text + "\\n" + block.strip() + "\\n")'
          new_serializer = 'write(path, text + "\\n" + block.strip("\\n") + "\\n")'
          if old_serializer in text:
              text = text.replace(old_serializer, new_serializer, 1)
          elif new_serializer not in text:
              raise SystemExit('serializer target not found')

          headings = [
              '## E-160 — Fifth Street Restaurant in state inspection summary, 31 August 1916',
              '## E-161 — W. W. Pollock conducting Fifth Street Restaurant and fined, 31 October 1919',
              '## E-162 — Fifth Street Restaurant active-place evidence from reported fight, 26 August 1921',
              '## E-163 — 21 July 1922 Enterprise restaurant/building ownership wording after Fifth/Main fire',
          ]
          for heading in headings:
              enriched = (
                  heading + '\n'
                  'Type: Primary newspaper visual evidence.  \n'
                  'Confidence: Very High for directly printed wording; identity, continuity, premises, and title limits remain as stated below.  \n'
                  'Source:'
              )
              if enriched in text:
                  continue
              target = heading + '\nSource:'
              if target not in text:
                  raise SystemExit(f'evidence heading target not found: {heading}')
              text = text.replace(target, enriched, 1)

          text = text.replace(
              '    name: Fifth Street Restaurant active-place evidence, 26 August 1921',
              '    name: Fifth Street Restaurant active-place evidence from reported fight, 26 August 1921'
          )
          text = text.replace(
              '    name: 21 July 1922 Enterprise restaurant and building ownership wording after Fifth/Main fire',
              '    name: 21 July 1922 Enterprise restaurant/building ownership wording after Fifth/Main fire'
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Preserve exact PDFs and integrate records
        run: python3 scripts/integrate_fifth_street_restaurant_uploads_1916_1922.py

      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py

      - name: Commit and push directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
          else
            git commit -m 'Integrate Fifth Street Restaurant primary pages, 1916-1922'
            git push origin main
          fi
