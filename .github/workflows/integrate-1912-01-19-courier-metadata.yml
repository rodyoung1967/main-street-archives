name: Temporary integrate Jan 19 1912 Courier metadata

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-1912-01-19-courier-metadata.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate source metadata and audit record
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/temporary_integrate_1912_01_19_courier_metadata.py

          git config user.name 'main-street-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add evidence/source-register.md \
                  database/sources.yml \
                  evidence/source-captures/1912-courier-jan-19-pages-1-4-visual-review-2026-09-09.md \
                  registers/research-log.md
          git commit -m 'Integrate Jan 19 1912 Courier source metadata'

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} lost a race; rebasing onto newest main."
            git fetch origin main
            git rebase origin/main
          done
          exit 1
