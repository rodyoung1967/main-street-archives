name: Query Oak Lodge 1947-48 directory scan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/query-oak-lodge-1947-directory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe live PDF and Wayback copy
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, re, urllib.parse, urllib.request
          page='https://oaklodgehistory.org/pages/oaklodge/oakgrove/'
          req=urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              body=r.read().decode('utf-8','replace')
          print('PAGE_BYTES',len(body))
          for href in re.findall(r'href=["\']([^"\']+)',body,re.I):
              if '1947' in href and '.pdf' in href.lower(): print('PDF_LINK',href)
          target='https://www.oaklodgehistory.org/documents/OakLodge/ClackamasCountyDirectories/1947-1948_OakGrove.pdf'
          cdx='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode({
              'url':target,'output':'json','filter':'statuscode:200','fl':'timestamp,original,mimetype,statuscode,digest,length','collapse':'digest'
          })
          print('CDX',cdx)
          try:
              req=urllib.request.Request(cdx,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  data=r.read().decode('utf-8','replace')
              print('CDX_RESULT',data[:12000])
          except Exception as e: print('CDX_ERROR',repr(e))
          PY
          mkdir -p artifact
          : > live-status.txt
          for u in \
            'https://www.oaklodgehistory.org/documents/OakLodge/ClackamasCountyDirectories/1947-1948_OakGrove.pdf' \
            'https://oaklodgehistory.org/documents/OakLodge/ClackamasCountyDirectories/1947-1948_OakGrove.pdf' \
            'http://www.oaklodgehistory.org/documents/OakLodge/ClackamasCountyDirectories/1947-1948_OakGrove.pdf'; do
            echo "=== $u ===" | tee -a live-status.txt
            curl -sS -A 'Mozilla/5.0' -I -L --max-redirs 10 --connect-timeout 10 --max-time 35 "$u" 2>&1 | tee -a live-status.txt || true
            curl -sS -A 'Mozilla/5.0' -L --max-redirs 10 --connect-timeout 10 --max-time 45 -o candidate.bin "$u" || true
            mt="$(file -b --mime-type candidate.bin 2>/dev/null || true)"
            sz="$(stat -c%s candidate.bin 2>/dev/null || echo 0)"
            echo "MIME=$mt SIZE=$sz" | tee -a live-status.txt
            if [ "$mt" = 'application/pdf' ]; then cp candidate.bin directory.pdf; break; fi
          done
          if [ ! -f directory.pdf ]; then
            python3 - <<'PY'
          import json, urllib.parse, urllib.request, pathlib
          target='https://www.oaklodgehistory.org/documents/OakLodge/ClackamasCountyDirectories/1947-1948_OakGrove.pdf'
          cdx='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode({'url':target,'output':'json','filter':'statuscode:200','fl':'timestamp,original,mimetype,statuscode,digest,length','collapse':'digest'})
          try:
              req=urllib.request.Request(cdx,headers={'User-Agent':'Mozilla/5.0'})
              rows=json.load(urllib.request.urlopen(req,timeout=25))
              print('WAYBACK_ROWS',rows)
              if len(rows)>1:
                  ts=rows[-1][0]
                  url=f'https://web.archive.org/web/{ts}id_/{target}'
                  print('WAYBACK_FETCH',url)
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=60).read()
                  pathlib.Path('directory.pdf').write_bytes(data)
                  print('WAYBACK_BYTES',len(data))
          except Exception as e: print('WAYBACK_ERROR',repr(e))
          PY
          fi
          cp live-status.txt artifact/
          if [ -f directory.pdf ] && [ "$(file -b --mime-type directory.pdf)" = 'application/pdf' ]; then
            echo "PDF_BYTES $(stat -c%s directory.pdf)"
            cp directory.pdf artifact/
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils >/dev/null
            pdfinfo directory.pdf | tee artifact/pdfinfo.txt || true
            pdftotext -f 1 -l 12 -layout directory.pdf artifact/first-pages.txt || true
            echo '--- FIRST PAGES TEXT ---'
            sed -n '1,500p' artifact/first-pages.txt || true
            pdftoppm -f 1 -l 8 -png -r 140 directory.pdf artifact/page >/dev/null 2>&1 || true
          else
            echo 'NO_PDF_RECOVERED'
          fi
      - name: Upload scan inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: oak-lodge-1947-directory-inspection
          path: artifact/
          retention-days: 1