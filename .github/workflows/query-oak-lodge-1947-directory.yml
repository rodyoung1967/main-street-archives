name: Query Oak Lodge 1947-48 directory scan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/query-oak-lodge-1947-directory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Enumerate Wayback capture history
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          variants=[
            'https://www.oaklodgehistory.org/documents/OakLodge/ClackamasCountyDirectories/1947-1948_OakGrove.pdf',
            'https://oaklodgehistory.org/documents/OakLodge/ClackamasCountyDirectories/1947-1948_OakGrove.pdf',
            'http://www.oaklodgehistory.org/documents/OakLodge/ClackamasCountyDirectories/1947-1948_OakGrove.pdf',
            'http://oaklodgehistory.org/documents/OakLodge/ClackamasCountyDirectories/1947-1948_OakGrove.pdf',
          ]
          for target in variants:
              print('\nTARGET',target)
              params={'url':target,'output':'json','fl':'timestamp,original,mimetype,statuscode,digest,length,offset,filename','filter':'statuscode:200'}
              url='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params)
              print('CDX',url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Main-Street-Archive/1.0'})
                  rows=json.load(urllib.request.urlopen(req,timeout=35))
                  print('ROWS',len(rows)-1 if rows else 0)
                  for row in rows: print(row)
              except Exception as e: print('ERROR',repr(e))
          PY