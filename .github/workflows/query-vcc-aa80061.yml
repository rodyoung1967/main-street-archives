name: Query Copyright VCC AA80061

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/query-vcc-aa80061.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect VCC page and JavaScript endpoints
        run: |
          set -euxo pipefail
          mkdir -p artifact/js
          python3 - <<'PY'
          import re, urllib.parse, urllib.request, pathlib
          base='https://vcc.copyright.gov'
          req=urllib.request.Request(base+'/browse',headers={'User-Agent':'Mozilla/5.0 Main-Street-Archive/1.0'})
          with urllib.request.urlopen(req,timeout=25) as r:
              html=r.read().decode('utf-8','replace')
              print('BROWSE',r.status,r.geturl(),len(html),r.headers.get('content-type'))
          pathlib.Path('artifact/browse.html').write_text(html)
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I):
              url=urllib.parse.urljoin(base+'/browse',src)
              if url not in scripts: scripts.append(url)
          print('SCRIPTS',len(scripts))
          for i,url in enumerate(scripts):
              print('SCRIPT',i,url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Main-Street-Archive/1.0'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      data=r.read().decode('utf-8','replace')
                  pathlib.Path(f'artifact/js/{i:02d}.js').write_text(data)
                  print('  BYTES',len(data))
                  # Print strings that look like API/route calls or drawer/card/index endpoints.
                  hits=[]
                  for pat in [r'["\']([^"\']*(?:api|drawer|card|index|browse)[^"\']*)["\']', r'url\s*:\s*["\']([^"\']+)', r'\$\.ajax\((.*?)\)']:
                      for m in re.finditer(pat,data,re.I|re.S):
                          val=m.group(1)
                          if len(val)<300 and val not in hits: hits.append(val)
                  for h in hits[:150]: print('  HIT',h)
              except Exception as e: print('  ERROR',repr(e))
          # Also print browse HTML form/input names and any inline endpoint-looking strings.
          print('FORMS')
          for tag in re.findall(r'<form[^>]*>',html,re.I): print(tag)
          print('INPUTS')
          for tag in re.findall(r'<(?:input|select)[^>]*>',html,re.I):
              if any(k in tag.lower() for k in ('index','drawer','card','filter')): print(tag[:500])
          for m in re.finditer(r'["\'](/[^"\']*(?:drawer|card|index|browse|api)[^"\']*)["\']',html,re.I):
              print('INLINE_ROUTE',m.group(1))
          PY
          echo '--- GREP ROUTES ---'
          grep -RniE 'ajax|fetch\(|axios|/api/|drawer|cards?|indexes?|browse' artifact/js artifact/browse.html | head -n 1200 || true
      - name: Upload VCC probe
        uses: actions/upload-artifact@v4
        with:
          name: vcc-aa80061-probe
          path: artifact/
          retention-days: 1