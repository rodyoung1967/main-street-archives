name: Render 505 SHPO 30539 for visual review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-505-shpo-30539-for-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate archive before rendering
        run: python3 scripts/validate_archive.py
      - name: Install PDF rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Inspect and render original official PDF
        run: |
          set -euo pipefail
          PDF='records/historic-surveys/505-main-shpo-resource-30539-inventory-form.pdf'
          OUT='/tmp/505-shpo-render'
          mkdir -p "$OUT"
          file "$PDF"
          sha256sum "$PDF" | tee "$OUT/pdf-sha256.txt"
          pdfinfo "$PDF" | tee "$OUT/pdfinfo.txt"
          pdftoppm -png -r 160 "$PDF" "$OUT/505-main-shpo-resource-30539-inventory-form-page"
          ls -lh "$OUT"/*.png
          sha256sum "$OUT"/*.png | tee "$OUT/rendered-pages-sha256.txt"
      - name: Validate archive after rendering
        run: python3 scripts/validate_archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: 505-shpo-30539-visual-review
          path: |
            /tmp/505-shpo-render/*.png
            /tmp/505-shpo-render/pdfinfo.txt
            /tmp/505-shpo-render/pdf-sha256.txt
            /tmp/505-shpo-render/rendered-pages-sha256.txt
          if-no-files-found: error
          retention-days: 7
