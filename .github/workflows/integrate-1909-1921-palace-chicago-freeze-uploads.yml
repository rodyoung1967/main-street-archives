name: Integrate 1909-1921 Palace Chicago Freeze steward uploads

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-1909-1921-palace-chicago-freeze-uploads.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --quiet pyyaml
      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py
      - name: Correct integration IDs and YAML serializer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate_1909_1921_palace_chicago_freeze_uploads.py')
          text = p.read_text(encoding='utf-8')
          for old, new in [('T-067','T-071'), ('T-066','T-070'), ('T-065','T-069')]:
              text = text.replace(old, new)
          old = 'm = re.search(r"(?ms)(    related_sources:\\n(?:      - .+\\n)+)", block)'
          new = 'm = re.search(r"(?m)(    related_sources:\\n(?:      - [^\\n]+\\n)+)", block)'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected BUS-024 related_sources serializer not found; refusing blind patch.')
          p.write_text(text, encoding='utf-8')
          print('New batch timeline IDs set to T-069 through T-071; existing IDs untouched.')
          print('BUS-024 YAML related_sources serializer made line-bounded.')
          PY
      - name: Reconcile exact PDFs and integrate historical records
        run: python3 scripts/integrate_1909_1921_palace_chicago_freeze_uploads.py
      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py
      - name: Commit and push directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
          else
            git commit -m 'Integrate Palace Chicago and Freeze primary pages, 1909-1921'
            git push origin main
          fi
