name: Integrate April 1919 visual review

on:
  push:
    paths:
      - '.github/workflows/integrate-1919-april-visual.yml'
      - 'scripts/integrate_1919_april_visual.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git pull --rebase origin main

      - name: Repair obsolete April timeline paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/integrate_1919_april_visual.py')
          text = p.read_text(encoding='utf-8')
          for path in ('timelines/address-occupancy-timeline.md', 'timelines/business-occupancy-timeline.md'):
              pattern = rf'append_once\("{re.escape(path)}", MARKER, f\'\'\'.*?\n\'\'\'\)\n'
              text, n = re.subn(pattern, '', text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Expected one obsolete block for {path}, found {n}')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Compile integration script
        run: python3 -m py_compile scripts/integrate_1919_april_visual.py

      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py

      - name: Integrate April 1919 visual findings
        run: python3 scripts/integrate_1919_april_visual.py

      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py

      - name: Commit and push April 1919 integration
        run: |
          git config user.name "rodyoung1967"
          git config user.email "49879113+rodyoung1967@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "Close April 1919 newspaper visual audit"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Parallel main change detected; rebasing"
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            sleep $((attempt*2))
          done
          exit 1
