name: Repair P-1043 Fain integration script

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-p1043-fains-address.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML
      - name: Make integration script validator-consistent
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          sed -i "s|name: \"1 March 1943 The Amplifier p.4 — Fain's Men's Store at 511 Main page-text lead\"|name: \"1 March 1943 *The Amplifier* p.4, Fain's Men's Store 511 Main page-text lead\"|" scripts/integrate_p1043_fains_511_address_lead.py
          sed -i "s|name: \"1943 page text places Fain's Men's Store at 511 Main; 1930s mapping remains probable\"|name: \"1943 page text places Fain's Men's Store at 511 Main; 1930s P-1043 mapping remains probable\"|" scripts/integrate_p1043_fains_511_address_lead.py
          python3 scripts/validate_archive.py
          git add scripts/integrate_p1043_fains_511_address_lead.py
          if git diff --cached --quiet; then
            echo 'Integration script already consistent.'
            exit 0
          fi
          git commit -m "Make Fain integration script validator-consistent"
          git push origin HEAD:main
