name: Integrate CCHS 2008.008.002.425 1947 aerial

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_cchs_2008_008_002_425_1947_aerial.py'
      - '.github/workflows/integrate-cchs-2008-008-002-425-1947-aerial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration dependencies
        run: pip install Pillow PyYAML
      - name: Integrate 1947 CCHS aerial
        run: python3 scripts/integrate_cchs_2008_008_002_425_1947_aerial.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate CCHS 1947 Oregon City aerial'
          git pull --rebase origin main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
