name: Integrate P-1469 into clean branch

on:
  push:
    branches:
      - 'temp/finalize-p1469-main-v2'
    paths:
      - '.github/workflows/integrate-p1469.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    env:
      EXPECTED_BASE: a6fab942a9739c5e2abd8345b6b34dcce19516ee
      TARGET: media/photos/early-main-street/IMG-0732_1890-flood-6th-main-looking-southwest-cchs-p1469.jpg
      CCHS_IMAGE: https://d8e7jbdw4fu0e.cloudfront.net/4813/3c630c60-b5ce-11f0-b5a3-a3a9be51ef91-vdUeg2T.lg@2x.jpg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm clean authoritative base
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --quiet pyyaml
      - name: Validate base
        run: python3 scripts/validate_archive.py
      - name: Fetch authoritative CCHS P-1469 derivative
        run: |
          mkdir -p "$(dirname "$TARGET")"
          curl -fL --retry 3 "$CCHS_IMAGE" -o "$TARGET"
          test "$(head -c 3 "$TARGET" | xxd -p)" = "ffd8ff"
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "767915990ca00e17316f75ba2db51c5e0e2f36a2e36555020cf9caade4889e74"
      - name: Integrate records
        run: python3 scripts/integrate_p1469_photo.py
      - name: Validate completed archive
        run: python3 scripts/validate_archive.py
      - name: Commit final integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/photos/early-main-street/IMG-0732_1890-flood-6th-main-looking-southwest-cchs-p1469.jpg
          git add evidence/source-captures/1890-cchs-p1469-main-6th-looking-southwest-2026-09-03.md
          git add evidence/source-register.md evidence/evidence-register.md database/sources.yml database/evidence.yml
          git add media/photo-metadata-register.md media/photos/inventory.md media/photos/early-main-street/README.md media/catalog.md
          git add indexes/id-crosswalk.md registers/research-log.md
          git commit -m 'Integrate CCHS P-1469 1890 Main Street flood photograph'
          git push origin HEAD:temp/finalize-p1469-main-v2
