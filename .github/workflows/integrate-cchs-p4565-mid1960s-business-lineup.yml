name: Integrate CCHS P-4565 mid-1960s Main business lineup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_cchs_p4565_mid1960s_main_business_lineup.py'
      - '.github/workflows/integrate-cchs-p4565-mid1960s-business-lineup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow PyYAML
      - name: Integrate P-4565 photograph and business evidence
        run: python3 scripts/integrate_cchs_p4565_mid1960s_main_business_lineup.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate CCHS P-4565 mid-1960s business lineup'
          git pull --rebase origin main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
