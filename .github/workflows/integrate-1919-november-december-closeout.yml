name: Integrate 1919 November December closeout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-1919-november-december-closeout.yml'
      - 'scripts/integrate_1919_november_december_closeout.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py
      - name: Fix integration helper before integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/integrate_1919_november_december_closeout.py')
          t=p.read_text(encoding='utf-8')
          old='    p.write_text(text[:m.start()] + block + text[m.end():], encoding="utf-8")\n    return True\n'
          new='    if not block.endswith("\\n"):\n        block += "\\n"\n    p.write_text(text[:m.start()] + block + text[m.end():], encoding="utf-8")\n    return True\n'
          if old in t:
              t=t.replace(old,new,1)
          t=t.replace('name: "November 1919 Enterprise review and B. J. Staats 520-22 Main liquidation address"', 'name: "November 1919 Enterprise review and B. J. Staats 520–22 Main liquidation address"')
          t=t.replace('name: "December 1919 Enterprise review and Portland House Fifth-Main fire"', 'name: "December 1919 Enterprise review and Portland House Fifth/Main fire"')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Integrate November December and annual 1919 closeout
        run: python3 scripts/integrate_1919_november_december_closeout.py
      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py
      - name: Commit and push integration
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/integrate_1919_november_december_closeout.py evidence database businesses buildings registers indexes timeline.md ARCHIVE_INDEX.md MANUAL-FOLLOWUP.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Close 1919 online research and integrate year-end findings'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
