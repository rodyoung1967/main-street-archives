name: Review 1921 Freeze March-April pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-1921-freeze-march-april.yml"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - name: Fetch original pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/freeze-review
          curl -fL --retry 3 -A 'main-street-archives archival review/1.0' \
            'https://oregonnews.uoregon.edu/lccn/sn00063700/1921-03-25/ed-1/seq-3.pdf' \
            -o /tmp/freeze-review/1921-03-25-page-3.pdf
          curl -fL --retry 3 -A 'main-street-archives archival review/1.0' \
            'https://oregonnews.uoregon.edu/lccn/sn00063700/1921-04-01/ed-1/seq-3.pdf' \
            -o /tmp/freeze-review/1921-04-01-page-3.pdf
          file /tmp/freeze-review/*.pdf
      - name: Render pages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftoppm -f 1 -singlefile -png -r 180 /tmp/freeze-review/1921-03-25-page-3.pdf /tmp/freeze-review/1921-03-25-page-3
          pdftoppm -f 1 -singlefile -png -r 180 /tmp/freeze-review/1921-04-01-page-3.pdf /tmp/freeze-review/1921-04-01-page-3
          sha256sum /tmp/freeze-review/* > /tmp/freeze-review/SHA256SUMS.txt
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1921-freeze-march-april-review
          path: /tmp/freeze-review
          retention-days: 7
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/review-1921-freeze-march-april.yml
          git add -A
          git commit -m "Complete temporary 1921 Freeze scan fetch"
          git pull --rebase origin main
          git push origin HEAD:main
