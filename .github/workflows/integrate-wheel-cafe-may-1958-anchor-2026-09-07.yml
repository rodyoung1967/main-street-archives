name: Integrate May 1958 Wheel anchor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-wheel-cafe-may-1958-anchor-2026-09-07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Validate archive before retrieval
        run: python3 scripts/validate_archive.py

      - name: Retrieve May 16 1958 primary page
        run: |
          mkdir -p newspapers/clackamas-county-news
          curl -fL --retry 3 --retry-delay 2 \
            'https://oregonnews.uoregon.edu/lccn/sn96088135/1958-05-16/ed-1/seq-2.pdf' \
            -o newspapers/clackamas-county-news/1958-05-16-p2-wheel-cafe-lounge-503-main.pdf
          test $(wc -c < newspapers/clackamas-county-news/1958-05-16-p2-wheel-cafe-lounge-503-main.pdf) -gt 10000
          file newspapers/clackamas-county-news/1958-05-16-p2-wheel-cafe-lounge-503-main.pdf

      - name: Integrate earlier Wheel endpoint
        run: python3 scripts/integrate_wheel_cafe_may_1958_anchor.py

      - name: Normalize generated archive records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # The one-off integrator's append helper strips the first line's
          # leading spaces. Restore root-list indentation in YAML databases.
          for name, prefix in (
              ('database/sources.yml', 'S'),
              ('database/evidence.yml', 'E'),
              ('database/timeline.yml', 'T'),
          ):
              p = Path(name)
              t = p.read_text(encoding='utf-8')
              t = re.sub(rf'(?m)^- id: ({prefix}-\d+)\s*$', r'  - id: \1', t)
              p.write_text(t, encoding='utf-8')

          # Keep the Markdown evidence title synchronized with the YAML name,
          # and supply the explicit Confidence field required by the validator.
          p = Path('evidence/evidence-register.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              'Wheel Cafe & Lounge is directly documented at 503 Main by 16 May 1958',
              'Wheel Cafe & Lounge at exact 503 Main by 16 May 1958'
          )
          marker = 'Wheel Cafe May 1958 earliest recovered anchor — 2026-09-07'
          if marker in t and 'Confidence: **Very High / DOCUMENTED-DIRECT for 16 May 1958 name/address/phone; transition unresolved.**' not in t:
              needle = 'Classification: **DOCUMENTED / DIRECT** for 16 May 1958 name/address/phone; **UNRESOLVED TRANSITION** when paired with the 1957 Flor endpoint.'
              repl = 'Confidence: **Very High / DOCUMENTED-DIRECT for 16 May 1958 name/address/phone; transition unresolved.**  \n' + needle
              t = t.replace(needle, repl, 1)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py

      - name: Commit and push synchronized research
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add \
            newspapers/clackamas-county-news/1958-05-16-p2-wheel-cafe-lounge-503-main.pdf \
            evidence/source-captures/1958-wheel-cafe-earliest-advertisement-backward-pass-2026-09-07.md \
            evidence/source-captures/morton-wheel-to-oregon-city-wheel-ownership-bridge-pass-2026-09-05.md \
            evidence/source-register.md \
            evidence/evidence-register.md \
            evidence/open-questions.md \
            database/sources.yml \
            database/evidence.yml \
            database/timeline.yml \
            database/businesses.yml \
            database/buildings.yml \
            businesses/the-wheel.md \
            businesses/kwality-cafe.md \
            businesses/business-index.md \
            buildings/503-main.md \
            people/profiles/albert-d-flor-family.md \
            timelines/503-main.md \
            registers/business-timeline.md \
            registers/research-log.md \
            indexes/id-crosswalk.md \
            timeline.md \
            MANUAL-FOLLOWUP.md \
            registers/research-requests/morton-wheel-and-oregon-city-wheel-pre-raye-ownership-bridge-request-2026-09-05.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Move Wheel exact-address anchor to May 1958'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
