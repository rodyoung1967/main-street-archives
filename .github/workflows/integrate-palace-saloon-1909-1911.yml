name: Integrate Palace Saloon 1909-1911 pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-palace-saloon-1909-1911.yml"
      - "scripts/integrate_palace_saloon_1909_1911.py"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py

      - name: Preserve canonical newspaper page PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p newspapers/oregon-city-courier newspapers/morning-enterprise
          curl --fail --location --retry 4 --retry-delay 2 --user-agent 'main-street-archives-research/1.0' \
            'https://oregonnews.uoregon.edu/lccn/sn00063698/1909-06-25/ed-1/seq-5.pdf' \
            -o 'newspapers/oregon-city-courier/1909-06-25-page-5-palace-saloon-smith-hall-interest.pdf'
          curl --fail --location --retry 4 --retry-delay 2 --user-agent 'main-street-archives-research/1.0' \
            'https://oregonnews.uoregon.edu/lccn/sn00063698/1909-06-25/ed-1/seq-7.pdf' \
            -o 'newspapers/oregon-city-courier/1909-06-25-page-7-palace-saloon-ralph-o-smith-license.pdf'
          curl --fail --location --retry 4 --retry-delay 2 --user-agent 'main-street-archives-research/1.0' \
            'https://oregonnews.uoregon.edu/lccn/sn00063701/1911-06-20/ed-1/seq-3.pdf' \
            -o 'newspapers/morning-enterprise/1911-06-20-page-3-palace-saloon-joseph-wilson-license.pdf'
          file \
            newspapers/oregon-city-courier/1909-06-25-page-5-palace-saloon-smith-hall-interest.pdf \
            newspapers/oregon-city-courier/1909-06-25-page-7-palace-saloon-ralph-o-smith-license.pdf \
            newspapers/morning-enterprise/1911-06-20-page-3-palace-saloon-joseph-wilson-license.pdf
          sha256sum \
            newspapers/oregon-city-courier/1909-06-25-page-5-palace-saloon-smith-hall-interest.pdf \
            newspapers/oregon-city-courier/1909-06-25-page-7-palace-saloon-ralph-o-smith-license.pdf \
            newspapers/morning-enterprise/1911-06-20-page-3-palace-saloon-joseph-wilson-license.pdf

      - name: Integrate source and evidence records
        run: python3 scripts/integrate_palace_saloon_1909_1911.py

      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py

      - name: Commit and push directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/integrate-palace-saloon-1909-1911.yml
          rm -f scripts/integrate_palace_saloon_1909_1911.py
          git add -A
          git commit -m "Integrate Palace Saloon primary pages, 1909-1911"
          git pull --rebase origin main
          git push origin HEAD:main
