name: Integrate Flor-Kwality 1953 continuity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/integrate-flor-kwality-1953-continuity-2026-09-06.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Validate archive before edit
        run: python3 scripts/validate_archive.py

      - name: Integrate Flor-Kwality continuity
        run: python3 scripts/integrate_flor_kwality_1953_continuity.py

      - name: Validate archive after edit
        run: python3 scripts/validate_archive.py

      - name: Commit and push synchronized research
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add \
            evidence/source-captures/albert-d-flor-morton-bridge-pass-2026-09-06.md \
            people/profiles/albert-d-flor-family.md \
            businesses/kwality-cafe.md \
            evidence/source-captures/1953-oregon-city-vicinity-directory-lead.md \
            registers/research-requests/morton-wheel-and-oregon-city-wheel-pre-raye-ownership-bridge-request-2026-09-05.md \
            MANUAL-FOLLOWUP.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Connect Flor-Remus to 1953 Kwality continuity lead'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
