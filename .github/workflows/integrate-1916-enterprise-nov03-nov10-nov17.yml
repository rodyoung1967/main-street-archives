name: Integrate 1916 Enterprise November 3 10 and 17 visual reviews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-1916-enterprise-nov03-nov10-nov17.yml'
      - 'scripts/integrate_1916_enterprise_nov03_nov10_nov17.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync newest main
        run: git pull --rebase origin main
      - name: Validate before integration
        run: python3 scripts/validate_archive.py
      - name: Integrate certified reviews
        run: python3 scripts/integrate_1916_enterprise_nov03_nov10_nov17.py
      - name: Ensure source notes required by schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('database/sources.yml')
          s=p.read_text()
          fixes={
            '    related_evidence: [E-333]\n':'    related_evidence: [E-333]\n    notes: "Complete issue visually reviewed; recurring non-target Main Street controls and transfer material checked; no source-explicit target-premises event."\n',
            '    related_evidence: [E-334]\n':'    related_evidence: [E-334]\n    notes: "Complete issue visually reviewed; recurring non-target Main Street controls and transfer material checked; no source-explicit target-premises event."\n',
            '    related_evidence: [E-335]\n':'    related_evidence: [E-335]\n    notes: "Complete issue visually reviewed; recurring non-target Main Street controls and transfer material checked; no source-explicit target-premises event."\n',
          }
          for old,new in fixes.items():
            if old not in s:
              raise SystemExit(f'expected source entry not found: {old.strip()}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate integrated archive
        run: python3 scripts/validate_archive.py
      - name: Commit and publish integration
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add evidence/source-captures/1916-enterprise-november03-visual-review-2026-09-13.md \
                  evidence/source-captures/1916-enterprise-november10-visual-review-2026-09-13.md \
                  evidence/source-captures/1916-enterprise-november17-visual-review-2026-09-13.md \
                  evidence/source-captures/1916-online-audit-checkpoint.md \
                  evidence/source-register.md evidence/evidence-register.md \
                  database/sources.yml database/evidence.yml registers/year-status.md
          if git diff --cached --quiet; then echo 'No integration changes'; exit 0; fi
          git commit -m 'Certify November 3 10 and 17 1916 Enterprise reviews'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
