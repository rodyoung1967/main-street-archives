name: Fetch 505 SHPO 30539 inventory PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-505-shpo-30539-inventory-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-505-shpo-30539-inventory-pdf
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize latest main
        run: git pull --rebase origin main
      - name: Install validator dependency
        run: pip install PyYAML
      - name: Validate archive before retrieval
        run: python3 scripts/validate_archive.py
      - name: Fetch official SHPO inventory scan
        run: |
          set -euo pipefail
          mkdir -p records/historic-surveys
          url='https://heritagedata.prd.state.or.us/historic/index.cfm?do=main.loadFile&load=30539.pdf'
          out='records/historic-surveys/505-main-shpo-resource-30539-inventory-form.pdf'
          curl -fL --retry 3 --retry-delay 2 -A 'main-street-archives historical research' "$url" -o "$out"
          file "$out"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('records/historic-surveys/505-main-shpo-resource-30539-inventory-form.pdf')
          b = p.read_bytes()
          if not b.startswith(b'%PDF'):
              raise SystemExit('Retrieved object is not a PDF')
          sha = hashlib.sha256(b).hexdigest()
          note = Path('records/historic-surveys/505-main-shpo-resource-30539-inventory-form-provenance.md')
          note.write_text(
              '# 505 Main — Oregon SHPO resource 30539 Inventory Form\n\n'
              'Retrieval date: **6 September 2026**  \n'
              'Status: **ORIGINAL OFFICIAL PDF RETRIEVED; VISUAL REVIEW REQUIRED BEFORE PROMOTING SCAN CONTENT**\n\n'
              'Source page: `https://heritagedata.prd.state.or.us/historic/index.cfm?do=v.dsp_siteSummary&resultDisplay=30539`  \n'
              'Inventory-form endpoint: `https://heritagedata.prd.state.or.us/historic/index.cfm?do=main.loadFile&load=30539.pdf`  \n'
              'Repository PDF: `records/historic-surveys/505-main-shpo-resource-30539-inventory-form.pdf`  \n'
              f'SHA-256: `{sha}`  \n'
              f'Bytes: **{len(b)}**.\n\n'
              'This is the scanned document exposed by the official Oregon Historic Sites Database for **RESOURCE_ID 30539 / 505 Main St / 505 Tavern**. '
              'OCR or text extraction may be used for discovery, but historical claims from this scan must be based on visual inspection of the original rendered pages. '
              'Search targets include **Farr**, **Harr**, **Well / Wells / Well\'s Recreation**, 1941/1945/1953 directory citations, and any bibliography/source notes.\n',
              encoding='utf-8'
          )
          print('SHA256', sha)
          print('BYTES', len(b))
          PY
      - name: Validate archive after retrieval
        run: python3 scripts/validate_archive.py
      - name: Commit and push official SHPO scan
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add records/historic-surveys/505-main-shpo-resource-30539-inventory-form.pdf records/historic-surveys/505-main-shpo-resource-30539-inventory-form-provenance.md
          if git diff --cached --quiet; then
            echo 'No retrieval files changed.'
            exit 0
          fi
          git commit -m 'Preserve 505 SHPO resource 30539 inventory scan'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt raced with another main update; retrying..."
            sleep 3
          done
          echo 'Unable to push after retries.' >&2
          exit 1
