name: Query CCHS 1896 6th Main photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/query-cchs-1896-6th-main.yml'
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query CatalogIt
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          queries = [
              "Oregon City 1896 - 6th and Main Street",
              "Oregon City 1896 6th Main Street",
              "6th and Main Street Oregon City 1896",
              "Harding Cut Rate Drug Store East Side Railway Oregon City",
          ]
          def walk(o):
              if isinstance(o, dict):
                  yield o
                  for v in o.values(): yield from walk(v)
              elif isinstance(o, list):
                  for v in o: yield from walk(v)
          def cat(d):
              try: return d['properties']['hasCatalogNumber']['value_text']
              except Exception: return None
          def name(d):
              try: return d['properties']['hasName']['value_text']
              except Exception: return d.get('title') or d.get('name') or d.get('label') or d.get('slug')
          seen=set()
          for q in queries:
              url='https://api.catalogit.app/api/public/search?'+urllib.parse.urlencode({'query':q,'size':100})
              print('\nQUERY',q,'URL',url)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Main-Street-Archive/1.0'})
              data=json.load(urllib.request.urlopen(req,timeout=90))
              for d in walk(data):
                  c=cat(d)
                  nm=name(d)
                  slug=d.get('slug')
                  did=d.get('id')
                  key=(c,nm,slug,did)
                  if c and key not in seen:
                      seen.add(key)
                      print('CANDIDATE',c,'|',nm,'| id=',did,'| slug=',slug,'| account=',d.get('account_id'))
          PY
