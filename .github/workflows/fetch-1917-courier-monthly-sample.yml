name: Fetch 1917 Courier monthly sample

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-1917-courier-monthly-sample.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest main
        run: |
          git pull --rebase origin main

      - name: Validate archive before retrieval
        run: python3 scripts/validate_archive.py

      - name: Download first Courier issue of each month
        shell: bash
        run: |
          set -euo pipefail
          out="newspapers/oregon-city-courier/1917-first-issue-monthly-sample"
          mkdir -p "$out"
          rm -f "$out"/*.pdf "$out/sha256.txt" "$out/manifest.json"

          fetch_issue() {
            d="$1"; count="$2"
            for n in $(seq 1 "$count"); do
              nn=$(printf '%02d' "$n")
              f="$out/${d}-seq-${nn}.pdf"
              url="https://oregonnews.uoregon.edu/lccn/sn00063698/${d}/ed-1/seq-${n}.pdf"
              curl --fail --location --retry 3 --retry-delay 1 --connect-timeout 20 --max-time 180 \
                --user-agent "Mozilla/5.0 (main-street-archives research)" -o "$f" "$url" &
              while [ "$(jobs -rp | wc -l)" -ge 8 ]; do wait -n; done
            done
          }

          fetch_issue 1917-01-04 8
          fetch_issue 1917-02-01 8
          fetch_issue 1917-03-01 10
          fetch_issue 1917-04-05 8
          fetch_issue 1917-05-03 8
          fetch_issue 1917-06-07 8
          fetch_issue 1917-07-05 8
          fetch_issue 1917-08-02 6
          fetch_issue 1917-09-06 8
          fetch_issue 1917-10-04 8
          fetch_issue 1917-11-01 8
          fetch_issue 1917-12-06 8
          wait

          test "$(find "$out" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 96
          for f in "$out"/*.pdf; do
            test "$(head -c 4 "$f")" = "%PDF"
            sha256sum "$f" >> "$out/sha256.txt"
          done

      - name: Write retrieval manifest
        shell: python
        run: |
          import hashlib, json, pathlib
          from datetime import datetime, timezone
          out = pathlib.Path("newspapers/oregon-city-courier/1917-first-issue-monthly-sample")
          issues = [
              ("1917-01-04",8),("1917-02-01",8),("1917-03-01",10),
              ("1917-04-05",8),("1917-05-03",8),("1917-06-07",8),
              ("1917-07-05",8),("1917-08-02",6),("1917-09-06",8),
              ("1917-10-04",8),("1917-11-01",8),("1917-12-06",8),
          ]
          items=[]
          for date,count in issues:
              for seq in range(1,count+1):
                  pdf=out/f"{date}-seq-{seq:02d}.pdf"
                  items.append({
                      "date":date,
                      "sequence":seq,
                      "file":pdf.name,
                      "source_url":f"https://oregonnews.uoregon.edu/lccn/sn00063698/{date}/ed-1/seq-{seq}.pdf",
                      "sha256":hashlib.sha256(pdf.read_bytes()).hexdigest(),
                      "review_status":"PENDING VISUAL REVIEW"
                  })
          manifest={
              "title":"Oregon City Courier 1917 first-issue-of-each-month sample",
              "newspaper_lccn":"sn00063698",
              "sampling_rule":"first available Courier issue in each calendar month",
              "retrieved_utc":datetime.now(timezone.utc).isoformat(),
              "issue_count":len(issues),
              "page_count":len(items),
              "issues":[{"date":d,"page_count":c} for d,c in issues],
              "items":items,
              "annual_completion_limit":"Sampling pass only; does not satisfy exhaustive annual newspaper review."
          }
          (out/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")

      - name: Upload preserved PDFs
        uses: actions/upload-artifact@v4
        with:
          name: 1917-courier-first-issue-monthly-sample
          path: newspapers/oregon-city-courier/1917-first-issue-monthly-sample
          retention-days: 7

      - name: Commit preserved PDFs and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "main-street-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add newspapers/oregon-city-courier/1917-first-issue-monthly-sample
          git commit -m "Archive 1917 Courier monthly sample pages"
          git pull --rebase origin main
          git push origin HEAD:main
