name: Integrate September 1917 Oregon City Enterprise

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/integrate-1917-enterprise-september.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync to latest main
        run: git pull --rebase origin main
      - name: Compile integration script
        run: python3 -m py_compile scripts/integrate_1917_enterprise_september.py
      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py
      - name: Integrate September Enterprise visual closeout
        run: python3 scripts/integrate_1917_enterprise_september.py
      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py
      - name: Commit synchronized September closeout
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add \
            scripts/integrate_1917_enterprise_september.py \
            evidence/source-captures/1917-enterprise-september-07-28-visual-review-2026-09-07.md \
            evidence/source-register.md evidence/evidence-register.md \
            database/sources.yml database/evidence.yml database/businesses.yml database/people.yml \
            businesses/j-c-penney-golden-rule.md businesses/fashion-stable.md businesses/farr-brothers-store.md businesses/business-index.md \
            people/profiles/w-s-eddy.md people/people-index.md \
            timeline.md registers/business-timeline.md registers/address-register.md \
            evidence/research-leads.md evidence/open-questions.md evidence/source-captures/1917-closeout.md \
            indexes/id-crosswalk.md registers/research-log.md registers/year-status.md ARCHIVE_INDEX.md
          if git diff --cached --quiet; then
            echo 'No September integration changes.'
            exit 0
          fi
          git commit -m 'Close September 1917 Enterprise visual audit'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then exit 0; fi
            echo "Push race on attempt $attempt; retrying"
            sleep $((attempt*2))
          done
          exit 1
