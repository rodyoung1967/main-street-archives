name: Integrate March 1919 visual review

on:
  push:
    paths:
      - '.github/workflows/integrate-1919-march-visual.yml'
      - 'scripts/integrate_1919_march_visual.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git pull --rebase origin main

      - name: Repair March YAML relation updater
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate_1919_march_visual.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('def update_yaml_relation(')
          end = text.index('\nif Path(CAPTURE).exists():', start)
          fn = r'''def update_yaml_relation(path, entity_id, field, value):
              p=Path(path); t=p.read_text(encoding='utf-8')
              m=re.search(rf'(?ms)^  - id: {re.escape(entity_id)}\n.*?(?=^  - id: |\Z)',t)
              if not m: return False
              block=m.group(0)
              fm=re.search(rf'(?m)^    {re.escape(field)}:\s*\[([^\]]*)\]\s*$',block)
              if fm:
                  vals=[v.strip() for v in fm.group(1).split(',') if v.strip()]
                  if value in vals: return False
                  vals.append(value)
                  new=f'    {field}: [' + ', '.join(vals) + ']'
                  block=block[:fm.start()] + new + block[fm.end():]
              else:
                  lines=block.splitlines(keepends=True)
                  field_idx=None
                  for i,line in enumerate(lines):
                      if re.match(rf'^    {re.escape(field)}:\s*$', line.rstrip('\n')):
                          field_idx=i
                          break
                  if field_idx is None:
                      if not block.endswith('\n'): block += '\n'
                      block += f'    {field}: [{value}]\n'
                  else:
                      j=field_idx+1
                      vals=[]
                      item_indent=None
                      while j < len(lines):
                          im=re.match(r'^(\s*)-\s*(.+?)\s*\n?$', lines[j])
                          if not im or len(im.group(1)) < 4:
                              break
                          item_indent=item_indent or im.group(1)
                          vals.append(im.group(2).strip())
                          j += 1
                      if value in vals: return False
                      indent=item_indent or '    '
                      lines.insert(j, f'{indent}- {value}\n')
                      block=''.join(lines)
              t=t[:m.start()] + block + t[m.end():]
              p.write_text(t,encoding='utf-8')
              return True
          '''
          # Remove the workflow/YAML indentation from the replacement function.
          import textwrap
          fn = textwrap.dedent(fn)
          p.write_text(text[:start] + fn + text[end:], encoding='utf-8')
          PY

      - name: Compile integration script
        run: python3 -m py_compile scripts/integrate_1919_march_visual.py

      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py

      - name: Integrate March 1919 visual findings
        run: python3 scripts/integrate_1919_march_visual.py

      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py

      - name: Commit and push March 1919 integration
        run: |
          git config user.name "rodyoung1967"
          git config user.email "49879113+rodyoung1967@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "Close March 1919 newspaper visual audit"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Parallel main change detected; rebasing"
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            sleep $((attempt*2))
          done
          exit 1
