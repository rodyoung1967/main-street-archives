      - name: Validate integrated archive
        run: python3 scripts/validate_archive.py
      - name: Commit and publish integration
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add evidence/source-captures/1916-enterprise-june30-visual-review-2026-09-12.md \
                  evidence/source-captures/1916-enterprise-july07-visual-review-2026-09-12.md \
                  evidence/source-captures/1916-online-audit-checkpoint.md \
                  evidence/source-register.md evidence/evidence-register.md \
                  database/sources.yml database/evidence.yml registers/year-status.md
          git commit -m 'Certify June 30 and July 7 1916 Enterprise reviews'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
