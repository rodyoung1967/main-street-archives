name: Integrate 1918-1920 transition triage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-1918-1920-transition-triage.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - name: Integrate triage and access paths
        run: python3 scripts/integrate_1918_1920_transition_triage.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/integrate-1918-1920-transition-triage.yml
          git add -A
          git commit -m "Integrate 1918-1920 transition triage and access paths"
          git pull --rebase origin main
          git push origin HEAD:main
