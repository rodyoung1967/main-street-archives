name: Probe HPRM adjacent 1954 minute objects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-hprm-1954-adjacent.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect small WebDrawer record neighborhood after Dec 1953
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tempfile, urllib.request
          base='https://ormswd.synergydcs.com/HPRMWebDrawer/Record/{}/File/document'
          ids=list(range(4723909,4723921))
          for rid in ids:
            url=base.format(rid)
            print('\n=== RECORD',rid,'===')
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Main-Street-Archive/1.0'})
              with urllib.request.urlopen(req,timeout=25) as r:
                data=r.read()
                ctype=r.headers.get('Content-Type','')
                print('STATUS',r.status,'TYPE',ctype,'BYTES',len(data),'FINAL',r.geturl())
            except Exception as e:
              print('ERROR',repr(e)); continue
            if 'pdf' not in ctype.lower() and not data.startswith(b'%PDF'):
              print('NONPDF_HEAD',data[:300]); continue
            with tempfile.TemporaryDirectory() as td:
              pdf=os.path.join(td,'x.pdf'); txt=os.path.join(td,'x.txt')
              open(pdf,'wb').write(data)
              try:
                subprocess.run(['pdftotext','-layout',pdf,txt],check=True,timeout=40,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                s=open(txt,encoding='utf-8',errors='replace').read()
              except Exception as e:
                print('PDFTEXT_ERROR',repr(e)); continue
            compact=' '.join(s.split())
            print('TEXT_HEAD',compact[:1200])
            for needle in ('1954','liquor','license','505','well','harr','recreation','pool','tavern'):
              low=s.lower(); start=0; count=0
              while count<6:
                pos=low.find(needle,start)
                if pos<0: break
                ctx=' '.join(s[max(0,pos-350):pos+900].split())
                print('CTX',needle,'|',ctx)
                start=pos+len(needle); count+=1
          PY
