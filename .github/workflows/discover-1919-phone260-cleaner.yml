name: Discover 1919 Phone 260 cleaner leads

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-1919-phone260-cleaner.yml"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main
        run: git pull --rebase origin main

      - name: Search 1919 Enterprise OCR
        run: python3 scripts/discover_1919_phone260_cleaner.py

      - name: Validate archive
        run: python3 scripts/validate_archive.py

      - name: Commit discovery report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/discover-1919-phone260-cleaner.yml
          git add -A
          git commit -m "Inventory 1919 Phone 260 cleaner OCR leads"
          git pull --rebase origin main
          git push origin HEAD:main
