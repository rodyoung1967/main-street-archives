name: Preserve 1915 Enterprise pages 313–352

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-1915-enterprise-313-352.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve the exact PDFs used in the visual review
        shell: python
        run: |
          from concurrent.futures import ThreadPoolExecutor
          from hashlib import sha256
          import json
          from pathlib import Path
          import subprocess

          root = Path("newspapers/oregon-city-enterprise")
          batches = ["1915-pages-313-352"]

          def preserve(entry):
              folder, item = entry
              pdf = folder / item["file"]
              if not pdf.is_file():
                  data = subprocess.check_output([
                      "curl", "--fail", "--silent", "--show-error", "--location",
                      "--retry", "4", "--connect-timeout", "15", "--max-time", "120",
                      item["source_url"],
                  ])
              else:
                  data = pdf.read_bytes()
              if not data.startswith(b"%PDF-") or sha256(data).hexdigest() != item["sha256"]:
                  raise ValueError(f"Archived derivative does not match the reviewed scan: {pdf}")
              if not pdf.is_file():
                  pdf.write_bytes(data)

          for batch, count in zip(batches, [40], strict=True):
              folder = root / batch
              manifest = json.loads((folder / "manifest.json").read_text())
              if len(manifest["items"]) != count:
                  raise ValueError(f"Unexpected page count: {batch}")
              with ThreadPoolExecutor(max_workers=6) as pool:
                  list(pool.map(preserve, ((folder, item) for item in manifest["items"])))

      - name: Validate and commit scan PDFs
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python scripts/validate_archive.py
          git add newspapers/oregon-city-enterprise/1915-pages-313-352
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Preserve 40 visually reviewed October 1915 Enterprise scans"
          git fetch --depth=20 origin main
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' rebase origin/main
          python scripts/validate_archive.py
          git push origin HEAD:main
