name: Render 1921 Mar11 Enterprise
on:
  push:
    paths:
      - '.github/workflows/render-1921-mar11-enterprise.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Fetch March 11
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rendered/1921-03-11
          seq=1
          while true; do
            url="https://oregonnews.uoregon.edu/lccn/sn00063700/1921-03-11/ed-1/seq-$seq.jp2"
            if ! curl -fL --retry 2 "$url" -o "/tmp/1921-03-11-$seq.jp2"; then break; fi
            convert "/tmp/1921-03-11-$seq.jp2" -resize '3000x3000>' -quality 94 "rendered/1921-03-11/seq-$seq.jpg"
            seq=$((seq+1))
          done
          find rendered -type f -name '*.jpg' | sort > rendered-inventory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 1921-enterprise-mar11-renders
          path: |
            rendered/
            rendered-inventory.txt
          retention-days: 14
