name: Integrate 1916 Enterprise May 19 and May 26

on:
  push:
    paths:
      - '.github/workflows/integrate-1916-enterprise-may19-may26.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Validate before integration
        run: python3 scripts/validate_archive.py
      - name: Integrate May 19 and May 26 reviews
        run: python3 scripts/maintenance/integrate_1916_enterprise_may19_may26_v2.py
      - name: Validate after integration
        run: python3 scripts/validate_archive.py
      - name: Commit and push
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add evidence/source-register.md evidence/evidence-register.md database/sources.yml database/evidence.yml registers/year-status.md evidence/source-captures/1916-online-audit-checkpoint.md
          if ! git diff --cached --quiet; then git commit -m 'Certify May 19 and May 26 1916 Enterprise reviews'; fi
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

# retry after synchronizing the v2 wrapper with the corrected base integration
