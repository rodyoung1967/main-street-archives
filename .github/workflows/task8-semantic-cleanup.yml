name: Task 8 semantic cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run Task 8 semantic cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply semantic cleanup
        run: python scripts/task8_semantic_cleanup.py
      - name: Validate archive before commit
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python scripts/validate_archive.py
      - name: Commit cleaned integration state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Tighten Task 8 cadastral integration"
          git push
