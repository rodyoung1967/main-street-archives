name: Fetch 1934 Municipal Activities Report

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-1934-municipal-activities-report.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync to latest main
        run: git pull --rebase origin main
      - name: Validate archive before fetch
        run: python3 scripts/validate_archive.py
      - name: Fetch and verify official 1934 report
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, requests
          url='https://www.orcity.org/DocumentCenter/View/6222/1934-Municipal-Activities-Report'
          expected='8e44f4d566cbf9eb7299f384001842860ac7437ee1a6de983a00547c5f9d0faa'
          out=pathlib.Path('records/municipal/annual-reports/1934-Municipal-Activities-Report.pdf')
          r=requests.get(url,timeout=120,allow_redirects=True,headers={'User-Agent':'main-street-archives municipal-report preservation'})
          r.raise_for_status()
          data=r.content
          if not data.startswith(b'%PDF'):
              raise SystemExit(f'Not a PDF: {r.headers.get("content-type")} {len(data)} bytes')
          got=hashlib.sha256(data).hexdigest()
          print(f'bytes={len(data)} sha256={got} final_url={r.url}')
          if got != expected:
              raise SystemExit(f'SHA-256 mismatch: expected {expected}, got {got}')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(data)
          PY
      - name: Validate archive after fetch
        run: python3 scripts/validate_archive.py
      - name: Commit report
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add 'records/municipal/annual-reports/1934-Municipal-Activities-Report.pdf'
          if git diff --cached --quiet; then
            echo 'No report changes.'
            exit 0
          fi
          git commit -m 'Preserve 1934 municipal activities report'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
