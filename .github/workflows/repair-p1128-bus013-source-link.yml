name: Repair P-1128 Farr business source link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-p1128-bus013-source-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML
      - name: Repair BUS-013 source link and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          from pathlib import Path
          p = Path('database/businesses.yml')
          text = p.read_text(encoding='utf-8')
          old = '    related_sources: [S-036]\n    repository_file: businesses/farrs-pool-hall.md'
          new = '    related_sources: [S-036, S-236]\n    repository_file: businesses/farrs-pool-hall.md'
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'related_sources: [S-036, S-236]' not in text:
              raise SystemExit('BUS-013 source-link pattern not found')
          PY
            python3 scripts/validate_archive.py
            git add database/businesses.yml
            if git diff --cached --quiet; then
              echo 'BUS-013 source link already repaired.'
              exit 0
            fi
            git commit -m 'Link P-1128 source to Farr business record'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
