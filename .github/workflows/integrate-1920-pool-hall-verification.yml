name: Integrate 1920 Fifth-Sixth Main pool-hall verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-1920-pool-hall-verification.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main
        run: git pull --rebase origin main

      - name: Integrate verified 1920 source set
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/block\.strip()/block.rstrip()/' scripts/integrate_1920_pool_hall_verification.py
          python3 scripts/integrate_1920_pool_hall_verification.py

      - name: Validate archive
        run: python3 scripts/validate_archive.py

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate verified 1920 pool-hall evidence at 505½ Main"
          git pull --rebase origin main
          git push origin HEAD:main
