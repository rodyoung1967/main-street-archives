name: Task 9 final consistency check

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Run Task 9 final consistency check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final E-105 consistency corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              Path('evidence/E-105-1913-numbering-plat-ordinance-357.md'): (
                  'The page does not reproduce the plan and therefore does not establish the original Block 26 lot or building corresponding to 501, 503, or 505 Main.',
                  'The page does not reproduce the plan and therefore does not establish any exact original Block 4 lot or building corresponding to 501, 503, or 505 Main.'
              ),
              Path('evidence/evidence-register.md'): (
                  'The notice does not reproduce the plat or map 501/503/505 to original Block 26 lots.',
                  'The notice does not reproduce the plat or establish any exact 501/503/505-to-original-Block-4 lot mapping.'
              ),
              Path('database/evidence.yml'): (
                  'This corroborates the 1906 numbering-plat sequence but does not reproduce the plat or map 501, 503, or 505 to Block 26 lots.',
                  'This corroborates the 1906 numbering-plat sequence but does not reproduce the plat or establish any exact 501, 503, or 505-to-original-Block-4 lot mapping.'
              ),
          }

          for path, (old, new) in changes.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one stale E-105 phrase, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          Path('.github/workflows/task9-finalize.yml').unlink()
          print('Task 9 E-105 corrections applied')
          PY
      - name: Guard against stale target-side Block 26 wording
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = [
              'original Block 26 lot or building corresponding to 501, 503, or 505 Main',
              'does not reproduce the plat or map 501/503/505 to original Block 26 lots',
              'does not reproduce the plat or map 501, 503, or 505 to Block 26 lots',
          ]
          hits = []
          for path in list(Path('.').rglob('*.md')) + list(Path('.').rglob('*.yml')):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for phrase in forbidden:
                  if phrase in text:
                      hits.append(f'{path}: {phrase}')
          if hits:
              raise SystemExit('Stale Task 6 wording remains:\n' + '\n'.join(hits))
          print('No forbidden stale E-105 Block 26 wording remains')
          PY
      - name: Validate final archive tree
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          git diff --check
          python scripts/validate_archive.py
          git status --short
      - name: Commit and push final Task 9 checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Task 9 archive validation"
          git push
