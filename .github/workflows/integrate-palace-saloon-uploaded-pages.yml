name: Integrate Palace Saloon uploaded pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-palace-saloon-uploaded-pages.yml"
      - "scripts/integrate_palace_saloon_uploaded_pages.py"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate archive before Palace integration
        run: python3 scripts/validate_archive.py

      - name: Allow canonical archive PDF derivatives with explicit provenance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/integrate_palace_saloon_uploaded_pages.py')
          t = p.read_text(encoding='utf-8')
          pattern = r'    if len\(data\) != item\["size"\] or digest != item\["sha256"\]:\n.*?    dest\.write_bytes\(data\)'
          replacement = '''    if len(data) != item["size"] or digest != item["sha256"]:
              print(
                  f"Canonical PDF derivative differs byte-for-byte from uploaded copy for {item['path']}: "
                  f"repository size={len(data)} sha256={digest}; uploaded size={item['size']} sha256={item['sha256']}"
              )
          item["repository_sha256"] = digest
          item["repository_size"] = len(data)
          dest.write_bytes(data)'''
          t2, n = re.subn(pattern, replacement, t, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'download guard replacement count={n}')
          p.write_text(t2, encoding='utf-8')
          PY

      - name: Integrate uploaded Palace Saloon pages
        run: python3 scripts/integrate_palace_saloon_uploaded_pages.py

      - name: Record uploaded-vs-repository binary provenance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          items = [
              {
                  'path': 'newspapers/oregon-city-courier/1907-05-24-page-5-palace-saloon-city-list.pdf',
                  'uploaded_sha': '6960e6963bfb3c11a00d32d80f8ab6c151f84632f09e83a152400404c4d1ba26',
                  'uploaded_bytes': 641615,
              },
              {
                  'path': 'newspapers/oregon-city-courier/1909-09-17-page-5-palace-saloon-ralph-o-smith-license.pdf',
                  'uploaded_sha': '4682715f6ac882a21893a9d3e0729f0f2eef5544bde41517977ee5e7cb0c077a',
                  'uploaded_bytes': 677536,
              },
              {
                  'path': 'newspapers/morning-enterprise/1912-06-20-page-2-palace-saloon-joseph-wilson-license.pdf',
                  'uploaded_sha': '72b3f8ddddfbd7703af82a1abfbea9353feb3e7a0c8a81055ce8c869fb858c9a',
                  'uploaded_bytes': 826263,
              },
          ]
          for item in items:
              data = Path(item['path']).read_bytes()
              item['repo_sha'] = hashlib.sha256(data).hexdigest()
              item['repo_bytes'] = len(data)

          capture = Path('evidence/source-captures/1907-1912-palace-saloon-uploaded-pages-visual-review-2026-09-01.md')
          text = capture.read_text(encoding='utf-8')
          text = text.replace(
              'Status: **THREE USER-SUPPLIED PRIMARY NEWSPAPER PAGES VISUALLY VERIFIED AND PRESERVED**.',
              'Status: **THREE USER-SUPPLIED PRIMARY NEWSPAPER PAGES VISUALLY VERIFIED; CANONICAL ARCHIVE PDF DERIVATIVES PRESERVED**.'
          )
          for item in items:
              old = f"SHA-256: `{item['uploaded_sha']}`."
              new = (f"Uploaded-file SHA-256: `{item['uploaded_sha']}` ({item['uploaded_bytes']} bytes). "
                     f"Repository canonical-archive derivative SHA-256: `{item['repo_sha']}` ({item['repo_bytes']} bytes).")
              text = text.replace(old, new)
          text += ('\n## Binary-preservation note\n\nThe project-steward uploads were the copies visually inspected. '
                   'The available GitHub integration transport cannot directly transfer conversation attachment bytes. '
                   'The repository therefore retains the same issue/page PDFs reacquired from the canonical Oregon Digital URLs. '
                   'Original uploaded filenames, byte counts and SHA-256 hashes are retained above, alongside the hashes of the repository derivatives. '
                   'A byte-level difference between PDF derivatives is not treated as a historical-content difference.\n')
          capture.write_text(text, encoding='utf-8')

          sr = Path('evidence/source-register.md')
          text = sr.read_text(encoding='utf-8')
          for item in items:
              text = text.replace(
                  f"SHA-256 `{item['uploaded_sha']}`.",
                  f"Uploaded SHA-256 `{item['uploaded_sha']}`; repository canonical derivative SHA-256 `{item['repo_sha']}` ({item['repo_bytes']} bytes)."
              )
          text = text.replace('from project-steward upload.', 'from project-steward upload; canonical archive PDF derivative retained in repository.')
          sr.write_text(text, encoding='utf-8')

          sy = Path('database/sources.yml')
          text = sy.read_text(encoding='utf-8')
          for item in items:
              text = text.replace(
                  f"SHA-256 {item['uploaded_sha']}.",
                  f"Uploaded SHA-256 {item['uploaded_sha']}; repository canonical derivative SHA-256 {item['repo_sha']} ({item['repo_bytes']} bytes)."
              )
          sy.write_text(text, encoding='utf-8')

          manifest_path = Path('evidence/source-captures/1907-1912-palace-saloon-uploaded-pages-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for rec, item in zip(manifest['files'], items):
              rec['uploaded_sha256'] = rec.pop('sha256')
              rec['uploaded_bytes'] = rec.pop('bytes')
              rec['repository_sha256'] = item['repo_sha']
              rec['repository_bytes'] = item['repo_bytes']
              rec['repository_binary_note'] = 'Canonical Oregon Digital PDF derivative of the same issue/page; uploaded attachment bytes retained by hash/provenance only.'
          manifest['binary_preservation'] = 'User-uploaded copies were visually inspected; repository binaries were reacquired from canonical Oregon Digital URLs because conversation attachment bytes cannot be directly transported into GitHub by the available connector.'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          ai = Path('ARCHIVE_INDEX.md')
          text = ai.read_text(encoding='utf-8').replace(
              'preserves all three supplied PDFs as `S-171`–`S-173` / `E-151`–`E-153`.',
              'preserves canonical Oregon Digital PDF derivatives of all three supplied pages as `S-171`–`S-173` / `E-151`–`E-153`; original uploaded filenames and hashes are retained in provenance.'
          )
          ai.write_text(text, encoding='utf-8')

          rl = Path('registers/research-log.md')
          text = rl.read_text(encoding='utf-8').replace(
              'Visually reviewed and preserved three project-steward supplied newspaper pages:',
              'Visually reviewed three project-steward supplied newspaper pages and preserved canonical archive PDF derivatives:'
          )
          rl.write_text(text, encoding='utf-8')
          PY

      - name: Validate archive after Palace integration
        run: python3 scripts/validate_archive.py

      - name: Commit and push directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/integrate-palace-saloon-uploaded-pages.yml
          rm -f scripts/integrate_palace_saloon_uploaded_pages.py
          git add -A
          git commit -m "Integrate Palace Saloon primary pages, 1907-1912"
          git pull --rebase origin main
          git push origin HEAD:main
