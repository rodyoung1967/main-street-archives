name: Fetch 1919 Enterprise Aug 1 page 7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-1919-08-01-enterprise-page7.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main
        run: git pull --rebase origin main

      - name: Install PDF renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils

      - name: Fetch and render original page
        shell: bash
        run: |
          set -euo pipefail
          url='https://oregonnews.uoregon.edu/lccn/sn00063700/1919-08-01/ed-1/seq-7.pdf'
          pdf='newspapers/oregon-city-enterprise/1919-08-01-page-7.pdf'
          png='/tmp/1919-08-01-page-7.png'
          mkdir -p "$(dirname "$pdf")"
          curl -fL --retry 3 --retry-delay 2 "$url" -o "$pdf"
          pdftoppm -png -singlefile -r 220 "$pdf" /tmp/1919-08-01-page-7
          sha256sum "$pdf" > newspapers/oregon-city-enterprise/1919-08-01-page-7.sha256
          test -s "$png"

      - name: Upload rendered page for visual review
        uses: actions/upload-artifact@v4
        with:
          name: 1919-08-01-enterprise-page7-render
          path: /tmp/1919-08-01-page-7.png
          if-no-files-found: error
          retention-days: 1

      - name: Validate archive
        run: python3 scripts/validate_archive.py

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fetch-1919-08-01-enterprise-page7.yml
          git add -A
          git commit -m "Preserve 1 Aug 1919 Enterprise page 7 for visual review"
          git pull --rebase origin main
          git push origin HEAD:main
