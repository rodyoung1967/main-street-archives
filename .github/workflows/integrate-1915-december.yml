name: Run 1915 December integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/integrate-1915-december.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate reviewed December scans
        run: python3 scripts/integrate_1915_december_review.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete 1915 Courier visual review through year end"
          git pull --rebase origin main
          git push origin HEAD:main
