name: Diagnose P-1043 CCHS object

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-p1043-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect exact CCHS P-1043 object and derivatives
        run: |
          python3 - <<'PY'
          import json, urllib.request, hashlib
          url='https://api.catalogit.app/api/public/accounts/4813/entries/f9806ec0-9b1e-11eb-b3ef-53e7205a00b4'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Main-Street-Archive/1.0'})
          with urllib.request.urlopen(req,timeout=90) as r: data=json.load(r)
          props=data.get('properties',{})
          print('account',data.get('account_id'),data.get('account_name'))
          print('slug',data.get('slug'))
          for k in ('hasName','hasCatalogNumber','hasDescription'):
              print(k, props.get(k,{}).get('value_text'))
          print('media')
          for i,m in enumerate(data.get('media',[])):
              print('media',i,'name=',m.get('name'),'desc=',m.get('description'))
              for key,val in m.get('derivatives',{}).items():
                  if isinstance(val,dict) and val.get('path'):
                      print(key,val.get('width'),val.get('height'),val.get('path'))
          found=[]
          for m in data.get('media',[]):
              for key,val in m.get('derivatives',{}).items():
                  if isinstance(val,dict) and val.get('path') and 'thumbnail' not in key.lower():
                      w=int(val.get('width') or 0); h=int(val.get('height') or 0)
                      if w and h: found.append((w*h,w,h,key,val['path']))
          found.sort(reverse=True)
          if found:
              _,w,h,key,path=found[0]
              req=urllib.request.Request(path,headers={'User-Agent':'Mozilla/5.0 Main-Street-Archive/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r: b=r.read()
              print('largest',key,w,h,len(b),hashlib.sha256(b).hexdigest())
          PY
