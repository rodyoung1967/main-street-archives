name: Integrate CCHS P-1032 1936-1939 bluff view

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_cchs_p1032_1936_1939_from_bluff.py'
      - 'scripts/repair_cchs_p1032_name_sync.py'
      - '.github/workflows/integrate-cchs-p1032-1936-1939-from-bluff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration dependencies
        run: pip install Pillow PyYAML
      - name: Integrate P-1032 photograph
        run: python3 scripts/integrate_cchs_p1032_1936_1939_from_bluff.py
      - name: Synchronize P-1032 names
        run: python3 scripts/repair_cchs_p1032_name_sync.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate CCHS P-1032 1936-1939 bluff view'
          git pull --rebase origin main
          python3 scripts/repair_cchs_p1032_name_sync.py
          python3 scripts/validate_archive.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
