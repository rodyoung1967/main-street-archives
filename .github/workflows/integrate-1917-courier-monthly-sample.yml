name: Integrate 1917 Courier monthly sample

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-1917-courier-monthly-sample.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest main
        run: git pull --rebase origin main

      - name: Validate before integration
        run: python3 scripts/validate_archive.py

      - name: Integrate visually reviewed sample
        run: python3 scripts/integrate_1917_courier_monthly_sample.py

      - name: Validate after integration
        run: python3 scripts/validate_archive.py

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "main-street-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add newspapers/oregon-city-courier/1917-first-issue-monthly-sample/manifest.json \
            evidence/source-captures/1917-courier-first-issue-monthly-sample.md \
            evidence/source-captures/1917-courier-review-start.md \
            evidence/source-captures/scripture-may-108-fifth-predecessor-lead.md \
            evidence/source-register.md evidence/evidence-register.md \
            database/sources.yml database/evidence.yml \
            media/photo-metadata-register.md \
            businesses/electric-store.md businesses/business-index.md database/businesses.yml \
            registers/address-register.md registers/year-status.md registers/research-log.md
          git commit -m "Integrate 1917 Courier monthly visual sample"
          git pull --rebase origin main
          git push origin HEAD:main
