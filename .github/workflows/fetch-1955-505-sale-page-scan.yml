name: Fetch 1955 505 sale page scan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-1955-505-sale-page-scan.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch original newspaper page image
        run: |
          set -euxo pipefail
          mkdir -p out
          python3 - <<'PY'
          import pathlib, urllib.request, re
          base='https://oregonnews.uoregon.edu/lccn/sn85042472/1955-11-20/ed-1/seq-30'
          ua={'User-Agent':'Mozilla/5.0 Main-Street-Archive/1.0'}
          candidates=[
            base+'.jp2',
            base+'.pdf',
            base+'/jp2/',
            base+'/pdf/',
            base+'/',
          ]
          for i,u in enumerate(candidates):
            print('\nTRY',u)
            try:
              req=urllib.request.Request(u,headers=ua)
              with urllib.request.urlopen(req,timeout=45) as r:
                data=r.read(); ct=r.headers.get('Content-Type',''); final=r.geturl()
              print('STATUS 200','TYPE',ct,'BYTES',len(data),'FINAL',final)
              ext='.bin'
              if data.startswith(b'%PDF'): ext='.pdf'
              elif data[:12].find(b'jP')>=0 or 'jp2' in ct.lower(): ext='.jp2'
              elif data.startswith(b'\xff\xd8'): ext='.jpg'
              elif 'html' in ct.lower(): ext='.html'
              p=pathlib.Path('out')/f'candidate-{i}{ext}'
              p.write_bytes(data)
              if ext=='.html':
                text=data.decode('utf-8','replace')
                for href in re.findall(r'href=["\']([^"\']+)["\']',text,re.I):
                  if any(x in href.lower() for x in ('jp2','pdf','clip','image')):
                    print('IMAGE_LINK',href)
            except Exception as e:
              print('ERROR',repr(e))
          PY
          ls -lah out
      - name: Upload scan candidates
        uses: actions/upload-artifact@v4
        with:
          name: 1955-11-20-register-guard-image-30
          path: out/
          if-no-files-found: error
