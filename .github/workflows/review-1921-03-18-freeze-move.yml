name: Review 1921-03-18 Freeze move page

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-1921-03-18-freeze-move.yml"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - name: Fetch and render original page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/freeze-move-review
          curl -fL --retry 3 -A 'main-street-archives archival review/1.0' \
            'https://oregonnews.uoregon.edu/lccn/sn00063700/1921-03-18/ed-1/seq-5.pdf' \
            -o /tmp/freeze-move-review/1921-03-18-page-5.pdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftoppm -f 1 -singlefile -png -r 180 /tmp/freeze-move-review/1921-03-18-page-5.pdf /tmp/freeze-move-review/1921-03-18-page-5
          sha256sum /tmp/freeze-move-review/* > /tmp/freeze-move-review/SHA256SUMS.txt
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1921-03-18-freeze-move-review
          path: /tmp/freeze-move-review
          retention-days: 7
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/review-1921-03-18-freeze-move.yml
          git add -A
          git commit -m "Complete temporary 1921 Freeze move scan fetch"
          git pull --rebase origin main
          git push origin HEAD:main
