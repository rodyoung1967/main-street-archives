name: Integrate 1891 CCHS Bank of Commerce exterior

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_1891_cchs_bank_of_commerce_exterior_512.py'
      - '.github/workflows/integrate-1891-cchs-bank-of-commerce-exterior-512.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow PyYAML
      - name: Integrate 1891 Bank of Commerce exterior
        run: python3 scripts/integrate_1891_cchs_bank_of_commerce_exterior_512.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate CCHS 1891 Bank of Commerce exterior'
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}"
            git fetch origin main
            git rebase origin/main
            python3 scripts/validate_archive.py
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'Failed to publish after 5 attempts.' >&2
          exit 1
