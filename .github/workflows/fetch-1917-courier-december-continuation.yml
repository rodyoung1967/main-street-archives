name: Fetch 1917 Courier December continuation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-1917-courier-december-continuation.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest main
        run: git pull --rebase origin main

      - name: Validate archive before retrieval
        run: python3 scripts/validate_archive.py

      - name: Download December Courier pages without stopping at interior gaps
        shell: bash
        run: |
          set -euo pipefail
          out="newspapers/oregon-city-courier/1917-december-continuation"
          mkdir -p "$out"
          rm -f "$out"/*.pdf "$out/sha256.txt" "$out/manifest.json"

          fetch_range() {
            d="$1"
            max="$2"
            hits=0
            for n in $(seq 1 "$max"); do
              nn=$(printf '%02d' "$n")
              f="$out/${d}-seq-${nn}.pdf"
              tmp="$f.tmp"
              url="https://oregonnews.uoregon.edu/lccn/sn00063698/${d}/ed-1/seq-${n}.pdf"
              if curl --silent --show-error --fail --location --retry 2 --retry-delay 1 \
                   --connect-timeout 20 --max-time 180 \
                   --user-agent "Mozilla/5.0 (main-street-archives research)" \
                   -o "$tmp" "$url"; then
                if [ "$(head -c 4 "$tmp")" = "%PDF" ]; then
                  mv "$tmp" "$f"
                  hits=$((hits+1))
                  continue
                fi
              fi
              rm -f "$tmp"
            done
            if [ "$hits" -lt 1 ]; then
              echo "No retrievable pages found for $d" >&2
              exit 1
            fi
            echo "$d hits=$hits probed=1-$max"
          }

          # Dec. 13 front page states this is a 24-page Christmas issue. Probe all
          # positions even though sequence 21 is a known archive misassociation.
          fetch_range 1917-12-13 24
          # Probe beyond the likely 8-page size for later issues rather than using
          # the first 404 as authoritative inventory evidence.
          fetch_range 1917-12-20 32
          fetch_range 1917-12-27 32

          : > "$out/sha256.txt"
          for f in "$out"/*.pdf; do sha256sum "$f" >> "$out/sha256.txt"; done

      - name: Write gap-aware retrieval manifest
        shell: python
        run: |
          import hashlib, json, pathlib, re
          from collections import defaultdict
          from datetime import datetime, timezone

          out = pathlib.Path("newspapers/oregon-city-courier/1917-december-continuation")
          grouped = defaultdict(list)
          rx = re.compile(r"(1917-12-\d\d)-seq-(\d\d)\.pdf$")
          for pdf in sorted(out.glob("*.pdf")):
              m = rx.match(pdf.name)
              if m:
                  grouped[m.group(1)].append((int(m.group(2)), pdf))

          expected_dates = {"1917-12-13", "1917-12-20", "1917-12-27"}
          if set(grouped) != expected_dates:
              raise SystemExit(f"Unexpected issue set: {sorted(grouped)}")

          issues=[]; items=[]
          for date in sorted(grouped):
              rows=sorted(grouped[date])
              seqs=[s for s,_ in rows]
              max_seq=max(seqs)
              missing=[s for s in range(1,max_seq+1) if s not in seqs]
              if date == "1917-12-13":
                  # The archive exposes all 24 positions, but sequence 21 is known
                  # from prior visual review to contain a Dec. 27 page. Preserve it
                  # as supplied and explicitly flag the content conflict.
                  if seqs != list(range(1,25)):
                      raise SystemExit(f"Dec. 13 expected archive positions 1-24, got {seqs}")
                  content_conflicts=[21]
                  expected_printed_pages=24
              else:
                  # Later issues must be contiguous through their highest hit.
                  if missing:
                      raise SystemExit(f"Interior retrieval gap for {date}: {missing}")
                  content_conflicts=[]
                  expected_printed_pages=None
              issues.append({
                  "date":date,
                  "retrieved_page_count":len(rows),
                  "highest_retrieved_sequence":max_seq,
                  "missing_sequences":missing,
                  "known_content_conflict_sequences":content_conflicts,
                  "expected_printed_pages":expected_printed_pages,
              })
              for seq,pdf in rows:
                  items.append({
                      "date":date,
                      "sequence":seq,
                      "file":pdf.name,
                      "source_url":f"https://oregonnews.uoregon.edu/lccn/sn00063698/{date}/ed-1/seq-{seq}.pdf",
                      "sha256":hashlib.sha256(pdf.read_bytes()).hexdigest(),
                      "review_status":"PENDING / PRIOR REVIEW MAY EXIST",
                      "note":("KNOWN CONTENT CONFLICT: prior visual review found a printed Dec. 27 header here; true Dec. 13 page 21 remains unrecovered" if date=="1917-12-13" and seq==21 else "")
                  })

          manifest={
              "title":"Oregon City Courier 1917 December continuation, gap-aware retrieval",
              "newspaper_lccn":"sn00063698",
              "retrieved_utc":datetime.now(timezone.utc).isoformat(),
              "issue_count":len(issues),
              "retrieved_file_count":len(items),
              "issues":issues,
              "items":items,
              "known_gap":"The Dec. 13 issue calls itself 24 pages. Archive sequence 21 has previously been visually shown to be a Dec. 27 page, so the true Dec. 13 page 21 remains a retrieval gap despite all 24 sequence URLs resolving.",
              "annual_completion_limit":"Actual page scans must control review. The Dec. 13 sequence-21 conflict must not be counted as a genuine Dec. 13 page."
          }
          (out/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps({"issues":issues,"retrieved_file_count":len(items)},indent=2))

      - name: Upload preserved PDFs
        uses: actions/upload-artifact@v4
        with:
          name: 1917-courier-december-continuation
          path: newspapers/oregon-city-courier/1917-december-continuation
          retention-days: 7

      - name: Commit preserved PDFs and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "main-street-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add newspapers/oregon-city-courier/1917-december-continuation
          git commit -m "Archive December 1917 Courier continuation"
          git pull --rebase origin main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
