name: Integrate 503-505 ownership follow-up

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-503-505-ownership-followup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-503-505-ownership-followup
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python3 -m pip install PyYAML
      - name: Lock to newest main at job start
        run: |
          git fetch origin main
          git reset --hard origin/main
          git rev-parse HEAD > /tmp/ownership_followup_base_sha
      - name: Correct integration helper guards and 505 anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate_503_505_2002_2010_ownership_followup.py')
          t = p.read_text(encoding='utf-8')

          # Fix over-escaped regex guards in the staged helper. The original
          # P-person expression can match the empty string because its pipes
          # become regex alternation; use literal Markdown pipes instead.
          t = t.replace('rf"^## {S252}\\\\b"', 'rf"^## {S252}\\b"')
          t = t.replace('rf"^## {S253}\\\\b"', 'rf"^## {S253}\\b"')
          t = t.replace('rf"^## {S254}\\\\b"', 'rf"^## {S254}\\b"')
          t = t.replace('rf"^## {E226}\\\\b"', 'rf"^## {E226}\\b"')
          t = t.replace('rf"^## {E227}\\\\b"', 'rf"^## {E227}\\b"')
          t = t.replace('rf"^## {E228}\\\\b"', 'rf"^## {E228}\\b"')
          t = t.replace('rf"^\\\\| {P107} \\\\|"', 'rf"^\\| {P107} \\|"')

          old = '''replace_once("timelines/505-main.md",
              "| 2017 | Thirsty Duck reopening / permits / Wiitanen owner line. |",
              "| Tax year 2010 | Public-record-derived assessment page names **Richard M. Wiitanen & Sheila J. Wiitanen** on the 505 land/building entry and separately **505 Tavern** at 505. | **Strong secondary ownership snapshot**; original County roll/deed still pending. | `P-007`, `P-008`; `E-227`; `S-253` |\\n| 2017 | Thirsty Duck reopening / permits / Wiitanen owner line. |")'''
          new = '''replace_once("timelines/505-main.md",
              "| 2017 | Scott Forvilly purchases/reopens as **Thirsty Duck**; permit lists Richard Wiitanen as co-trustee/real-estate owner. | Business and property roles separate. | `BUS-005`, `BUS-006`; `P-007`, `P-012`, `P-013`; `E-008`, `E-035`; `S-004`, `S-043` |",
              "| Tax year 2010 | Public-record-derived assessment page names **Richard M. Wiitanen & Sheila J. Wiitanen** on the 505 land/building entry and separately **505 Tavern** at 505. | **Strong secondary ownership snapshot**; original County roll/deed still pending. | `P-007`, `P-008`; `E-227`; `S-253` |\\n| 2017 | Scott Forvilly purchases/reopens as **Thirsty Duck**; permit lists Richard Wiitanen as co-trustee/real-estate owner. | Business and property roles separate. | `BUS-005`, `BUS-006`; `P-007`, `P-012`, `P-013`; `E-008`, `E-035`; `S-004`, `S-043` |")'''
          if old not in t and new not in t:
              raise SystemExit('Expected 505 timeline helper anchor not found')
          if old in t:
              t = t.replace(old, new, 1)

          p.write_text(t, encoding='utf-8')
          PY
      - name: Apply ownership follow-up integration
        run: python3 scripts/integrate_503_505_2002_2010_ownership_followup.py
      - name: Validate synchronized archive
        run: python3 scripts/validate_archive.py
      - name: Publish without overwriting concurrent main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -f scripts/integrate_503_505_2002_2010_ownership_followup.py
          rm -f .github/workflows/integrate-503-505-ownership-followup.yml
          git add -A

          if git diff --cached --quiet; then
            echo 'No persistent ownership-followup changes required.'
            exit 0
          fi

          git commit -m 'Integrate 503-505 2002-2010 ownership follow-up'

          base_sha="$(cat /tmp/ownership_followup_base_sha)"
          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$base_sha" ]; then
            echo "Remote main advanced from $base_sha to $remote_sha; refusing to overwrite concurrent work." >&2
            exit 1
          fi

          git push origin HEAD:main
