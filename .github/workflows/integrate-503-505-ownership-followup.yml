name: Integrate 503-505 ownership follow-up

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-503-505-ownership-followup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-503-505-ownership-followup
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python3 -m pip install PyYAML
      - name: Lock to newest main at job start
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Prepare race-safe ownership integration helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('scripts/integrate_503_505_2002_2010_ownership_followup.py')
          t = p.read_text(encoding='utf-8')

          old = '''replace_once("timelines/505-main.md",
              "| 2017 | Thirsty Duck reopening / permits / Wiitanen owner line. |",
              "| Tax year 2010 | Public-record-derived assessment page names **Richard M. Wiitanen & Sheila J. Wiitanen** on the 505 land/building entry and separately **505 Tavern** at 505. | **Strong secondary ownership snapshot**; original County roll/deed still pending. | `P-007`, `P-008`; `E-227`; `S-253` |\\n| 2017 | Thirsty Duck reopening / permits / Wiitanen owner line. |")'''
          new = '''replace_once("timelines/505-main.md",
              "| 2017 | Scott Forvilly purchases/reopens as **Thirsty Duck**; permit lists Richard Wiitanen as co-trustee/real-estate owner. | Business and property roles separate. | `BUS-005`, `BUS-006`; `P-007`, `P-012`, `P-013`; `E-008`, `E-035`; `S-004`, `S-043` |",
              "| Tax year 2010 | Public-record-derived assessment page names **Richard M. Wiitanen & Sheila J. Wiitanen** on the 505 land/building entry and separately **505 Tavern** at 505. | **Strong secondary ownership snapshot**; original County roll/deed still pending. | `P-007`, `P-008`; `E-227`; `S-253` |\\n| 2017 | Scott Forvilly purchases/reopens as **Thirsty Duck**; permit lists Richard Wiitanen as co-trustee/real-estate owner. | Business and property roles separate. | `BUS-005`, `BUS-006`; `P-007`, `P-012`, `P-013`; `E-008`, `E-035`; `S-004`, `S-043` |")'''
          if old in t:
              t = t.replace(old, new, 1)
          elif new not in t:
              raise SystemExit('Expected 505 timeline helper anchor not found')

          source_text = Path('evidence/source-register.md').read_text(encoding='utf-8')
          evidence_text = Path('evidence/evidence-register.md').read_text(encoding='utf-8')
          people_text = Path('people/people-index.md').read_text(encoding='utf-8')
          source_nums = [int(x) for x in re.findall(r'(?m)^## S-(\d{3})\b', source_text)]
          evidence_nums = [int(x) for x in re.findall(r'(?m)^## E-(\d{3})\b', evidence_text)]
          person_nums = [int(x) for x in re.findall(r'(?m)^\| P-(\d{3}) \|', people_text)]
          if not source_nums or not evidence_nums or not person_nums:
              raise SystemExit('Could not determine current ID maxima from authoritative registers')

          new_s = [f'S-{n:03d}' for n in range(max(source_nums)+1, max(source_nums)+4)]
          new_e = [f'E-{n:03d}' for n in range(max(evidence_nums)+1, max(evidence_nums)+4)]
          new_p = f'P-{max(person_nums)+1:03d}'
          mapping = {
              'S-252': new_s[0], 'S-253': new_s[1], 'S-254': new_s[2],
              'E-226': new_e[0], 'E-227': new_e[1], 'E-228': new_e[2],
              'P-107': new_p,
          }
          placeholders = {old_id: f'__OWNERSHIP_ID_{i}__' for i, old_id in enumerate(mapping)}
          for old_id, ph in placeholders.items():
              t = t.replace(old_id, ph)
          for old_id, ph in placeholders.items():
              t = t.replace(ph, mapping[old_id])

          t = t.replace('rf"^## {S252}\\\\b"', 'rf"^## {S252}\\b"')
          t = t.replace('rf"^## {S253}\\\\b"', 'rf"^## {S253}\\b"')
          t = t.replace('rf"^## {S254}\\\\b"', 'rf"^## {S254}\\b"')
          t = t.replace('rf"^## {E226}\\\\b"', 'rf"^## {E226}\\b"')
          t = t.replace('rf"^## {E227}\\\\b"', 'rf"^## {E227}\\b"')
          t = t.replace('rf"^## {E228}\\\\b"', 'rf"^## {E228}\\b"')
          t = t.replace('rf"^\\\\| {P107} \\\\|"', 'rf"^\\| {P107} \\|"')

          p.write_text(t, encoding='utf-8')
          print('Allocated sources:', ', '.join(new_s))
          print('Allocated evidence:', ', '.join(new_e))
          print('Allocated person:', new_p)
          PY
      - name: Apply ownership follow-up integration
        run: python3 scripts/integrate_503_505_2002_2010_ownership_followup.py
      - name: Validate synchronized archive
        run: python3 scripts/validate_archive.py
      - name: Publish while preserving concurrent main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -f scripts/integrate_503_505_2002_2010_ownership_followup.py
          rm -f .github/workflows/integrate-503-505-ownership-followup.yml
          git add -A

          if git diff --cached --quiet; then
            echo 'No persistent ownership-followup changes required.'
            exit 0
          fi

          git commit -m 'Integrate 503-505 2002-2010 ownership follow-up'

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt"
            git fetch origin main
            if ! git rebase origin/main; then
              echo 'Concurrent main conflicts with ownership follow-up; aborting rather than overwriting.' >&2
              git rebase --abort || true
              exit 1
            fi
            python3 scripts/validate_archive.py
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo 'Main continued advancing through three safe publish attempts; no overwrite attempted.' >&2
          exit 1
