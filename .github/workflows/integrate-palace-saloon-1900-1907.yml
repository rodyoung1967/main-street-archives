name: Integrate Palace Saloon 1900-1907 pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-palace-saloon-1900-1907.yml"
      - "scripts/integrate_palace_saloon_1900_1907.py"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py

      - name: Preserve canonical newspaper page PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p newspapers/oregon-city-courier-herald newspapers/oregon-city-courier newspapers/oregon-city-enterprise
          curl --fail --location --retry 4 --retry-delay 2 --user-agent 'main-street-archives-research/1.0' \
            'https://oregonnews.uoregon.edu/lccn/sn00063697/1900-04-06/ed-1/seq-5.pdf' \
            -o 'newspapers/oregon-city-courier-herald/1900-04-06-page-5-palace-saloon-albert-knapp-purchase.pdf'
          curl --fail --location --retry 4 --retry-delay 2 --user-agent 'main-street-archives-research/1.0' \
            'https://oregonnews.uoregon.edu/lccn/sn00063698/1905-02-24/ed-1/seq-5.pdf' \
            -o 'newspapers/oregon-city-courier/1905-02-24-page-5-palace-saloon-knapp-surber-sale.pdf'
          curl --fail --location --retry 4 --retry-delay 2 --user-agent 'main-street-archives-research/1.0' \
            'https://oregonnews.uoregon.edu/lccn/sn00063700/1907-07-19/ed-1/seq-1.pdf' \
            -o 'newspapers/oregon-city-enterprise/1907-07-19-page-1-palace-saloon-fifth-street.pdf'
          file newspapers/oregon-city-courier-herald/1900-04-06-page-5-palace-saloon-albert-knapp-purchase.pdf
          file newspapers/oregon-city-courier/1905-02-24-page-5-palace-saloon-knapp-surber-sale.pdf
          file newspapers/oregon-city-enterprise/1907-07-19-page-1-palace-saloon-fifth-street.pdf
          sha256sum \
            newspapers/oregon-city-courier-herald/1900-04-06-page-5-palace-saloon-albert-knapp-purchase.pdf \
            newspapers/oregon-city-courier/1905-02-24-page-5-palace-saloon-knapp-surber-sale.pdf \
            newspapers/oregon-city-enterprise/1907-07-19-page-1-palace-saloon-fifth-street.pdf

      - name: Harden integration anchors for current YAML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate_palace_saloon_1900_1907.py')
          text = p.read_text(encoding='utf-8')
          old_func = '''def replace_once(path, old, new):
              text = read(path)
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f"Anchor not found in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))'''
          new_func = '''def replace_once(path, old, new):
              text = read(path)
              if new in text:
                  return
              if old in text:
                  write(path, text.replace(old, new, 1))
                  return
              import re
              indent = old[:len(old) - len(old.lstrip())]
              core = old.lstrip()
              pattern = re.escape(indent) + r"\\s+".join(re.escape(part) for part in core.split())
              updated, count = re.subn(pattern, lambda _m: new, text, count=1)
              if count != 1:
                  raise RuntimeError(f"Anchor not found in {path}: {old[:120]!r}")
              write(path, updated)'''
          if old_func not in text:
              raise SystemExit('replace_once function anchor not found')
          text = text.replace(old_func, new_func, 1)
          stale = "    notes: The Palace Saloon trade name is listed citywide by May 1907 without address/operator. Ralph O. Smith is a September 1909 applicant at the Palace Saloon, corner Main/Fifth; Joe Wilson is exact 501 in March 1912 and Joseph Wilson is Fifth/Main in June 1912. No grant, property title or uninterrupted succession proved."
          current = "    notes: The Palace Saloon trade name is listed citywide by May 1907 without address/operator. Ralph O. Smith is a September 1909 applicant at the Palace Saloon, corner Main/Fifth. Joe Wilson is exact at 501 in March 1912; a June 1912 notice prints Joseph Wilson at the Palace, Fifth/Main. Joe/Joseph identity is a strong inference, not explicit name-equivalence proof. No license grant, property ownership, Surber/Case/Hunsaker succession or uninterrupted 1907-1913 continuity is assumed."
          if stale not in text:
              raise SystemExit('BUS-024 stale anchor not found in integration script')
          p.write_text(text.replace(stale, current, 1), encoding='utf-8')
          PY

      - name: Integrate source and evidence records
        run: python3 scripts/integrate_palace_saloon_1900_1907.py

      - name: Add canonical relationship links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch_block(path, start, end, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              a = text.index(start)
              b = text.find(end, a + len(start)) if end else len(text)
              if b < 0:
                  b = len(text)
              block = text[a:b]
              for old, new in replacements:
                  if new in block:
                      continue
                  if old not in block:
                      raise SystemExit(f'anchor not found in {path} block {start!r}: {old!r}')
                  block = block.replace(old, new, 1)
              p.write_text(text[:a] + block + text[b:], encoding='utf-8')

          patch_block('database/businesses.yml', '  - id: BUS-024\n', '  - id: BUS-025\n', [
              ('    related_people:\n      - P-037\n      - P-098\n', '    related_people:\n      - P-037\n      - P-055\n      - P-098\n      - P-099\n'),
              ('      - E-153\n', '      - E-153\n      - E-154\n      - E-155\n      - E-156\n'),
              ('      - S-173\n', '      - S-173\n      - S-174\n      - S-175\n      - S-176\n'),
          ])
          patch_block('database/people.yml', '  - id: P-055\n', '  - id: P-056\n', [
              ('    related_businesses:\n    - BUS-045\n', '    related_businesses:\n    - BUS-024\n    - BUS-045\n'),
          ])
          PY

      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py

      - name: Commit and push directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/integrate-palace-saloon-1900-1907.yml
          rm -f scripts/integrate_palace_saloon_1900_1907.py
          git add -A
          git commit -m "Integrate Palace Saloon primary pages, 1900-1907"
          git pull --rebase origin main
          git push origin HEAD:main
