name: Probe Wheel 1967 records routes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-wheel-1967-webdrawer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current Oregon Records Management search form
        run: |
          set -euxo pipefail
          mkdir -p /tmp/wheel-1967
          curl -L --fail --retry 2 'https://records.sos.state.or.us/ORSOSCMSearch/Search/SearchMain.aspx' -o /tmp/wheel-1967/search-main.html
          curl -sSIL 'https://records.sos.state.or.us/ORSOSCMSearch/Search/SearchMain.aspx' -o /tmp/wheel-1967/search-main-headers.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-1967-record-route-probe
          path: /tmp/wheel-1967/
          retention-days: 1
