name: Integrate 505 SHPO 30539 visual review

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_505_shpo_30539_visual_review.py'
      - 'scripts/run_505_shpo_30539_visual_review.py'
      - '.github/workflows/integrate-505-shpo-30539-visual-review.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-505-shpo-30539-visual-review
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize latest main
        run: git pull --rebase origin main
      - name: Install validator dependency
        run: pip install PyYAML
      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py
      - name: Integrate 505 SHPO visual-review findings
        run: python3 scripts/run_505_shpo_30539_visual_review.py
      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py
      - name: Commit synchronized integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate 505 SHPO 30539 visual review'
          git pull --rebase origin main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
