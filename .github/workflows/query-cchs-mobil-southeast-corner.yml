name: Query CCHS Mobil southeast-corner scene

on:
  push:
    branches: [main]
    paths:
      - 'scripts/query_cchs_mobil_southeast_corner.py'
      - '.github/workflows/query-cchs-mobil-southeast-corner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query CCHS public catalog
        run: python3 scripts/query_cchs_mobil_southeast_corner.py
