name: Fetch 1919 cleaner repeat pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-1919-cleaner-repeat-pages.yml"

permissions:
  contents: write

env:
  OUTDIR: newspapers/oregon-city-enterprise/1919-cleaner-repeat-pages

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main
        run: git pull --rebase origin main

      - name: Install PDF renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils

      - name: Fetch and render repeat pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTDIR" /tmp/cleaner-repeat-renders
          for date in 1919-07-18 1919-07-25 1919-08-08 1919-08-15 1919-08-22 1919-08-29 1919-09-05; do
            pdf="$OUTDIR/${date}-page-7.pdf"
            url="https://oregonnews.uoregon.edu/lccn/sn00063700/${date}/ed-1/seq-7.pdf"
            curl -fL --retry 3 --retry-delay 2 "$url" -o "$pdf"
            pdftoppm -png -singlefile -r 220 "$pdf" "/tmp/cleaner-repeat-renders/${date}-page-7"
          done
          sha256sum "$OUTDIR"/*.pdf > "$OUTDIR/SHA256SUMS.txt"

      - name: Upload rendered pages for visual review
        uses: actions/upload-artifact@v4
        with:
          name: 1919-cleaner-repeat-renders
          path: /tmp/cleaner-repeat-renders/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Validate archive
        run: python3 scripts/validate_archive.py

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fetch-1919-cleaner-repeat-pages.yml
          git add -A
          git commit -m "Preserve 1919 cleaner repeat pages for visual review"
          git pull --rebase origin main
          git push origin HEAD:main
