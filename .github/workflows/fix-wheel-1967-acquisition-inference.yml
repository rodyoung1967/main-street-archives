name: Fix Wheel 1967 acquisition inference

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-wheel-1967-acquisition-inference.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Correct unsupported 1967 acquisition inference
        shell: python
        run: |
          from pathlib import Path

          marker = 'wheel-1967-acquisition-inference-audit-2026-09-07'

          timeline = Path('registers/business-timeline.md')
          text = timeline.read_text()
          old = '| By Jun. 1967 | The Wheel | `BUS-004` | `E-025`, `E-022` | Very High address; high family purchase | Raye LaFarlette / Raye Grisham is the same person and bought The Wheel at 503. The surname change is not a business transfer. |'
          new = '\n'.join([
              '| Before 7 Jun. 1967; exact preceding-meeting date unresolved | The Wheel | `BUS-004` | `E-025` | Very High for address/action; applicant/type unresolved | Commission authorizes the mayor to sign a liquor application for **the Wheel at 503 Main**. Applicant/licensee and application type are not stated; this action does **not** date a LaFarlette acquisition. |',
              '| Date unresolved | Raye LaFarlette / Raye Grisham ownership of The Wheel | `BUS-004` | `E-022` | High family / project-steward evidence | Family evidence establishes that Raye bought The Wheel at 503. Exact acquisition date, seller, licensee form, and transaction mechanism remain unresolved; do **not** anchor this ownership fact to the 1967 liquor action without a direct bridge. |'
          ])
          if old not in text:
              raise SystemExit('Expected stale business-timeline row not found; refusing to overwrite newer work')
          timeline.write_text(text.replace(old, new, 1))

          db = Path('database/businesses.yml')
          text = db.read_text()
          old = 'June 7 1967 Commission minutes place the Wheel at 503 Main Street.'
          new = 'A Commission liquor action for the Wheel at 503 Main appears in the meeting section immediately before the printed 7 June 1967 heading; exact preceding-meeting date, applicant/licensee, and application type remain unresolved and the action must not be used to date Raye\'s acquisition.'
          if old not in text:
              raise SystemExit('Expected stale database/businesses.yml sentence not found; refusing to overwrite newer work')
          db.write_text(text.replace(old, new, 1))

          capture = Path('evidence/source-captures/1967-wheel-acquisition-inference-audit-2026-09-07.md')
          if capture.exists():
              raise SystemExit('Inference-audit capture already exists; refusing duplicate write')
          capture.write_text('''# The Wheel — 1967 acquisition-date inference audit\n\nResearch date: **7 September 2026**  \nBusiness: **The Wheel (`BUS-004`) — 503 Main Street only**  \nStatus: **ARCHIVAL LOGIC CORRECTION — NO NEW OWNER OR TRANSFER DATE ESTABLISHED**\n\n## Why this audit was needed\n\nA canonical `registers/business-timeline.md` row still combined `E-025` (the unnamed 1967 municipal liquor action) with `E-022` (family evidence that Raye later bought The Wheel) under the period label **By Jun. 1967**. Read together, that row could imply that Raye's purchase was established by June 1967. The evidence does not support that inference.\n\n## Separate propositions\n\n### `E-025` — municipal licensing action\n\nOfficial Oregon City Commission searchable text establishes a liquor-application action for **the Wheel at 503 Main** in the meeting section immediately before the printed **7 June 1967** heading. The exact preceding-meeting date remains unresolved. The surviving text does not name the applicant/licensee or application category.\n\nThis establishes a dated **Wheel licensing action and exact premises**, not Raye/Floyd ownership or a purchase.\n\n### `E-022` — family ownership chronology\n\nProject-steward/family evidence establishes that **Raye LaFarlette / Raye Grisham bought The Wheel business at 503 Main**. It does not supply a documentary purchase date or identify the seller.\n\nThis establishes the family ownership sequence, not a June 1967 date.\n\n## May 1965 southwest-Oregon control is also not a legal boundary\n\nIndexed/OCR *Myrtle Point Herald* material describes Floyd LaFarlette as a Myrtle Hotel **operator** on **6 May 1965**. That source remains OCR/TEXT ONLY pending visual page review. Even if its wording is confirmed, operation of a Myrtle Point business does not by itself exclude simultaneous investment, licensing, travel, or business activity elsewhere. Therefore **6 May 1965 is not a proved terminus post quem for acquiring The Wheel**.\n\nLikewise, the unnamed pre-7-June-1967 Wheel liquor action is not a proved terminus ante quem for a LaFarlette acquisition because no LaFarlette applicant is identified.\n\n## Correct evidence state\n\nThe safe current statement is:\n\n> Floyd LaFarlette is indexed as a Myrtle Hotel operator in May 1965. A later 1967 municipal record documents an unnamed liquor-application action for The Wheel at 503 Main. Family history establishes that Raye bought The Wheel, but no recovered contemporary source yet connects a LaFarlette name directly to The Wheel or dates that purchase.\n\nThus **c.1967 remains a research hypothesis / priority interval, not a closed acquisition bracket**.\n\n## Repository correction\n\nThis audit separates the two propositions in `registers/business-timeline.md` and corrects stale exact-7-June wording in `database/businesses.yml`. It creates no new `S-###`, `E-###`, `P-###`, `BUS-###`, or `IMG-####` ID because no new historical event or source was established.\n\nHighest-value next evidence remains the named applicant/application type in the 1967 OLCC/City packet and the year-by-year 1965–69 Oregon City directory pages.\n''')

          log = Path('registers/research-log.md')
          text = log.read_text()
          if marker not in text:
              text += f'''\n\n## 7 September 2026 — Wheel 1967 acquisition-inference audit\n<!-- {marker} -->\n\n- Audited the 503 business timeline after the 1965–67 LaFarlette continuation.\n- Corrected an over-strong row that combined `E-025` and `E-022` under **By Jun. 1967**; the municipal liquor action and family purchase fact are now separate propositions.\n- Explicitly recorded that the **6 May 1965** Myrtle Hotel operator control is not a legal earliest-purchase boundary and the unnamed pre-7-Jun-1967 Wheel action is not a latest-purchase boundary.\n- No new owner, seller, licensee, transaction date, or sequential ID was created. Continued priority: named 1967 applicant/application type and 1965–69 directories.\n'''
              log.write_text(text)

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate archive
        run: python3 scripts/validate_archive.py

      - name: Commit correction
        run: |
          git config user.name 'rodyoung1967'
          git config user.email '49879113+rodyoung1967@users.noreply.github.com'
          git add registers/business-timeline.md database/businesses.yml registers/research-log.md evidence/source-captures/1967-wheel-acquisition-inference-audit-2026-09-07.md
          git diff --cached --quiet && exit 0
          git commit -m 'Separate 1967 Wheel liquor action from Raye acquisition'
          git pull --rebase origin main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
