name: Integrate CCHS 2008.008.005.003 1896 Fifth-Main NE

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_cchs_2008_008_005_003_1896_5th_main_ne.py'
      - '.github/workflows/integrate-cchs-2008-008-005-003-1896-5th-main-ne.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pillow pyyaml
      - name: Integrate 1896 Fifth-Main photograph
        run: python3 scripts/integrate_cchs_2008_008_005_003_1896_5th_main_ne.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit integration
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CCHS 1896 Fifth-Main sign photo'
          git pull --rebase origin main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
