name: Integrate 1895 CCHS Welcome Arch photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-1895-cchs-welcome-arch.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync current main
        run: |
          git fetch origin main
          git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install integration dependencies
        run: python3 -m pip install --quiet pyyaml pillow

      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py

      - name: Retrieve exact CCHS object and integrate photo
        run: python3 scripts/integrate_1895_cchs_welcome_arch.py

      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py

      - name: Commit, rebase onto newest main, validate, and push
        run: |
          git config user.name 'main-street-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'Add CCHS 1895 Welcome Arch target-frontage photo'
          git fetch origin main
          git rebase origin/main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
