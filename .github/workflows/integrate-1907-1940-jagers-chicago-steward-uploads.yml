name: Integrate 1907-1940 JAGERS and Chicago steward uploads

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-1907-1940-jagers-chicago-steward-uploads.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --quiet pyyaml
      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py
      - name: Fix integration serializer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate_1907_1940_steward_uploads.py')
          text = p.read_text(encoding='utf-8')
          old = 'write(path, text.rstrip() + "\\n\\n" + block.strip() + "\\n")'
          new = 'write(path, text.rstrip() + "\\n\\n" + block.rstrip() + "\\n")'
          if old not in text:
              if new in text:
                  print('Serializer already fixed.')
              else:
                  raise SystemExit('Expected serializer line not found; refusing to patch blindly.')
          else:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Serializer fixed.')
          PY
      - name: Reconcile PDFs and integrate historical records
        run: python3 scripts/integrate_1907_1940_steward_uploads.py
      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py
      - name: Commit and push directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
          else
            git commit -m 'Integrate JAGERS and Chicago Store primary pages, 1913-1940'
            git push origin main
          fi
