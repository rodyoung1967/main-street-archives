name: Integrate 1907-1940 JAGERS and Chicago steward uploads

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-1907-1940-jagers-chicago-steward-uploads.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --quiet pyyaml
      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py
      - name: Fix integration serializer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate_1907_1940_steward_uploads.py')
          text = p.read_text(encoding='utf-8')
          old = 'write(path, text.rstrip() + "\\n\\n" + block.strip() + "\\n")'
          new = 'write(path, text.rstrip() + "\\n\\n" + block.rstrip() + "\\n")'
          if old not in text:
              if new in text:
                  print('Serializer already fixed.')
              else:
                  raise SystemExit('Expected serializer line not found; refusing to patch blindly.')
          else:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Serializer fixed.')
          PY
      - name: Reconcile PDFs and integrate historical records
        run: |
          if python3 - <<'PY'
          from pathlib import Path
          import sys

          # A rerun is safe only when the immutable IDs are the exact records
          # created by this integration and the end-of-run audit marker exists.
          # If any check is missing, run the integrator normally so its collision
          # guards still fail hard on partial or genuinely conflicting states.
          checks = [
              (
                  'evidence/source-register.md',
                  '## S-192 — Oregon City Courier, 25 December 1913, Chicago Store fire and George Harding building-owner statement',
              ),
              (
                  'evidence/source-register.md',
                  '## S-193 — The Amplifier, 18 October 1940, JAGERS at 503 Main',
              ),
              (
                  'evidence/evidence-register.md',
                  '## E-171 — Chicago Store fire and George Harding building ownership, December 1913',
              ),
              (
                  'evidence/evidence-register.md',
                  '## E-172 — JAGERS advertised at 503 Main, 18 October 1940',
              ),
              (
                  'businesses/business-index.md',
                  '| BUS-084 | [JAGERS](jagers.md) | 503 Main |',
              ),
              ('database/timeline.yml', '  - id: T-063\n'),
              ('database/timeline.yml', '  - id: T-064\n'),
              (
                  'evidence/source-captures/1907-1940-steward-upload-reconciliation-2026-09-02.md',
                  '# 1907–1940 steward-upload reconciliation: Justin & Hitchman, Chicago Store fire, Fifth/Main fire, and JAGERS',
              ),
              (
                  'registers/research-log.md',
                  '### 2026-09-02 — Reconcile Justin/Hitchman, 1913 Chicago fire, 1922 fire, and 1940 JAGERS uploads',
              ),
          ]

          missing = []
          for path, marker in checks:
              p = Path(path)
              if not p.exists() or marker not in p.read_text(encoding='utf-8'):
                  missing.append(f'{path}: {marker}')

          if missing:
              print('Completed integration markers are not all present; running integrator.')
              for item in missing:
                  print(f'  missing: {item}')
              sys.exit(1)

          print('Integration is already complete with the expected immutable IDs; rerun is a successful no-op.')
          PY
          then
            :
          else
            python3 scripts/integrate_1907_1940_steward_uploads.py
          fi
      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py
      - name: Commit and push directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
          else
            git commit -m 'Integrate JAGERS and Chicago Store primary pages, 1913-1940'
            git push origin main
          fi
