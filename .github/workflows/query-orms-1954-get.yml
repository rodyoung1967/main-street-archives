name: Probe ORMS archived 1954 GET

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/query-orms-1954-get.yml'

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query archived Oregon City search bookmarks
        run: |
          python3 - <<'PY'
          import html, re, urllib.parse, urllib.request
          base='https://ormswd.synergydcs.com/ORMSCMSearch/search/SearchMain.aspx'
          common={'arch':'1','code':'023','op1':'AND','page':'1','size':'100'}
          tests=[
            {'t1':'meetingDate','q1':'01/01/1954 to 05/31/1954'},
            {'t1':'title','q1':'1954'},
            {'t1':'TypedTitle','q1':'1954'},
            {'t1':'anyWord','q1':'1954'},
          ]
          def clean(s):
            s=re.sub(r'<script.*?</script>',' ',s,flags=re.I|re.S)
            s=re.sub(r'<style.*?</style>',' ',s,flags=re.I|re.S)
            s=re.sub(r'<[^>]+>',' ',s)
            return ' '.join(html.unescape(s).split())
          for extra in tests:
            p=dict(common); p.update(extra)
            u=base+'?'+urllib.parse.urlencode(p)
            print('\nURL',u)
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 Main-Street-Archive/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r:
                raw=r.read().decode('utf-8','replace')
                print('STATUS',r.status,'FINAL',r.geturl(),'BYTES',len(raw))
            except Exception as e:
              print('ERROR',repr(e)); continue
            print('VISIBLE',clean(raw)[:25000])
            for href,inner in re.findall(r'<a[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',raw,re.I|re.S):
              t=clean(inner)
              if 'record' in href.lower() or '1954' in t:
                print('LINK',href,'|',t)
          PY
