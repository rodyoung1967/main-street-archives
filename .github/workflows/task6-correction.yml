name: Apply Task 6 cadastral correction

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  correct:
    if: github.event.head_commit.message == 'Add Task 6 correction runner'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply correction
        run: python scripts/task6_correct_block_mapping.py

      - name: Commit corrected project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Correct Block 4 and Block 26 target mapping"
          git push
