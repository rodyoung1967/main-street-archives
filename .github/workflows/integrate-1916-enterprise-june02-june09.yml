name: Integrate 1916 Enterprise June 2 and June 9
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-1916-enterprise-june02-june09.yml'
      - 'scripts/maintenance/integrate_1916_enterprise_june02_june09.py'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Validate full archive before integration
        run: python3 scripts/validate_archive.py
      - name: Integrate reviewed issues
        run: python3 scripts/maintenance/integrate_1916_enterprise_june02_june09.py
      - name: Validate full archive after integration
        run: python3 scripts/validate_archive.py
      - name: Commit and push
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add evidence/source-register.md evidence/evidence-register.md database/sources.yml database/evidence.yml registers/year-status.md evidence/source-captures/1916-online-audit-checkpoint.md
          if git diff --cached --quiet; then echo 'No integration changes'; exit 0; fi
          git commit -m 'Certify June 2 and June 9 1916 Enterprise reviews'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
