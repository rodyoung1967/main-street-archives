name: Integrate 1890 CCHS Bank of Commerce 512 Main photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-1890-cchs-bank-of-commerce-512.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync current main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration dependencies
        run: python -m pip install --quiet pyyaml pillow
      - name: Validate archive before integration
        run: python3 scripts/validate_archive.py
      - name: Retrieve exact CCHS object and integrate photo
        run: python3 scripts/integrate_1890_cchs_bank_of_commerce_512.py
      - name: Keep source mirror name identical to Markdown register
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('database/sources.yml')
          text = p.read_text(encoding='utf-8')
          old = 'name: "Clackamas County Historical Society 2008.008.049.056, Interior of the Oregon City Bank of Commerce, 512 Main, cataloged 1890"'
          new = 'name: "Clackamas County Historical Society 2008.008.049.056, Interior of the Oregon City Bank of Commerce"'
          if old not in text:
              raise SystemExit('Expected S-212 source-name text not found after integration.')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate archive after integration
        run: python3 scripts/validate_archive.py
      - name: Commit and push directly to main
        run: |
          git config user.name 'main-street-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
          else
            git commit -m 'Add CCHS 1890 Bank of Commerce 512 Main interior'
            git push origin main
          fi
