name: Render 1921 Feb25-Mar11 Enterprise
on:
  push:
    paths:
      - '.github/workflows/render-1921-feb25-mar11-enterprise.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Fetch and render pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rendered
          for date in 1921-02-25 1921-03-04 1921-03-11; do
            mkdir -p "rendered/$date"
            for seq in $(seq 1 8); do
              url="https://oregonnews.uoregon.edu/lccn/sn00063700/$date/ed-1/seq-$seq.jp2"
              curl -fL --retry 3 "$url" -o "/tmp/$date-$seq.jp2"
              convert "/tmp/$date-$seq.jp2" -resize '2200x2200>' -quality 90 "rendered/$date/seq-$seq.jpg"
            done
          done
          find rendered -type f -name '*.jpg' | sort > rendered-inventory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 1921-enterprise-feb25-mar11-renders
          path: |
            rendered/
            rendered-inventory.txt
          retention-days: 14
