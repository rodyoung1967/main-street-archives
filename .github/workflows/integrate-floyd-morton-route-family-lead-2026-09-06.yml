name: Integrate Floyd Morton route family lead

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/integrate-floyd-morton-route-family-lead-2026-09-06.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Validate before edit
        run: python3 scripts/validate_archive.py
      - name: Integrate family route lead
        run: python3 scripts/integrate_floyd_morton_route_family_lead.py
      - name: Validate after edit
        run: python3 scripts/validate_archive.py
      - name: Commit and push
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add \
            evidence/source-captures/lafarlette-morton-chronology-controls-2026-09-06.md \
            evidence/source-captures/morton-wheel-1945-1947-online-access-and-lafarlette-control-pass-2026-09-06.md \
            evidence/source-captures/morton-wheel-to-oregon-city-wheel-ownership-bridge-pass-2026-09-05.md \
            people/profiles/floyd-lafarlette.md \
            registers/research-requests/morton-wheel-and-oregon-city-wheel-pre-raye-ownership-bridge-request-2026-09-05.md \
            MANUAL-FOLLOWUP.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add Floyd Morton route family lead'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
