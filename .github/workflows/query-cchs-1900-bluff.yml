name: Query CCHS 1900 bluff photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/query-cchs-1900-bluff.yml'
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query CatalogIt
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          queries = [
              "Oregon City 1900 ca Viewed from the Bluff Main between 5th and 7th Streets",
              "Viewed from the Bluff Main between 5th and 7th",
              "Oregon City 1900 Bluff 5th 7th",
          ]
          def walk(o):
              if isinstance(o, dict):
                  yield o
                  for v in o.values(): yield from walk(v)
              elif isinstance(o, list):
                  for v in o: yield from walk(v)
          def cat(d):
              try: return d['properties']['hasCatalogNumber']['value_text']
              except Exception: return None
          seen=set()
          for q in queries:
              url='https://api.catalogit.app/api/public/search?'+urllib.parse.urlencode({'query':q,'size':100})
              print('\nQUERY',q,'URL',url)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Main-Street-Archive/1.0'})
              data=json.load(urllib.request.urlopen(req,timeout=90))
              for d in walk(data):
                  c=cat(d)
                  title=d.get('title') or d.get('name') or d.get('label') or d.get('slug')
                  if c and (c,title) not in seen:
                      seen.add((c,title))
                      print('CANDIDATE',c,'|',title,'| id=',d.get('id'),'| slug=',d.get('slug'))
          PY
