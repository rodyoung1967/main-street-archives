name: Integrate 1940 aerial rereview

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_1940_aerial_rereview.py'
      - '.github/workflows/integrate-1940-aerial-rereview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate aerial rereview
        run: python3 scripts/integrate_1940_aerial_rereview.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit integrated records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence buildings timelines timeline.md media docs registers database
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Integrate 1940 aerial footprint rereview'
          git pull --rebase origin main
          git push origin HEAD:main
