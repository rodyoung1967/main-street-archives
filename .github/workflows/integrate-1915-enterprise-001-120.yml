name: Run 1915 Enterprise pages 1-120 integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-1915-enterprise-001-120.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main
        run: git pull --rebase origin main

      - name: Integrate reviewed pages
        run: python3 scripts/integrate_1915_enterprise_001_120.py

      - name: Normalize mirrored names
        run: |
          sed -i 's/name: Morning Enterprise 1915 visual batch, chronological pages 1-120/name: Morning Enterprise 1915 visual batch, chronological pages 1–120/' database/sources.yml
          sed -i 's/name: 1915 Enterprise pages 1-120 visual review/name: 1915 Enterprise pages 1–120 visual review/' database/evidence.yml

      - name: Validate archive
        run: python3 scripts/validate_archive.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newspapers/oregon-city-enterprise/1915-pages-001-120 \
            evidence/source-captures/1915-enterprise-pages-001-120.md \
            evidence/source-captures/1915-main-street-repaving.md \
            evidence/source-captures/1915-page-review-checklist.md \
            evidence/source-register.md evidence/evidence-register.md \
            database/sources.yml database/evidence.yml database/timeline.yml \
            media/photo-metadata-register.md registers/year-status.md \
            registers/research-log.md registers/address-register.md timeline.md
          git commit -m "Integrate first 120 1915 Enterprise visual reviews"
          git pull --rebase origin main
          git push origin HEAD:main
