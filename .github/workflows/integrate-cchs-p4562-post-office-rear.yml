name: Integrate CCHS P-4562 Post Office rear view

on:
  push:
    branches: [main]
    paths:
      - 'research-inbox/p4562-steward-post-office-rear.jpg'
      - 'scripts/integrate_cchs_p4562_mid1960s_post_office_rear.py'
      - '.github/workflows/integrate-cchs-p4562-post-office-rear.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python3 -m pip install pillow pyyaml
      - name: Repair staged P-4562 derivative from exact CCHS object
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, urllib.parse, urllib.request
          from io import BytesIO
          from PIL import Image

          target = 'P-4562'
          account = '4813'
          staged = Path('research-inbox/p4562-steward-post-office-rear.jpg')
          script = Path('scripts/integrate_cchs_p4562_mid1960s_post_office_rear.py')

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 Main-Street-Archive/1.0'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.load(r)

          def get_bytes(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 Main-Street-Archive/1.0'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return r.read()

          def catno(obj):
              try:
                  return obj['properties']['hasCatalogNumber']['value_text']
              except Exception:
                  return None

          def find_match(obj):
              if isinstance(obj, dict):
                  if catno(obj) == target:
                      return obj
                  for v in obj.values():
                      m = find_match(v)
                      if m is not None:
                          return m
              elif isinstance(obj, list):
                  for v in obj:
                      m = find_match(v)
                      if m is not None:
                          return m
              return None

          search_url = 'https://api.catalogit.app/api/public/search?' + urllib.parse.urlencode({'query': target, 'size': 50})
          result = get_json(search_url)
          match = find_match(result)
          if match is None or not match.get('id'):
              raise SystemExit('Exact CCHS P-4562 object not returned by CatalogIt search')
          entry_url = f"https://api.catalogit.app/api/public/accounts/{account}/entries/{match['id']}"
          entry = get_json(entry_url)
          if catno(entry) != target:
              raise SystemExit(f"Catalog mismatch: {catno(entry)}")

          candidates = []
          for media in entry.get('media', []):
              for key, val in media.get('derivatives', {}).items():
                  if not isinstance(val, dict) or not val.get('path'):
                      continue
                  if 'thumbnail' in key.lower() or key in {'complementary_color', 'dominant_color'}:
                      continue
                  w = int(val.get('width') or 0)
                  h = int(val.get('height') or 0)
                  if w and h:
                      candidates.append((w*h, w, h, key, val['path']))
          if not candidates:
              raise SystemExit('No public image derivative found for exact P-4562 object')
          candidates.sort(reverse=True)
          _, _, _, derivative_key, derivative_url = candidates[0]
          data = get_bytes(derivative_url)
          with Image.open(BytesIO(data)) as im:
              im.verify()
          with Image.open(BytesIO(data)) as im:
              width, height = im.size
          sha = hashlib.sha256(data).hexdigest()
          staged.parent.mkdir(parents=True, exist_ok=True)
          staged.write_bytes(data)

          text = script.read_text(encoding='utf-8')
          text = re.sub(
              r'DERIVATIVE = \{\n\s+"width": \d+,\n\s+"height": \d+,\n\s+"bytes": \d+,\n\s+"sha256": "[0-9a-f]+",\n\}',
              'DERIVATIVE = {\n'
              f'    "width": {width},\n'
              f'    "height": {height},\n'
              f'    "bytes": {len(data)},\n'
              f'    "sha256": "{sha}",\n'
              '}',
              text,
              count=1,
          )
          text = text.replace(
              'No live online catalog lookup or replacement photograph was used in this integration. The metadata above is preserved exactly as supplied by the project steward.',
              'The exact live CCHS CatalogIt object was retrieved by catalog number to preserve a valid repository image derivative. The steward-supplied metadata and original-file provenance are preserved separately.'
          )
          text = text.replace(
              "Because the repository write connector does not accept the steward's local binary directly, the committed repository copy is a **locally generated derivative of the supplied image**, not an online replacement:",
              'The committed repository copy is the **largest public image derivative recovered from the exact CCHS P-4562 object**. The steward-supplied original remains separately tracked by filename, dimensions, bytes and SHA-256:'
          )
          text = text.replace(
              '- Derivation: resized from the steward upload with local image processing; no new historical content or online image substituted.',
              f'- Public derivative source: {derivative_url} (CatalogIt derivative key `{derivative_key}`).'
          )
          text = text.replace(
              'No live online catalog lookup or replacement image was used; repository binary is a locally generated derivative of the steward upload.',
              'The repository binary is a public CCHS derivative recovered from the exact P-4562 object; the steward original is separately tracked by its supplied file metadata.'
          )
          text = text.replace(
              '- Derivative note: repository binary was generated locally from the steward upload because the repository connector could not directly accept the local binary; no online replacement photo was fetched.',
              '- Derivative note: repository binary is the largest valid public CCHS derivative recovered from the exact P-4562 CatalogIt object; the steward original is separately tracked by supplied filename/dimensions/bytes/SHA-256.'
          )
          text = text.replace(
              '- **Local-first handling:** no online replacement photograph was fetched. The repository binary is a locally generated 300×240 derivative of the steward upload, and the exact original filename/dimensions/bytes/SHA-256 are preserved in metadata.',
              '- **Repository-image recovery:** the prior staged derivative could not be decoded by Pillow. The exact CCHS P-4562 CatalogIt object was therefore used to recover a valid public derivative; the steward original filename/dimensions/bytes/SHA-256 remain preserved in metadata.'
          )
          text = text.replace(
              'Repository binary is a local derivative of steward upload; no online replacement photo fetched.',
              'Repository binary is a valid public derivative recovered from the exact CCHS P-4562 object; steward-original provenance is preserved separately.'
          )
          text = text.replace(
              '- Repository binary is a local derivative of the steward upload; exact original filename/dimensions/size/hash are preserved in `media/photo-metadata-register.md`.',
              '- Repository binary is a public derivative from the exact CCHS P-4562 object; exact steward-original filename/dimensions/size/hash are preserved in `media/photo-metadata-register.md`.'
          )
          script.write_text(text, encoding='utf-8')
          print(f'Recovered P-4562 derivative: {width}x{height}, {len(data)} bytes, sha256 {sha}')
          PY
      - name: Integrate P-4562
        run: python3 scripts/integrate_cchs_p4562_mid1960s_post_office_rear.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Integrate CCHS P-4562 Post Office rear view'
          git pull --rebase origin main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
