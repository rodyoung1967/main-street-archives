name: Fetch August 1917 Oregon City Enterprise

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-1917-enterprise-august.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync to latest main
        run: git pull --rebase origin main
      - name: Validate archive before retrieval
        run: python3 scripts/validate_archive.py
      - name: Download August Enterprise page PDFs
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, requests, time
          dates=['1917-08-03','1917-08-10','1917-08-17','1917-08-24','1917-08-31']
          out=pathlib.Path('newspapers/oregon-city-enterprise/1917-august')
          out.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'main-street-archives archival retrieval'})
          manifest={'title':'Oregon City Enterprise','lccn':'sn00063700','year':1917,'month':'August','issues':[]}
          for date in dates:
              issue={'date':date,'page_count':0,'pages':[]}
              for seq in range(1,9):
                  url=f'https://oregonnews.uoregon.edu/lccn/sn00063700/{date}/ed-1/seq-{seq}.pdf'
                  r=s.get(url,timeout=60); r.raise_for_status()
                  fn=f'{date}-seq-{seq:02d}.pdf'
                  data=r.content; (out/fn).write_bytes(data)
                  issue['pages'].append({'sequence':seq,'file':fn,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
                  issue['page_count']+=1
                  time.sleep(.06)
              manifest['issues'].append(issue)
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Upload August originals
        uses: actions/upload-artifact@v4
        with:
          name: 1917-enterprise-august
          path: newspapers/oregon-city-enterprise/1917-august/
          retention-days: 14
      - name: Commit preserved originals
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add newspapers/oregon-city-enterprise/1917-august/
          if git diff --cached --quiet; then
            echo 'No August retrieval changes.'
            exit 0
          fi
          git commit -m 'Archive August 1917 Oregon City Enterprise scans'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
