name: Integrate CCHS P-5578 1927 aerial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-cchs-p5578-1927-aerial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow PyYAML
      - name: Integrate P-5578 and validate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate_cchs_p5578_1927_aerial.py')
          s = p.read_text(encoding='utf-8')
          old = '''for p in ("evidence/source-register.md", "media/photo-metadata-register.md", "indexes/id-crosswalk.md"):
              if TARGET in rd(p):
                  print(f"{TARGET} already integrated; no changes needed.")
                  raise SystemExit(0)
          '''
          new = '''if (
              f"Catalog ID: `{TARGET}`" in rd("evidence/source-register.md")
              or f"CCHS object: **{TARGET}**" in rd("media/photo-metadata-register.md")
          ):
              print(f"{TARGET} already integrated as its own archival object; no changes needed.")
              raise SystemExit(0)
          '''
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          elif new not in s:
              raise SystemExit('Could not locate P-5578 idempotency block to repair')
          PY
            python3 scripts/integrate_cchs_p5578_1927_aerial.py
            python3 scripts/validate_archive.py
            git add -A
            if git diff --cached --quiet; then
              echo 'P-5578 already integrated.'
              exit 0
            fi
            git commit -m "Integrate CCHS P-5578 1927 aerial and two-story 501 observation"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
