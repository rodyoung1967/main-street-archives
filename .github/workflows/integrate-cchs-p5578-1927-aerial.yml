name: Integrate CCHS P-5578 1927 aerial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-cchs-p5578-1927-aerial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow PyYAML
      - name: Integrate P-5578 and validate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/integrate_cchs_p5578_1927_aerial.py
            python3 scripts/validate_archive.py
            git add -A
            if git diff --cached --quiet; then
              echo 'P-5578 already integrated.'
              exit 0
            fi
            git commit -m "Integrate CCHS P-5578 1927 aerial and two-story 501 observation"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
