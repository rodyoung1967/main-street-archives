name: Apply Task 8 integration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Add Task 8 integration runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Task 8 integration
        run: python scripts/task8_integrate_address_bridge.py
      - name: Validate archive before commit
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python scripts/validate_archive.py
      - name: Commit integrated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Task 7 address-property findings"
          git push
