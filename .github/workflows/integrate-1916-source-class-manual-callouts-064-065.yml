name: Integrate 1916 source class manual callouts 064 065

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-1916-source-class-manual-callouts-064-065.yml'
      - 'scripts/integrate_1916_source_class_manual_callouts_064_065.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync newest main
        run: git pull --rebase origin main
      - name: Validate before integration
        run: python3 scripts/validate_archive.py
      - name: Integrate source-class callouts
        run: python3 scripts/integrate_1916_source_class_manual_callouts_064_065.py
      - name: Validate integrated archive
        run: python3 scripts/validate_archive.py
      - name: Commit and publish integration
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add MANUAL-FOLLOWUP.md evidence/source-captures/1916-online-audit-checkpoint.md
          if git diff --cached --quiet; then echo 'No integration changes'; exit 0; fi
          git commit -m 'Classify 1916 Morning Enterprise and tax list as manual'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
