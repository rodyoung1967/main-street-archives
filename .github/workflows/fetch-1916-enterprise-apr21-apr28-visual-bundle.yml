name: Fetch 1916 Enterprise Apr 21 and Apr 28 visual bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-1916-enterprise-apr21-apr28-visual-bundle.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Validate full archive before fetch
        run: python3 scripts/validate_archive.py
      - name: Fetch original page PDFs
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, requests, time
          issues=[('1916-04-21',14),('1916-04-28',14)]
          s=requests.Session(); s.headers.update({'User-Agent':'main-street-archives annual visual audit'})
          root=pathlib.Path('newspapers/oregon-city-enterprise/1916')
          for date,max_pages in issues:
            out=root/date; out.mkdir(parents=True,exist_ok=True)
            attempts=[]; saved=0
            for seq in range(1,max_pages+1):
              url=f'https://oregonnews.uoregon.edu/lccn/sn00063700/{date}/ed-1/seq-{seq}.pdf'
              row={'sequence':seq,'url':url}
              try:
                r=s.get(url,timeout=90,allow_redirects=True)
                row.update(status=r.status_code,content_type=r.headers.get('content-type',''),bytes=len(r.content),sha256=hashlib.sha256(r.content).hexdigest(),final_url=r.url)
                if r.status_code==200 and r.content.startswith(b'%PDF'):
                  name=f'{date}-page-{seq}.pdf'; (out/name).write_bytes(r.content); row['saved_as']=name; saved+=1
              except Exception as e: row['error']=repr(e)
              attempts.append(row); time.sleep(.1)
            (out/'fetch-manifest.json').write_text(json.dumps({'title':'Oregon City Enterprise','lccn':'sn00063700','date':date,'attempted_sequences':max_pages,'saved_pages':saved,'attempts':attempts},indent=2)+'\n')
          PY
      - name: Validate full archive after fetch
        run: python3 scripts/validate_archive.py
      - name: Upload visual-review bundle
        uses: actions/upload-artifact@v4
        with:
          name: 1916-enterprise-apr21-apr28-visual-bundle
          path: |
            newspapers/oregon-city-enterprise/1916/1916-04-21/
            newspapers/oregon-city-enterprise/1916/1916-04-28/
          retention-days: 14
      - name: Commit fetched scans
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add newspapers/oregon-city-enterprise/1916/1916-04-21/ newspapers/oregon-city-enterprise/1916/1916-04-28/
          if git diff --cached --quiet; then echo 'No fetch changes'; exit 0; fi
          git commit -m 'Preserve Enterprise Apr 21 and Apr 28 1916 scans'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
