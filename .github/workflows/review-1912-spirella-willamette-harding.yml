name: Review 1912 Spirella Willamette Harding page

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-1912-spirella-willamette-harding.yml"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - name: Fetch and render original page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/spirella-review
          curl -fL --retry 3 -A 'main-street-archives archival review/1.0' \
            'https://oregonnews.uoregon.edu/lccn/sn00063701/1912-09-07/ed-1/seq-3.pdf' \
            -o /tmp/spirella-review/1912-09-07-page-3.pdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftoppm -f 1 -singlefile -png -r 200 /tmp/spirella-review/1912-09-07-page-3.pdf /tmp/spirella-review/1912-09-07-page-3
          sha256sum /tmp/spirella-review/* > /tmp/spirella-review/SHA256SUMS.txt
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1912-spirella-willamette-harding-review
          path: /tmp/spirella-review
          retention-days: 7
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/review-1912-spirella-willamette-harding.yml
          git add -A
          git commit -m "Complete temporary 1912 Willamette Harding scan fetch"
          git pull --rebase origin main
          git push origin HEAD:main
