name: Fetch 1912 Courier gap pages 2026-09-09

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-1912-courier-gap-pages-2026-09-09.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and validate
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 scripts/validate_archive.py

      - name: Fetch targeted 1912 Courier pages and render previews
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/1912-courier-gap-recovery"
          mkdir -p "$out/pdfs" "$out/png"
          printf 'date\tseq\thttp\tvalid_pdf\tbytes\tsha256\ttext_head\n' > "$out/manifest.tsv"

          fetch_one() {
            d="$1"; n="$2"
            stem="${d}-seq-$(printf '%02d' "$n")"
            url="https://oregonnews.uoregon.edu/lccn/sn00063698/${d}/ed-1/seq-${n}.pdf"
            tmp="$out/${stem}.tmp"
            code=$(curl --location --silent --show-error --retry 2 --retry-delay 1 --connect-timeout 20 --max-time 180 \
              --user-agent "Mozilla/5.0 (main-street-archives research)" \
              --write-out '%{http_code}' --output "$tmp" "$url" || true)
            valid=no
            bytes=0
            sha='-'
            headtxt='-'
            if [ -f "$tmp" ]; then bytes=$(wc -c < "$tmp" | tr -d ' '); fi
            if [ -f "$tmp" ] && [ "$(head -c 4 "$tmp" 2>/dev/null || true)" = "%PDF" ]; then
              valid=yes
              mv "$tmp" "$out/pdfs/${stem}.pdf"
              sha=$(sha256sum "$out/pdfs/${stem}.pdf" | awk '{print $1}')
              pdftotext -f 1 -l 1 -layout "$out/pdfs/${stem}.pdf" "$out/${stem}.txt" || true
              headtxt=$(tr '\n' ' ' < "$out/${stem}.txt" 2>/dev/null | tr '\t' ' ' | sed 's/  */ /g' | cut -c1-220)
              pdftoppm -f 1 -singlefile -png -r 125 "$out/pdfs/${stem}.pdf" "$out/png/${stem}" >/dev/null 2>&1 || true
              rm -f "$out/${stem}.txt"
            else
              rm -f "$tmp"
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$d" "$n" "$code" "$valid" "$bytes" "$sha" "$headtxt" >> "$out/manifest.tsv"
          }

          # Jan. 19 pages 5-8 are the immediate visual gap.
          for n in 5 6 7 8; do fetch_one 1912-01-19 "$n"; done

          # Probe through sequence 12 for issue-size/association gaps.
          for d in 1912-02-23 1912-05-03 1912-05-17 1912-05-24 1912-08-02 1912-12-13; do
            for n in $(seq 1 12); do fetch_one "$d" "$n"; done
          done

          cp "$out/manifest.tsv" "$GITHUB_WORKSPACE/1912-courier-gap-manifest.tsv"
          echo '--- retrieval manifest ---'
          cat "$out/manifest.tsv"

      - name: Upload retrieval artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1912-courier-gap-recovery-2026-09-09
          path: |
            ${{ runner.temp }}/1912-courier-gap-recovery/pdfs
            ${{ runner.temp }}/1912-courier-gap-recovery/png
            ${{ runner.temp }}/1912-courier-gap-recovery/manifest.tsv
          retention-days: 7

      - name: Remove temporary workflow and preserve retrieval manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_archive.py
          git config user.name "main-street-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p evidence/source-captures/retrieval-manifests
          cp 1912-courier-gap-manifest.tsv evidence/source-captures/retrieval-manifests/1912-courier-gap-recovery-2026-09-09.tsv
          rm -f 1912-courier-gap-manifest.tsv
          git rm .github/workflows/fetch-1912-courier-gap-pages-2026-09-09.yml
          git add evidence/source-captures/retrieval-manifests/1912-courier-gap-recovery-2026-09-09.tsv
          git commit -m "Archive 1912 Courier gap retrieval manifest"
          git pull --rebase origin main
          git push origin HEAD:main
