name: Integrate 1946-48 Clackamas directory production route

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_1946_1948_clackamas_directory_production_route.py'
      - '.github/workflows/integrate-1946-1948-clackamas-directory-production-route.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: pip install PyYAML
      - name: Integrate directory production and retrieval route
        run: python3 scripts/integrate_1946_1948_clackamas_directory_production_route.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate 1946-48 Clackamas directory production route'
          git pull --rebase origin main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
