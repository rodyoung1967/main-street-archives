name: Temporary CCHS P267 source-association repair

on:
  push:
    paths:
      - .github/workflows/temp-repair-cchs-p267-association.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install pyyaml pillow

      - name: Synchronize current main
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --ff-only origin main

      - name: Baseline archive validation
        run: python3 scripts/validate_archive.py

      - name: Repair P-267 source association and repository image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import hashlib, json, urllib.request

          ENTRY_ID = 'd0789660-9b1e-11eb-b3ef-53e7205a00b4'
          EXPECTED_CATALOG = 'P-267'
          EXPECTED_TITLE = 'Oregon City and the Arch Bridge as Seen from Bluff.'
          TARGET_DHASH = int('398e0dc918251b5080f8e678e3e1b0369f361a623fe2329675141d88032a03ad', 16)
          IMAGE_PATH = Path('media/photos/early-main-street/IMG-0770_1924-1928-arch-bridge-bluff-target-frontage-cchs-p-267.jpg')

          def fetch_json(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Main-Street-Archive/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r: return json.load(r)
          def fetch_bytes(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Main-Street-Archive/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r: return r.read()
          def dhash256(im):
              g=im.convert('L').resize((17,16))
              px=list(g.getdata())
              bits=[]
              for y in range(16):
                  row=px[y*17:(y+1)*17]
                  bits.extend(row[x+1] > row[x] for x in range(16))
              val=0
              for b in bits: val=(val<<1)|int(b)
              return val
          def hamming(a,b): return (a^b).bit_count()

          api=f'https://api.catalogit.app/api/public/accounts/4813/entries/{ENTRY_ID}'
          entry=fetch_json(api)
          cat=entry.get('properties',{}).get('hasCatalogNumber',{}).get('value_text')
          title=entry.get('properties',{}).get('hasName',{}).get('value_text')
          if cat != EXPECTED_CATALOG or title != EXPECTED_TITLE:
              raise SystemExit(f'Correct-entry guard failed: catalog={cat!r}, title={title!r}')

          candidates=[]
          for media in entry.get('media',[]):
              derivs=media.get('derivatives',{})
              vals=[]
              for k,v in derivs.items():
                  if not isinstance(v,dict) or not v.get('path') or 'thumbnail' in k.lower(): continue
                  w=int(v.get('width') or 0); h=int(v.get('height') or 0)
                  if w and h: vals.append((w*h,k,v['path']))
              if not vals: continue
              _, key, url=max(vals)
              raw=fetch_bytes(url)
              im=Image.open(BytesIO(raw)); im.load()
              d=dhash256(im)
              dist=hamming(d,TARGET_DHASH)
              candidates.append((dist, -(im.width*im.height), media.get('uuid'), media.get('name'), key, url, raw, im.width, im.height, im.format))
              print('candidate', media.get('uuid'), media.get('name'), key, im.size, 'dhash_distance', dist, url)
          if not candidates: raise SystemExit('No image candidates in correct CCHS entry')
          candidates.sort(key=lambda x:(x[0],x[1]))
          dist, _, uuid, media_name, key, url, raw, w, h, fmt=candidates[0]
          if dist > 64:
              raise SystemExit(f'Best CCHS media does not sufficiently match steward image; dHash distance={dist}/256')
          print('SELECTED', uuid, media_name, key, (w,h), 'distance', dist)
          IMAGE_PATH.write_bytes(raw)
          sha=hashlib.sha256(raw).hexdigest()
          n=len(raw)
          slug=entry.get('slug')
          hub=f'https://hub.catalogit.app/clackamas-county-historical-society/folder/photographs/entry/{slug}'

          OLD_ENTRY='https://api.catalogit.app/api/public/accounts/4813/entries/2fe23470-76a1-11ee-bc74-3dd853f6747b'
          OLD_HUB='https://hub.catalogit.app/clackamas-county-historical-society/folder/photographs/entry/on-the-tamiami-trail-in-florida-f33'
          OLD_SHA='b45bef315489b0a475769d696e7322332f0d6b6be00a479f3db2c46599c6d9bb'
          old_dim='1200 × 740'
          old_bytes='251,706'
          new_dim=f'{w} × {h}'
          new_bytes=f'{n:,}'

          text_ext={'.md','.yml','.yaml','.txt','.tsv','.csv'}
          changed=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in text_ext: continue
              try: s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              old=s
              s=s.replace(OLD_ENTRY, api).replace(OLD_HUB, hub).replace(OLD_SHA, sha)
              # Dimensions/bytes replacement only in P-267-specific records, guarded by IMG-0770 or catalog token.
              if ('IMG-0770' in s or 'P‑267' in s) and OLD_SHA in old:
                  s=s.replace(old_dim,new_dim).replace(old_bytes,new_bytes)
              if s != old:
                  p.write_text(s,encoding='utf-8'); changed.append(str(p))

          cap=Path('evidence/source-captures/p-267-1924-1928-arch-bridge-bluff-target-frontage-2026-09-09.md')
          s=cap.read_text(encoding='utf-8')
          note=f'''\n\n## Source-association correction — 9 September 2026\n\nAn initial automated CatalogIt lookup matched catalog number `P‑267` without also requiring the Oregon City title and therefore selected an unrelated duplicate-number CatalogIt object. That association and its repository derivative were rejected and replaced. The corrected institutional control requires **both** catalog number `P‑267` and title **{EXPECTED_TITLE}**, resolving to API entry `{ENTRY_ID}` / slug `{slug}`. `IMG-0770` now contains the matching CCHS media derivative selected against the steward-supplied photograph by perceptual-image comparison (dHash distance **{dist}/256**); repository SHA-256 `{sha}`, dimensions **{w} × {h}**, {n:,} bytes. The historical structural interpretation remains based on the visually reviewed steward-supplied Oregon City photograph and is unchanged; this correction fixes provenance/binary association only.\n'''
          if '## Source-association correction — 9 September 2026' not in s:
              cap.write_text(s.rstrip()+note+'\n',encoding='utf-8')

          log=Path('registers/research-log.md')
          s=log.read_text(encoding='utf-8')
          lognote=f'''\n\n### 2026-09-09 — CCHS P‑267 duplicate-catalog source-association correction\n\nCorrected `S-312` / `E-284` / `IMG-0770`: an initial catalog-number-only CatalogIt lookup selected an unrelated duplicate `P‑267` object. The exact Oregon City title+catalog match is entry `{ENTRY_ID}` (`{slug}`). Replaced the incorrect repository derivative with the matching CCHS media derivative selected by perceptual comparison to the steward upload (dHash {dist}/256; SHA-256 `{sha}`; {w}×{h}; {n:,} bytes). No historical claim, ID, structural bracket, or confidence level changed; this was a provenance/binary repair.\n'''
          if 'CCHS P‑267 duplicate-catalog source-association correction' not in s:
              log.write_text(s.rstrip()+lognote+'\n',encoding='utf-8')

          print(json.dumps({'entry':api,'hub':hub,'selected_url':url,'selected_uuid':uuid,'selected_name':media_name,'dhash_distance':dist,'sha256':sha,'width':w,'height':h,'bytes':n,'text_files_repaired':changed},indent=2))
          PY

      - name: Validate repaired archive
        run: python3 scripts/validate_archive.py

      - name: Commit and push repair
        run: |
          set -euo pipefail
          git config user.name 'main-street-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add media evidence database buildings timelines timeline.md indexes registers
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git commit -m 'Correct CCHS P-267 source association'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            python3 scripts/validate_archive.py
          done
          exit 1
