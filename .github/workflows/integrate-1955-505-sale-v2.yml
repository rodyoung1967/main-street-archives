name: Integrate 1955 505 sale visual review v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-1955-505-sale-v2.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified 1955 sale-page integration
        run: python3 .github/scripts/integrate_1955_sale_visual.py
