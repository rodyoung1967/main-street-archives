name: Integrate CCHS P-4563 northeast 5th/Main scene

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_cchs_p4563_mid1960s_northeast_5th_main.py'
      - '.github/workflows/integrate-cchs-p4563-northeast-5th-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow PyYAML
      - name: Integrate P-4563 photograph and northeast-corner context
        run: python3 scripts/integrate_cchs_p4563_mid1960s_northeast_5th_main.py
      - name: Validate archive
        run: python3 scripts/validate_archive.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate CCHS P-4563 northeast 5th Main scene'
          git pull --rebase origin main
          python3 scripts/validate_archive.py
          git push origin HEAD:main
