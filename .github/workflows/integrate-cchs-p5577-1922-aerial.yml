name: Cleanup P-5577 integration helpers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-cchs-p5577-1922-aerial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML
      - name: Fix retained script, validate, and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          sed -i 's/f"### {MID} — CCHS {TARGET}/f"## {MID} — CCHS {TARGET}/' scripts/integrate_cchs_p5577_1922_aerial.py
          sed -i "s/f'''### {MID} — CCHS {TARGET}/f'''## {MID} — CCHS {TARGET}/" scripts/integrate_cchs_p5577_1922_aerial.py
          git rm -f .github/workflows/integrate-cchs-p5577-1922-aerial.yml
          if [ -f .github/workflows/integrate-p1043-fains-address.yml ]; then git rm -f .github/workflows/integrate-p1043-fains-address.yml; fi
          python3 scripts/validate_archive.py
          git add -A
          git commit -m "Clean temporary photo research workflows"
          git push origin HEAD:main
