name: Temporary Jan 19 1912 Courier pages 5-8 integration
# rerun after YAML/person-ID handling fix — retry 2

on:
  push:
    paths:
      - .github/workflows/temp-1912-jan19-p5-p8-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependency
        run: python -m pip install pyyaml

      - name: Synchronize current main
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --ff-only origin main

      - name: Baseline archive validation
        run: python3 scripts/validate_archive.py

      - name: Integrate pages 5-8 metadata and findings
        run: python3 scripts/integrate_1912_jan19_pages5_8.py

      - name: Validate integrated archive
        run: python3 scripts/validate_archive.py

      - name: Commit and push integrated findings
        run: |
          set -euo pipefail
          git config user.name 'main-street-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add evidence database businesses people indexes registers
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate Jan 19 1912 Courier pages 5-8'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            python3 scripts/validate_archive.py
          done
          echo 'Push failed after retries.' >&2
          exit 1
