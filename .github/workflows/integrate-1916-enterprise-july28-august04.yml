name: Integrate 1916 Enterprise July 28 and August 4 visual reviews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_1916_enterprise_july28_august04.py'
      - '.github/workflows/integrate-1916-enterprise-july28-august04.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync newest main
        run: git pull --rebase origin main
      - name: Validate before integration
        run: python3 scripts/validate_archive.py
      - name: Integrate certified reviews
        run: python3 scripts/integrate_1916_enterprise_july28_august04.py
      - name: Validate integrated archive
        run: python3 scripts/validate_archive.py
      - name: Commit and publish integration
        run: |
          git config user.name main-street-archive-bot
          git config user.email actions@users.noreply.github.com
          git add database/sources.yml database/evidence.yml evidence/source-register.md evidence/evidence-register.md evidence/source-captures/1916-online-audit-checkpoint.md registers/year-status.md
          if git diff --cached --quiet; then echo 'No integration changes'; exit 0; fi
          git commit -m 'Integrate July 28 and August 4 1916 Enterprise reviews'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/validate_archive.py
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
