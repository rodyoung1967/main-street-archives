name: Sync Farr-Harr transition chronology

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-farr-harr-transition-chronology.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-farr-harr-transition-chronology
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lock to newest main at job start
        run: |
          git fetch origin main
          git reset --hard origin/main
          git rev-parse HEAD > /tmp/farr_harr_base_sha
      - name: Apply chronology synchronization
        run: python3 scripts/sync_farr_harr_transition_chronology.py
      - name: Validate synchronized archive
        run: python3 scripts/validate_archive.py
      - name: Publish without overwriting concurrent main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -f scripts/sync_farr_harr_transition_chronology.py
          rm -f .github/workflows/sync-farr-harr-transition-chronology.yml
          git add -A

          if git diff --cached --quiet; then
            echo 'No persistent chronology changes required.'
            exit 0
          fi

          git commit -m 'Sync 1936 Farr anchor into transition chronology'

          base_sha="$(cat /tmp/farr_harr_base_sha)"
          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$base_sha" ]; then
            echo "Remote main advanced from $base_sha to $remote_sha; refusing to overwrite concurrent work." >&2
            exit 1
          fi

          git push origin HEAD:main
