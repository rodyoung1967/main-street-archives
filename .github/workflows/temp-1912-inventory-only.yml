name: Temporary 1912 Inventory Only

on:
  push:
    branches:
      - research/1912-online-closeout
    paths:
      - scripts/temp_1912_inventory_only.py
      - .github/workflows/temp-1912-inventory-only.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/temp_1912_inventory_only.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1912-inventory-only
          path: inventory-results/
          if-no-files-found: warn
          retention-days: 3
