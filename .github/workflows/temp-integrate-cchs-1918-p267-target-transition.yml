name: Temporary CCHS 1918-P267 target transition integration

on:
  push:
    paths:
      - .github/workflows/temp-integrate-cchs-1918-p267-target-transition.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install pyyaml pillow

      - name: Synchronize current main
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --ff-only origin main

      - name: Baseline archive validation
        run: python3 scripts/validate_archive.py

      - name: Correct temporary integrator indentation handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/integrate_cchs_1918_p267_target_transition.py')
          s = p.read_text(encoding='utf-8')
          old = 'wr(path, text.rstrip() + "\\n\\n" + block.strip() + "\\n")'
          new = 'wr(path, text.rstrip() + "\\n\\n" + block.strip("\\n") + "\\n")'
          if old not in s:
              raise SystemExit('expected append_once line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Integrate photographs and structural bracket
        run: python3 scripts/integrate_cchs_1918_p267_target_transition.py

      - name: Normalize external catalog token and cross-source evidence record
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          names = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          for line in subprocess.check_output(['git','status','--porcelain'], text=True).splitlines():
              if len(line) >= 4:
                  names.add(line[3:])
          for name in names:
              p = Path(name)
              if not p.is_file() or p.suffix.lower() in {'.jpg','.jpeg','.png','.pdf','.zip'}:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              # CCHS external catalog number P-267 would collide with the archive P-### person-ID validator.
              s = s.replace('P-267', 'P‑267')
              if name == 'evidence/evidence-register.md':
                  s = s.replace('## E-285 — 1918→1925 target-frontage physical-change bracket',
                                '## E-285 — 1918 to 1925 target-frontage physical-change bracket')
                  needle = '## E-285 — 1918 to 1925 target-frontage physical-change bracket\n<!-- 2026-09-09-cchs-1918-p267-target-transition -->\n'
                  repl = needle + 'Type: Cross-source photographic and Sanborn structural inference  \n'
                  if needle in s and 'Type: Cross-source photographic and Sanborn structural inference' not in s[s.index(needle):s.index(needle)+300]:
                      s = s.replace(needle, repl, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate integrated archive
        run: python3 scripts/validate_archive.py

      - name: Commit and push integration
        run: |
          set -euo pipefail
          git config user.name 'main-street-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add media evidence database buildings timelines timeline.md indexes registers
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate 1918 and P-267 target-frontage photographs'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            python3 scripts/validate_archive.py
          done
          echo 'Push failed after retries.' >&2
          exit 1
